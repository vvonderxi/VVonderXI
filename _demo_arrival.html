<style>
:root{--ink-soft:#a49d93;--cream:#F0EAD9;--cream-deep:#E2D8C4;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--pink-glow:#FF8FA3;--gold:#E8B84B}
body.light{--ink-soft:#5f594e}
*{box-sizing:border-box} html,body{margin:0}
/* ---------- page under test ---------- */
body.cs{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;
  font-family:'Inter',system-ui,sans-serif;color:var(--cream);
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,244,224,.07), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);background-attachment:fixed}
body.cs.light{color:#241f1a;
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.7), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);background-attachment:fixed}
.wrap{width:100%;max-width:700px;padding:40px 22px 54px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{display:block;height:32px;width:auto;margin-bottom:26px}
.stage{position:relative;display:flex;justify-content:center;align-items:center;gap:16px}
.tag{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;font-size:27px;line-height:1.3;
     letter-spacing:-.01em;margin:28px 0 0;max-width:15em}
.tag .pk{color:var(--pink-ink)} body.light .tag .pk{color:#AD0332}
.brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.2em;
       text-transform:uppercase;opacity:.45;margin-top:16px}
.notify{margin-top:28px;width:100%;max-width:440px;text-align:left;
  background:linear-gradient(135deg,rgba(255,92,122,0.10),rgba(255,255,255,0.04));
  border:1px solid rgba(255,92,122,0.22);border-radius:16px;padding:18px 20px}
body.light .notify{background:linear-gradient(135deg,rgba(231,4,67,.06),rgba(0,0,0,.02));border-color:rgba(231,4,67,.18)}
.notify .nt{font-family:'Archivo',sans-serif;font-weight:900;font-size:14.5px;margin-bottom:4px}

@media (max-width:820px){ .wrap{padding:26px 16px 40px} .tag{font-size:22px;margin-top:22px} }
@media (max-width:420px){ .tag{font-size:20px} .form{flex-direction:column} .form button{width:100%} }

/* ---------- ARRIVAL , the three directions ---------- */
/*  Every reveal is a CLASS the JS adds once, never a loop. The finished state is the
    DEFAULT and the animation only delays it, so prefers-reduced-motion needs one rule
    that cancels the delay rather than a second code path. */
.arr .vvcard{opacity:1}
/* A , the card assembles */
.a .cardslot{opacity:0;transform:translateY(14px) scale(.985);
  transition:opacity .62s cubic-bezier(.22,.61,.36,1), transform .62s cubic-bezier(.22,.61,.36,1)}
.a.go .cardslot{opacity:1;transform:none}
.a .vvcard .cimg,.a .vvcard .cga,.a .vvcard .cname{opacity:0;transition:opacity .5s ease}
.a.go .vvcard .cimg{opacity:1;transition-delay:.34s}
.a.go .vvcard .cga{opacity:1;transition-delay:.62s}
.a.go .vvcard .cname{opacity:1;transition-delay:.5s}
.a .vvcard .chtag,.a .vvcard .chtagcell{opacity:0;transform:translateY(5px);
  transition:opacity .4s ease,transform .4s cubic-bezier(.22,.61,.36,1)}
.a.go .vvcard .chtag,.a.go .vvcard .chtagcell{opacity:1;transform:none;transition-delay:.86s}
.a .tag,.a .brand,.a .notify{opacity:0;transform:translateY(8px);
  transition:opacity .55s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.a.go .tag{opacity:1;transform:none;transition-delay:1.05s}
.a.go .brand{opacity:1;transform:none;transition-delay:1.2s}
.a.go .notify{opacity:1;transform:none;transition-delay:1.35s}
/* B , two cards resolve into a comparison */
.b .cardslot{opacity:0;transition:opacity .6s ease,transform .7s cubic-bezier(.22,.61,.36,1)}
.b .cardslot.l{transform:translateX(22px) scale(.97)}
.b .cardslot.r{transform:translateX(-22px) scale(.97)}
.b.go .cardslot{opacity:1;transform:none}
.b.go .cardslot.r{transition-delay:.12s}
.b .vs{opacity:0;transform:scale(.8);transition:opacity .4s ease,transform .45s cubic-bezier(.34,1.4,.5,1)}
.b.go .vs{opacity:1;transform:none;transition-delay:.72s}
.b .tag,.b .brand,.b .notify{opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .55s ease}
.b.go .tag{opacity:1;transform:none;transition-delay:.95s}
.b.go .brand{opacity:1;transform:none;transition-delay:1.1s}
.b.go .notify{opacity:1;transform:none;transition-delay:1.25s}
.vs{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  font-family:'Archivo',sans-serif;font-weight:900;font-size:13px;
  background:radial-gradient(circle at 50% 35%,#2a2422,#161313);border:2px solid var(--pink);color:var(--cream)}
body.light .vs{background:radial-gradient(circle at 50% 35%,#fff,#F0EAD9);color:var(--charcoal)}
/* C , the index settles , one card, the score counts, a rule draws under it */
.c .cardslot{opacity:0;transform:scale(.975);transition:opacity .6s ease,transform .7s cubic-bezier(.22,.61,.36,1)}
.c.go .cardslot{opacity:1;transform:none}
.c .rule{width:0;height:1px;background:currentColor;opacity:.22;margin:22px auto 0;
  transition:width .9s cubic-bezier(.22,.61,.36,1)}
.c.go .rule{width:210px;transition-delay:.55s}
.c .tag,.c .brand,.c .notify{opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .55s ease}
.c.go .tag{opacity:1;transform:none;transition-delay:.8s}
.c.go .brand{opacity:1;transform:none;transition-delay:.98s}
.c.go .notify{opacity:1;transform:none;transition-delay:1.12s}
/*  ONE RULE CANCELS EVERY ANIMATION. The finished state is the default in all three, so
    reduced motion is not a second implementation , it removes the transition and the
    transform and the page is simply already arrived. */
@media (prefers-reduced-motion: reduce){
  .arr *,.arr *::before,.arr *::after{transition:none !important;animation:none !important;transform:none !important}
  .arr .cardslot,.arr .tag,.arr .brand,.arr .notify,.arr .vs,
  .arr .vvcard .cimg,.arr .vvcard .cga,.arr .vvcard .cname,
  .arr .vvcard .chtag,.arr .vvcard .chtagcell{opacity:1 !important}
  .arr .rule{width:210px !important}
}
  .vvcard{--cw:300px;position:relative;width:var(--cw);max-width:92%;height:calc(var(--cw)*1.397);box-sizing:border-box;display:flex;flex-direction:column;border-radius:calc(var(--cw)*0.073);
    background:radial-gradient(130% 60% at 50% 0%, #F7F2E6 0%, var(--cream) 48%, var(--cream-deep) 100%) !important;
    box-shadow:0 26px 50px -22px rgba(0,0,0,0.6), inset 0 0 0 calc(var(--cw)*0.02) var(--cream), inset 0 0 0 calc(var(--cw)*0.025) rgba(28,27,26,0.55) !important;
    padding:calc(var(--cw)*0.055) calc(var(--cw)*0.07);color:#1C1B1A !important;font-family:'Barlow Condensed',sans-serif}   /* Career-Stage (Wonderkid / The Last Dance) , neutral profile tag, NOT the honour gold */
  .vvcard .chtagcell-cross{background:linear-gradient(90deg,#5A5856,#46443F) !important}
  .vvcard .chtagcell.gold{background:linear-gradient(90deg,#F0D27A,#E0A93A) !important;color:#5a4410}

  /* ===== Prestige whole-card treatment ===== */
  /* GENERATIONAL , deep BLACK card, gold ring + gold accents */
  body .vvcard.gen{background:radial-gradient(130% 60% at 50% 0%, #2c2824 0%, #16120e 50%, #090706 100%) !important;color:#F0EAD9 !important;box-shadow:0 22px 50px -22px rgba(0,0,0,0.85), inset 0 0 0 calc(var(--cw)*0.02) #16120e, inset 0 0 0 calc(var(--cw)*0.025) rgba(232,184,75,0.7) !important}

  .coin .coinA{fill:var(--cream)}
  body.light .coin .coinA{fill:var(--charcoal)}

  body .vvcard.iconic{background:radial-gradient(130% 60% at 50% 0%, #FBE490 0%, #E8B84B 48%, #D29A2C 100%) !important;color:#2a1d03 !important;box-shadow:0 22px 50px -22px rgba(176,120,20,0.7), inset 0 0 0 calc(var(--cw)*0.02) #E8B84B, inset 0 0 0 calc(var(--cw)*0.025) rgba(42,29,3,0.55) !important}
/* ---------- contact sheet ---------- */
body.pv{background:#4a4a4a;font-family:'Inter',system-ui,sans-serif;color:#eee}
.sheet{padding:16px}
h1{font-family:'Archivo';font-size:17px;margin:0 0 4px}
.lede{font-size:12px;opacity:.78;margin:0 0 14px;max-width:1180px;line-height:1.55}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ct{font-family:'Archivo';font-weight:800;font-size:12.5px;margin:0 0 3px}
.cd{font-size:11px;opacity:.7;margin:0 0 6px;line-height:1.45}
iframe.pv{border:1px solid #000;display:block;background:#111}

<script>
var P=new URLSearchParams(location.search),D=P.get('d'),T=P.get('t');
var HERO=137014, RIVAL=137461;   // Yamal 25/26 and 24/25 , real rows
function head(light){ return '<img class="mark" src="/assets/spinelogo-'+(light?'light':'dark')+'.png" alt="VVonderXI">'; }
function copy(){ return '<div class="tag">Every Season Tells a Different <span class="pk">Story</span></div>'
  +'<div class="brand">The Football Legacy Platform</div>'
  +'<div class="notify"><div class="nt">Be first through the door.</div>'
  +'<div class="nd">One message when it opens. Nothing else, ever.</div>'
  +'<div class="form"><input type="email" placeholder="you@email.com"><button type="button">Notify me</button></div></div>'; }
async function getCard(cli,id){ var r=await cli.from('player_card_mv').select('*').eq('card_id',id).single();
  return (r.error||!r.data)?null:VVCore.rowToCard(r.data); }
async function render(){
  var light=(T==='light');
  document.body.className='cs arr '+(D||'a')+(light?' light':'');
  document.body.classList.add('show-photos');           /* DEFECT 2: the photo is gated on this */
  try{ VVCore.useCardMarks(true); }catch(e){}
  var w=document.createElement('div'); w.className='wrap'; document.body.appendChild(w);
  w.innerHTML=head(light)+'<div class="stage">'+(VVCore.vvLoader?VVCore.vvLoader({size:44,label:'Loading'}):'')+'</div>';
  var cli=window.supabase.createClient(VV_PUBLIC.SUPABASE_URL,VV_PUBLIC.SUPABASE_ANON_KEY);
  var cw=window.innerWidth>820?286:Math.min(250,Math.max(190,Math.round(window.innerWidth*0.6)));
  var a=await getCard(cli,HERO); if(!a){ w.innerHTML=head(light)+copy(); return; }
  var stage='';
  if(D==='b'){ var b=await getCard(cli,RIVAL); var cw2=window.innerWidth>820?214:Math.min(160,Math.round(window.innerWidth*0.38));
    stage='<div class="cardslot l" style="--cw:'+cw2+'px">'+VVCore.buildCard(a,cw2)+'</div>'
         +'<div class="vs">VS</div>'
         +'<div class="cardslot r" style="--cw:'+cw2+'px">'+VVCore.buildCard(b||a,cw2)+'</div>'; }
  else { stage='<div class="cardslot" style="--cw:'+cw+'px">'+VVCore.buildCard(a,cw)+'</div>'; }
  w.innerHTML=head(light)+'<div class="stage">'+stage+'</div>'+(D==='c'?'<div class="rule"></div>':'')+copy();
  /*  THE REVEAL MUST NOT DEPEND ON requestAnimationFrame ALONE. rAF DOES NOT FIRE IN A
      HIDDEN TAB, so a link opened in a background tab , which is how a shared link is very
      often opened , would never get the `go` class and would sit at opacity 0 FOREVER. The
      visitor returns to a blank page. Measured here: visibilityState "hidden", rAF not
      fired after 700ms, every element computing opacity 0.
      Two belts: rAF for the smooth case, and a timer that fires regardless. Background
      timers are clamped to about a second, which is fine , it only has to arrive. Both are
      idempotent, so whichever wins, the other is a no-op. */
  function reveal(){ document.body.classList.add('go'); }
  requestAnimationFrame(function(){ requestAnimationFrame(reveal); });
  setTimeout(reveal, 80);
  document.addEventListener('visibilitychange', reveal, {once:true});
}
if(D){ render(); }
else{
  document.body.className='pv';
  var PAN=[['a','A , the card assembles','Frame settles, photo resolves, stats and name fade up, tags land last, then the words. ~1.7s, once.'],
           ['b','B , two resolve into a comparison','Both cards slide in from their own side, the VS lands between them. States the proposition in the motion.'],
           ['c','C , the index settles','One card, one rule drawing beneath it, then the words. The quietest, and the only one that reads as editorial rather than product demo.']];
  var h='<div class="sheet"><h1>Coming soon , three arrivals</h1><p class="lede">Yamal 25/26 (card_id 137014, vv 88, six tags) read live. '
   +'DEFECTS FIXED IN ALL THREE: the .vvcard box CSS now travels with the page (it did not, which is why the card rendered squished and clipped the club line), '
   +'and body.show-photos is set (the photo was never cross-origin , it is gated on that class). '
   +'Copy corrected to index.html\'s real hero line in Title Case with Story in pink, plus the real brand line.</p>';
  PAN.forEach(function(p){
    h+='<div class="ct">'+p[1]+'</div><p class="cd">'+p[2]+'</p><div class="row">';
    ['dark','light'].forEach(function(t){ [['desktop',940],['390',390]].forEach(function(v){
      h+='<iframe class="pv" style="width:'+v[1]+'px;height:720px" src="?d='+p[0]+'&t='+t+'"></iframe>'; }); });
    h+='</div>';
  });
  document.body.innerHTML=h+'</div>';
}
