<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VVonderXI , coming soon directions</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400..900&family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink-soft:#a49d93;--cream:#F0EAD9;--cream-deep:#E2D8C4;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--pink-glow:#FF8FA3;--gold:#E8B84B}
body.light{--ink-soft:#5f594e}
html,body{margin:0}
/* ---------- the page under test ---------- */
body.cs{min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Inter',system-ui,sans-serif;color:var(--cream);
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,244,224,.07), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%)}
body.cs.light{color:#241f1a;
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.7), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%)}
.cswrap{width:100%;max-width:1080px;padding:40px 22px 56px;box-sizing:border-box}
.csmark{display:block;margin:0 auto 30px;height:34px;width:auto}
.csstack{display:flex;flex-direction:column;align-items:center;text-align:center}
.cssplit{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:56px;align-items:center}
.cstag{font-family:'Bricolage Grotesque',serif;font-weight:700;font-size:28px;line-height:1.28;letter-spacing:-.01em;margin:30px 0 0;max-width:16em}
.cstag i{font-style:italic;color:var(--pink-ink)}
body.light .cstag i{color:#AD0332}
.csstack .cstag{margin-inline:auto}
.cssub{font-size:13.5px;line-height:1.6;opacity:.66;margin:14px 0 0;max-width:34em}
.csstack .cssub{margin-inline:auto}
.csnote{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;margin-top:18px}
/* waitlist , lifted from iwonder.html */
.iwnotify{margin-top:30px;max-width:520px;background:linear-gradient(135deg,rgba(255,92,122,0.10),rgba(255,255,255,0.04));
  border:1px solid rgba(255,92,122,0.22);border-radius:16px;padding:20px 22px}
body.light .iwnotify{background:linear-gradient(135deg,rgba(231,4,67,.06),rgba(0,0,0,.02));border-color:rgba(231,4,67,.18)}
.csstack .iwnotify{margin-inline:auto}
.iwnotify .nt{font-family:'Archivo';font-weight:900;font-size:15px;margin-bottom:5px}
.iwnotify .nd{font-size:12.5px;opacity:.7;line-height:1.55;margin-bottom:14px}
.iwform{display:flex;gap:9px}
.iwform input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
  border-radius:11px;padding:12px 14px;color:inherit;font:inherit;font-size:14px;outline:none}
body.light .iwform input{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.16)}
.iwform button{font-family:'Archivo';font-weight:800;font-size:12.5px;letter-spacing:.04em;padding:12px 18px;
  border:0;border-radius:11px;background:#E70443;color:#fff;cursor:pointer;white-space:nowrap}
.cardhost{display:flex;justify-content:center}
.csscore{font-family:'Archivo';font-weight:900;font-size:64px;line-height:1;color:var(--gold);letter-spacing:-.02em}
body.light .csscore{color:#8a6a1e}
.csscorel{font-family:'Archivo';font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-top:6px}
@media (max-width:820px){
  .cssplit{grid-template-columns:1fr;gap:30px;justify-items:center;text-align:center}
  .cstag{font-size:23px;margin-top:24px;margin-inline:auto}
  .cssub{margin-inline:auto}
  .iwnotify{margin-inline:auto}
  .cswrap{padding:26px 16px 40px}
  .csscore{font-size:52px}
}
@media (max-width:420px){ .cstag{font-size:21px} .iwform{flex-direction:column} .iwform button{width:100%} }
/* ---------- contact sheet chrome ---------- */
body.pv{background:#4a4a4a;font-family:'Inter',system-ui,sans-serif;color:#eee;margin:0}
.sheet{padding:18px}
h1{font-family:'Archivo';font-size:17px;margin:0 0 4px}
.lede{font-size:12px;opacity:.78;margin:0 0 16px;max-width:1150px;line-height:1.55}
.grid{display:flex;gap:16px;flex-wrap:wrap}
.cell{}
.ct{font-family:'Archivo';font-weight:800;font-size:12.5px;margin:0 0 3px}
.cd{font-size:11px;opacity:.7;margin:0 0 7px;width:var(--w);line-height:1.45;min-height:44px}
iframe.pv{border:1px solid #000;display:block;background:#111}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.VV_PUBLIC = { SUPABASE_URL: "https://krqthvroetbxgnvwwjar.supabase.co", SUPABASE_ANON_KEY: "sb_publishable_kQLTYxHeUvR_7AqPDPdXlA_nR8dwINp" };</script>
<script src="/vv-marks.js?v=20260901e"></script>
<script src="/vv-core.js?v=20260901e"></script>
<script>
var P=new URLSearchParams(location.search), D=P.get('d'), T=P.get('t');
var HERO_ID=143372;   // Messi 11/12, rt 97, Generational , the top card in the live matview
function markSVG(light){
  return '<img class="csmark" src="/assets/spinelogo-'+(light?'light':'dark')+'.png" alt="VVonderXI">';
}
function waitlist(){
  return '<div class="iwnotify">'
    +'<div class="nt">Be first through the door.</div>'
    +'<div class="nd">One message when it opens. Nothing else, ever.</div>'
    +'<div class="iwform" id="iwform"><input type="email" placeholder="you@email.com" id="iwemail">'
    +'<button onclick="csNotify()">Notify me</button></div></div>';
}
function csNotify(){ var e=document.getElementById('iwemail'); if(!e.value.trim()||e.value.indexOf('@')<1){e.focus();return;}
  alert('demo only , the real handler is iwonder.html iwNotify(), awaited on r.ok'); }
var DIRS={
  d1:function(card,cw){ return '<div class="csstack">'+markSVG(document.body.classList.contains('light'))
      +'<div class="cardhost">'+VVCore.buildCard(card,cw)+'</div>'
      +'<div class="cstag">Every season tells a <i>different story</i>.</div>'
      +'<div class="cssub">Fifty-seven thousand player seasons, nine leagues, one index. Opening shortly.</div>'
      +waitlist()+'</div>'; },
  d2:function(card,cw){ return markSVG(document.body.classList.contains('light'))
      +'<div class="cssplit"><div class="cardhost">'+VVCore.buildCard(card,cw)+'</div>'
      +'<div><div class="cstag">Every season tells a <i>different story</i>.</div>'
      +'<div class="cssub">Fifty-seven thousand player seasons across nine leagues, each one scored on its own terms. This is the best of them.</div>'
      +waitlist()+'</div></div>'; },
  d3:function(card,cw){ return '<div class="csstack">'+markSVG(document.body.classList.contains('light'))
      +'<div class="cardhost">'+VVCore.buildCard(card,cw)+'</div>'
      +'<div class="csscore">97</div><div class="csscorel">the highest season we have scored</div>'
      +'<div class="cstag" style="font-size:24px;margin-top:22px">Every season tells a <i>different story</i>.</div>'
      +waitlist()+'</div>'; }
};
async function render(){
  document.body.className='cs'+(T==='light'?' light':'');
  try{ VVCore.useCardMarks(true); }catch(e){}
  var wrap=document.createElement('div'); wrap.className='cswrap';
  wrap.innerHTML='<div class="csstack">'+(window.VVCore&&VVCore.vvLoader?VVCore.vvLoader({size:48,label:'Loading'}):'')+'</div>';
  document.body.appendChild(wrap);
  var cli=window.supabase.createClient(VV_PUBLIC.SUPABASE_URL, VV_PUBLIC.SUPABASE_ANON_KEY);
  var r=await cli.from('player_card_mv').select('*').eq('card_id',HERO_ID).single();
  if(r.error||!r.data){ wrap.innerHTML='<div class="csstack"><div class="cssub">Could not reach the index.</div></div>'; return; }
  var card=VVCore.rowToCard(r.data);
  var cw=Math.min(300, Math.max(200, Math.round(window.innerWidth*0.62)));
  if(window.innerWidth>820) cw=300;
  wrap.innerHTML=(DIRS[D]||DIRS.d1)(card,cw);
}
if(D){ render(); }
else{
  document.body.className='pv';
  var PAN=[['d1','D1 , stacked','Mark, card, tagline, waitlist. The purest reading of "show the product": nothing competes with the card.'],
           ['d2','D2 , card and words','Card left, words right on desktop, stacking below 820. More editorial, gives the sub-line room to say what the index is.'],
           ['d3','D3 , the score leads','The card, then 97 called out as the highest season scored. Teaches the number a first-time visitor is looking at.']];
  var h='<div class="sheet"><h1>vvonderxi.com holding page , three directions</h1>'
   +'<p class="lede">Real card from the live matview (card_id 143372, Messi 11/12, rt 97, Generational), real renderer, real marks, real loader. '
   +'Waitlist markup and styling lifted from iwonder.html; the handler here is a stub, the shipped one is iwNotify() awaited on r.ok. '
   +'Desktop 1100x760 and phone 390x760, both themes.</p><div class="grid">';
  PAN.forEach(function(p){
    ['dark','light'].forEach(function(t){
      [['desktop',1100],['390px',390]].forEach(function(v){
        h+='<div class="cell"><div class="ct">'+p[1]+' , '+t+' , '+v[0]+'</div>'
          +'<p class="cd" style="--w:'+v[1]+'px">'+(t==='dark'&&v[0]==='desktop'?p[2]:'&nbsp;')+'</p>'
          +'<iframe class="pv" style="width:'+v[1]+'px;height:760px" src="?d='+p[0]+'&t='+t+'"></iframe></div>';
      });
    });
  });
  document.body.innerHTML=h+'</div></div>';
}
</script></body></html>
