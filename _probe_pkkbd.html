<meta charset="utf-8"><title>picker / keyboard probe</title>
<!-- ══════════════════════════════════════════════════════════════════════════
     MOBILE COMPARE, FIXES 1 AND 2 , THE VERIFICATION HARNESS. Gitignored.

     ONE iframe at 390 wide, per the recorded rule that this browser will not
     resize: matchMedia and innerWidth are ASSERTED before any number below is
     believed, and step 0 aborts if either disagrees.

     THE TAB IS HIDDEN HERE AND TIMERS RUN ~15x SLOW (measured: a 50ms timer
     took 732ms). Layout and computed styles are unaffected, so every geometric
     number below is valid; no DURATION is reported, and the harness is stepped
     from outside rather than run as one long await chain, so a throttled sleep
     cannot look like a hang. requestAnimationFrame is avoided entirely , it
     does not fire at all on a hidden tab and would hang rather than lie.

     THE KEYBOARD IS SIMULATED BY STUBBING visualViewport, AND THAT IS THE
     FAITHFUL FORM RATHER THAN A CONVENIENCE. Both iOS Safari and Chrome
     Android default to interactive-widget=resizes-visual, so a keyboard
     shrinks the VISUAL viewport and leaves the LAYOUT viewport alone ,
     innerHeight does not move and vh does not recompute. Resizing this iframe
     would shrink BOTH, a different shape from the one that ships, and it would
     let the defect partly self-correct.

     THE FRAME'S URL CARRIES A CACHE-BUSTER AND IT IS NOT DECORATION. The first
     AFTER run measured the OLD compare.html , a page's HTML carries no ?v=
     token, only its scripts do , and it read every pre-fix number back as if
     the fix had done nothing. What caught it was asserting that the new function
     EXISTS before reading any geometry. Keep that assertion (step0 reports
     nothing about it; the caller checks typeof pkViewportBind) and keep the cb=.

     AND THE DESKTOP SCROLLBAR IS COMPENSATED BY THE CALLER, DECLARED: this frame
     has a 15px CLASSIC scrollbar, so the lock's overflow:hidden widens the
     content by 15px and re-wraps text, which read as the page losing 90px of
     height. A phone's scrollbar is an overlay and occupies no layout width, so
     the caller pins html{scrollbar-gutter:stable} before measuring. Without it
     the reading is about this browser's scrollbar, not about the lock.

     THE STUB CARRIES TWO CONTROLS, because a stub is an instrument:
       C1  innerHeight must be UNCHANGED while visualViewport.height reads the
           stubbed value. If innerHeight moved, this is the Android-resize
           shape and not the one under test.
       C2  with the stub live and the page's own settle handler detached, the
           geometry must read the OLD broken numbers. If it does not, the stub
           is moving the panel and the fix is not.
     ══════════════════════════════════════════════════════════════════════════ -->
<style>
 html,body{margin:0;background:#0b0a09;color:#F0EAD9;font:12px/1.5 ui-monospace,monospace}
 #f{width:390px;height:780px;border:0;display:block;position:fixed;left:0;top:0}
 #out{position:fixed;left:400px;top:0;right:0;bottom:0;overflow:auto;padding:10px;white-space:pre-wrap}
</style>
<iframe id="f" src="" data-src="/compare.html?a=141853&b=143526"></iframe>
<script>(function(){var f=document.getElementById('f');f.src=f.getAttribute('data-src')+'&cb='+Date.now();})()</script>
<pre id="out">stepped harness , call P.step0() ...</pre>
<script>
window.P = (function(){
  var f=document.getElementById('f'), LOG=[], PRE=null, SNAP={};
  function say(s){ LOG.push(s); document.getElementById('out').textContent=LOG.join('\n'); return s; }
  function W(){ return f.contentWindow; } function D(){ return f.contentWindow.document; }

  function stub(kb){
    var w=W(), vv=w.visualViewport;
    if(!vv.__realH){
      var pr=Object.getPrototypeOf(vv);
      vv.__realH=Object.getOwnPropertyDescriptor(pr,'height').get;
      vv.__realT=Object.getOwnPropertyDescriptor(pr,'offsetTop').get;
    }
    var realH=vv.__realH.call(vv);
    if(kb===0){
      delete vv.height; delete vv.offsetTop;
    } else {
      Object.defineProperty(vv,'height',{configurable:true,get:function(){ return realH-kb; }});
      Object.defineProperty(vv,'offsetTop',{configurable:true,get:function(){ return 0; }});
    }
    vv.dispatchEvent(new Event('resize'));
    return { asked:kb, vvH:Math.round(vv.height), innerH:w.innerHeight };
  }

  /*  VISIBLE RESULTS AREA = the part of #pkResults_A inside the VISUAL viewport
      band. The same definition the audit used, so before and after are the same
      quantity and not two numbers that happen to share a name. */
  function measure(tag){
    var w=W(), d=D(), vv=w.visualViewport;
    var top=vv.offsetTop, bot=vv.offsetTop+vv.height;
    function vis(el){ if(!el) return null; var r=el.getBoundingClientRect();
      return Math.max(0, Math.round(Math.min(r.bottom,bot)-Math.max(r.top,top))); }
    var p=d.getElementById('pkPanel_A'), r=d.getElementById('pkResults_A');
    var pr=p&&p.getBoundingClientRect(), rr=r&&r.getBoundingClientRect();
    return { tag:tag, innerH:w.innerHeight, vvH:Math.round(vv.height), band:Math.round(bot-top),
      panelTop:pr&&Math.round(pr.top), panelBot:pr&&Math.round(pr.bottom), panelH:pr&&Math.round(pr.height),
      resTop:rr&&Math.round(rr.top), resH:rr&&Math.round(rr.height),
      visRes:vis(r), visPanel:vis(p), rowsInList:r?r.querySelectorAll('[onclick*="pkPick"]').length:0,
      chrome:(pr&&rr)?Math.round(pr.height-rr.height):null };
  }
  function lockState(){
    var w=W(), d=D(), de=d.documentElement;
    return { htmlOverflow:w.getComputedStyle(de).overflowY, bodyOverflow:w.getComputedStyle(d.body).overflowY,
      bodyPosition:w.getComputedStyle(d.body).position, deScrollH:de.scrollHeight, bodyScrollH:d.body.scrollHeight,
      deClientH:de.clientHeight, scrollY:Math.round(w.scrollY) };
  }
  function pad(v,n){ return String(v).padStart(n); }

  return {
    log:function(){ return LOG.join('\n'); },
    snap:function(){ return SNAP; },

    step0:function(){                     // precondition + boot
      var w=W();
      PRE={ innerWidth:w.innerWidth, innerHeight:w.innerHeight,
            narrow:w.matchMedia('(max-width:820px)').matches, hasVV:!!w.visualViewport,
            bootReady:typeof w.openPicker==='function', cards:!!D().getElementById('pkPanel_A'),
            hostHidden:document.hidden };
      say('PRECONDITION '+JSON.stringify(PRE));
      if(PRE.innerWidth!==390||!PRE.narrow||!PRE.hasVV) say('ABORT , precondition failed');
      return PRE;
    },
    step1:function(){                     // park the page mid-scroll, snapshot unlocked state
      W().scrollTo(0,400);
      SNAP.beforeOpen=lockState();
      say('\nBEFORE OPEN  '+JSON.stringify(SNAP.beforeOpen));
      return SNAP.beforeOpen;
    },
    open:function(){ W().openPicker('A'); return 'opened'; },
    poolReady:function(){ var r=D().getElementById('pkResults_A');
      return { ok: !!r && r.scrollHeight>600, scrollH:r?r.scrollHeight:null, rows:r?r.querySelectorAll('[onclick*="pkPick"]').length:0 }; },

    step2:function(){                     // the lock proofs
      var w=W(), d=D();
      SNAP.locked=lockState();
      say('WHILE OPEN   '+JSON.stringify(SNAP.locked));
      var b=SNAP.beforeOpen, l=SNAP.locked;
      say('\nLOCK PROOF , the 2026-08-29 body lock collapsed de.scrollHeight to the viewport');
      say('  documentElement.scrollHeight  '+b.deScrollH+' -> '+l.deScrollH+'   '+(b.deScrollH===l.deScrollH?'UNCHANGED':'*** COLLAPSED ***'));
      say('  body.scrollHeight             '+b.bodyScrollH+' -> '+l.bodyScrollH+'   '+(b.bodyScrollH===l.bodyScrollH?'UNCHANGED':'*** CHANGED ***'));
      say('  stranded (body - de)          '+Math.max(0,l.bodyScrollH-l.deScrollH)+'px');
      say('  body position                 '+l.bodyPosition+(l.bodyPosition==='static'?'   (never fixed)':'   *** FIXED ***'));
      var y0=Math.round(w.scrollY), pt0=d.getElementById('pkPanel_A').getBoundingClientRect().top;
      w.scrollTo(0,2000);
      var y1=Math.round(w.scrollY), pt1=d.getElementById('pkPanel_A').getBoundingClientRect().top;
      say('  scrollTo(2000) while open     '+y0+' -> '+y1+'   '+(y0===y1?'BLOCKED':'*** PAGE MOVED '+(y1-y0)+'px ***')+
          '   panel top '+Math.round(pt0)+' -> '+Math.round(pt1));
      var tw=d.querySelector('.mt-fixed'), tr=tw&&tw.getBoundingClientRect();
      var hit=tr?d.elementFromPoint(tr.left+tr.width/2, tr.top+18):null;
      var sc=d.getElementById('pkScrim');
      SNAP.toggle={ hit:hit?(hit.className||hit.tagName)+'':null, zToggle:tw?w.getComputedStyle(tw).zIndex:null,
                    zScrim:sc?w.getComputedStyle(sc).zIndex:null, scrimOn:sc?sc.classList.contains('on'):false };
      say('  elementFromPoint over toggle  '+SNAP.toggle.hit+'   z(toggle)='+SNAP.toggle.zToggle+' z(scrim)='+SNAP.toggle.zScrim+
          '   '+(String(SNAP.toggle.hit).indexOf('pkscrim')>=0?'SCRIM WINS':'*** TOGGLE ABOVE SCRIM ***'));
      return SNAP;
    },

    kb:function(n){ var s=stub(n); SNAP['stub'+n]=s; return s; },
    read:function(n){
      var m=measure('kb'+n); m.control_innerHeight_unchanged=(m.innerH===PRE.innerHeight);
      (SNAP.kbd=SNAP.kbd||[]).push(m);
      say('  kb '+pad(n,3)+'  band '+pad(m.band,3)+'  panel '+pad(m.panelTop,3)+'..'+pad(m.panelBot,3)+
          ' ('+pad(m.panelH,3)+'h, chrome '+pad(m.chrome,3)+')  results top '+pad(m.resTop,3)+' h '+pad(m.resH,3)+
          '  VISIBLE '+pad(m.visRes,3)+'   [C1 innerHeight '+(m.control_innerHeight_unchanged?'unchanged':'*** MOVED ***')+']');
      return m;
    },
    head:function(){ say('\nKEYBOARD MATRIX  (visible results area, px)'); return 'ok'; },

    c2:function(){
      var w=W(), det=false;
      if(typeof w.pkViewportBind==='function'){ w.pkViewportBind(false); det=true; }
      stub(336);
      SNAP.c2pre=det;
      return det;
    },
    c2read:function(){
      var m=measure('c2'); SNAP.c2=m;
      say('\nCONTROL C2  (page settle handler '+(SNAP.c2pre?'DETACHED':'absent , pre-fix build')+', stub live at kb336)');
      say('  band '+m.band+'  panel '+m.panelTop+'..'+m.panelBot+' ('+m.panelH+'h)  VISIBLE '+m.visRes+
          '   '+(SNAP.c2pre?'(must match the pre-fix reading)':''));
      var w=W(); stub(0); if(SNAP.c2pre && typeof w.pkViewportBind==='function') w.pkViewportBind(true);
      return m;
    },

    step3:function(){                     // close, then prove every pixel is reachable
      W().closePicker('A'); return 'closed';
    },
    step4:function(){
      var w=W(); SNAP.after=lockState();
      w.scrollTo(0,999999);
      var maxY=Math.round(w.scrollY), reach=maxY+SNAP.after.deClientH;
      SNAP.reach={ maxY:maxY, reach:reach, scrollH:SNAP.after.deScrollH, stranded:Math.max(0,SNAP.after.deScrollH-reach) };
      say('\nAFTER CLOSE  '+JSON.stringify(SNAP.after));
      say('  scroll restored to            '+SNAP.after.scrollY+' (was '+SNAP.beforeOpen.scrollY+')   '+
          (Math.abs(SNAP.after.scrollY-SNAP.beforeOpen.scrollY)<=1?'KEPT':'*** MOVED ***'));
      say('  scrollTo(end) reaches         '+reach+' of scrollHeight '+SNAP.after.deScrollH+'   '+
          (SNAP.reach.stranded<=2?'ALL CONTENT REACHABLE':'*** '+SNAP.reach.stranded+'px STRANDED ***'));
      return SNAP.reach;
    }
  };
})();
'harness ready';
</script>
