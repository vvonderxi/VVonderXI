<!doctype html><meta charset="utf-8"><title>premium , 1440x760 both themes</title>
<style>html,body{margin:0;background:#2b2b2b;font:11px system-ui;color:#eee}
 .c{padding:10px 12px}
 .lab{font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-bottom:5px}
 .box{width:720px;height:380px;overflow:hidden;border:1px solid #666}
 iframe{width:1440px;height:760px;border:0;background:#000;
        transform:scale(.5);transform-origin:0 0;display:block}
 .row{display:flex;gap:10px;flex-wrap:wrap}
</style>
<div class="row" id="r"></div>
<script>
var t=Date.now(), r=document.getElementById('r');
[['a','dark'],['a','light'],['b','dark'],['b','light'],['c','dark'],['c','light']].forEach(function(x,i){
  var c=document.createElement('div'); c.className='c';
  var l=document.createElement('div'); l.className='lab'; l.textContent=x[0].toUpperCase()+' , '+x[1];
  var b=document.createElement('div'); b.className='box';
  var f=document.createElement('iframe');
  f.src='/_demo_premium.html?d='+x[0]+'&t='+x[1]+'&v='+(t+i);
  /*  HARNESS ONLY , scaled/offscreen iframes get render-throttled, so the reveal never
      ticks and every frame shoots as a bare logo. Pin the end state, as reduced-motion does. */
  f.addEventListener('load',function(){try{
    var dd=f.contentDocument, st=dd.createElement('style');
    st.textContent='*,*::before,*::after{transition:none!important;animation:none!important}';
    dd.head.appendChild(st); dd.body.classList.add('go');
  }catch(e){}});
  b.appendChild(f); c.appendChild(l); c.appendChild(b); r.appendChild(c);
});
</script>
