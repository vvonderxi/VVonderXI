<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VVonderXI , Every Season Tells a Different Story</title>
  <meta name="description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VVonderXI">
  <meta property="og:title" content="VVonderXI , Every Season Tells a Different Story">
  <meta property="og:description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
  <meta property="og:url" content="https://vvonderxi.com/">
  <meta property="og:image" content="https://vvonderxi.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="VVonderXI , Every Season Tells a Different Story">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@vvonderxi">
  <meta name="twitter:title" content="VVonderXI , Every Season Tells a Different Story">
  <meta name="twitter:description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
  <meta name="twitter:image" content="https://vvonderxi.com/og-image.png">
  <!--  THE META BLOCK ABOVE IS index.html's, VERBATIM AND COMPLETE , 9 og: tags and 5
        twitter:, plus the title and description. It is the whole reason this page can stand
        in for the site: a crawler reads static HTML, so every link already shared keeps the
        title, description and image it has today. Do not tidy it, do not rewrite the copy,
        and do not drop og-image.png from this branch. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  :root{--cream:#F0EAD9;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--cream);
    background:radial-gradient(150% 620px at 50% -140px, rgba(255,244,224,.07), transparent 78%),
               radial-gradient(120% 90% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);
    background-attachment:fixed}
  body.light{color:#241f1a;
    background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.7), transparent 78%),
               radial-gradient(120% 90% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);
    background-attachment:fixed}
  .wrap{width:100%;max-width:700px;padding:40px 22px 54px;display:flex;flex-direction:column;
        align-items:center;text-align:center}
  .mark{display:block;height:32px;width:auto;margin-bottom:30px}

  /*  THE CARD BACK , MARKUP AND TIER CSS COPIED VERBATIM FROM THE PRODUCT, NOT RETYPED.
      Markup is VVCore.vvBackFace()'s output; the .vvmono* rules are compare.html's.
      THIS PAGE DELIBERATELY LOADS NO JAVASCRIPT AT ALL, and that is a trade made with eyes
      open: vvBackFace() returns one trivial div while the CSS that actually defines the back
      lives in a page, so loading 350 KB of engine to source a div would cost the page that
      must load fastest almost everything and buy almost nothing. The price is a second copy
      of the tier rules, recorded here so it is not silent. This branch is temporary and is
      deleted when the site opens; if it ever stops being temporary, move .vvmono* into
      vv-core beside vvBackFace and load it properly.
      THERE IS NO .vvmono-master. The neutral charcoal back was built for direction A and is
      not a tier, so it is not in the fan and it survives nowhere , nothing was moved into
      vv-core for it. */
  .vvmono{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*0.073);
    display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .vvmonomark{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;
    font-size:calc(var(--cw)*0.34);letter-spacing:-.02em;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.3)}
  .vvmonomark span{color:var(--pink)}
  .vvmono-cream{background:linear-gradient(158deg,#F7F2E6,#EAE2D0);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),0 24px 60px -20px rgba(0,0,0,.5)}
  .vvmono-cream .vvmonomark{color:#1C1B1A}
  .vvmono-gold{background:linear-gradient(158deg,#F6DE93,#DC9E2C);
    box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.45),
               inset 0 0 0 calc(var(--cw)*0.026) #9a6a14,0 24px 60px -20px rgba(120,80,10,.55)}
  .vvmono-gold .vvmonomark{color:#3a2708}
  .vvmono-black{background:linear-gradient(158deg,#2c2926,#121010);
    box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(232,184,75,.55),
               inset 0 0 0 calc(var(--cw)*0.028) rgba(232,184,75,.9),
               0 22px 54px -18px rgba(0,0,0,.7),0 0 26px -6px rgba(232,184,75,.25)}
  .vvmono-black .vvmonomark{color:#F0EAD9}

  /*  THE FAN , three backs for three tiers. A reader sees that tiers exist without learning
      what any of them mean, which is the whole job of a holding page. No overflow clip on the
      stage or anything above it. */
  .stage{position:relative;display:flex;justify-content:center;align-items:center}
  .fanc{position:absolute;opacity:0;transform:translateX(0) rotate(0deg) scale(.96);
    transition:transform .95s cubic-bezier(.22,.61,.36,1),opacity .7s ease}
  body.go .fanc{opacity:1}
  body.go .f1{transform:translateX(-124px) rotate(-8deg);transition-delay:.10s}
  body.go .f2{transform:translateX(0)     rotate(0deg); transition-delay:.19s}
  body.go .f3{transform:translateX(124px)  rotate(8deg); transition-delay:.28s}

  .tag{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;font-size:27px;
       line-height:1.3;letter-spacing:-.01em;margin:30px 0 0;max-width:15em}
  .tag .pk{color:var(--pink-ink)}
  body.light .tag .pk{color:#AD0332}
  .brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.2em;
         text-transform:uppercase;opacity:.45;margin-top:16px}
  .notify{margin-top:28px;width:100%;max-width:440px;text-align:left;
    background:linear-gradient(135deg,rgba(255,92,122,0.10),rgba(255,255,255,0.04));
    border:1px solid rgba(255,92,122,0.22);border-radius:16px;padding:18px 20px}
  body.light .notify{background:linear-gradient(135deg,rgba(231,4,67,.06),rgba(0,0,0,.02));
    border-color:rgba(231,4,67,.18)}
  .notify .nt{font-family:'Archivo',sans-serif;font-weight:900;font-size:14.5px;margin-bottom:4px}
  .notify .nd{font-size:12px;opacity:.72;line-height:1.5;margin-bottom:12px}
  .form{display:flex;gap:9px}
  .form input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    border-radius:11px;padding:12px 14px;color:inherit;font:inherit;font-size:16px;outline:none}
  body.light .form input{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.16)}
  .form input:focus{border-color:var(--pink-ink)}
  .form button{font-family:'Archivo',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.04em;
    padding:12px 18px;border:0;border-radius:11px;background:#E70443;color:#fff;cursor:pointer;white-space:nowrap}
  .form button:disabled{opacity:.6;cursor:default}
  .err,.thanks{display:none;font-size:12.5px;line-height:1.55;margin-top:12px}
  .err{color:var(--pink-ink)} body.light .err{color:#AD0332}
  .thanks{opacity:.8}
  .tag,.brand,.notify{opacity:0;transform:translateY(8px);
    transition:opacity .55s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
  body.go .tag{opacity:1;transform:none;transition-delay:.82s}
  body.go .brand{opacity:1;transform:none;transition-delay:.97s}
  body.go .notify{opacity:1;transform:none;transition-delay:1.12s}

  @media (max-width:820px){ .wrap{padding:26px 16px 40px} .tag{font-size:22px;margin-top:24px} }
  @media (max-width:560px){
    body.go .f1{transform:translateX(-74px) rotate(-8deg)}
    body.go .f2{transform:translateX(0) rotate(0deg)}
    body.go .f3{transform:translateX(74px) rotate(8deg)}
  }
  @media (max-width:420px){ .tag{font-size:20px} .form{flex-direction:column} .form button{width:100%} }

  /*  ONE RULE FOR REDUCED MOTION. The finished state is pinned rather than re-implemented:
      transitions off, and every element placed exactly where the animation would have left
      it, fan offsets included. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
    .fanc,.tag,.brand,.notify{opacity:1 !important}
    .tag,.brand,.notify{transform:none !important}
    .f1{transform:translateX(-124px) rotate(-8deg) !important}
    .f2{transform:translateX(0) rotate(0deg) !important}
    .f3{transform:translateX(124px) rotate(8deg) !important}
    @media (max-width:560px){
      .f1{transform:translateX(-74px) rotate(-8deg) !important}
      .f3{transform:translateX(74px) rotate(8deg) !important}
    }
  }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" id="mark" src="/assets/spinelogo-dark.png" alt="VVonderXI" width="72" height="32">
    <div class="stage" id="stage">
      <div class="fanc f1"><div class="vvmono vvmono-cream"><div class="vvmonomark">V<span>V</span></div></div></div>
      <div class="fanc f2"><div class="vvmono vvmono-gold"><div class="vvmonomark">V<span>V</span></div></div></div>
      <div class="fanc f3"><div class="vvmono vvmono-black"><div class="vvmonomark">V<span>V</span></div></div></div>
    </div>
    <div class="tag">Every Season Tells a Different <span class="pk">Story</span></div>
    <div class="brand">The Football Legacy Platform</div>
    <div class="notify">
      <div class="nt">Be first through the door.</div>
      <div class="nd">One message when it opens. Nothing else, ever.</div>
      <div class="form" id="form">
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" aria-label="Your email address">
        <button type="button" id="go">Notify me</button>
      </div>
      <div class="err" id="err">That did not send. Your address is still above , try again in a moment.</div>
      <div class="thanks" id="thanks">&#10003; You&rsquo;re on the list. One message, when it opens.</div>
    </div>
  </div>
<script>
/*  Theme and sizing. The card width is set here rather than in CSS because the fan needs a
    real number to lay out against and calc() on a percentage of the viewport would fight the
    absolute positioning. */
(function(){
  var light=false;
  try{ var t=localStorage.getItem('vvTheme');
       light = t ? (t==='light') : window.matchMedia('(prefers-color-scheme: light)').matches; }catch(e){}
  document.body.classList.toggle('light', light);
  var m=document.getElementById('mark');
  if(m) m.src='/assets/spinelogo-'+(light?'light':'dark')+'.png';
  function size(){
    var cw = window.innerWidth>820 ? 214 : Math.min(168, Math.max(128, Math.round(window.innerWidth*0.34)));
    document.querySelectorAll('.vvmono').forEach(function(el){ el.style.setProperty('--cw', cw+'px'); });
    var st=document.getElementById('stage'); if(st) st.style.height = Math.round(cw*1.397)+'px';
  }
  size(); window.addEventListener('resize', size);
  /*  THE REVEAL MUST NOT DEPEND ON requestAnimationFrame ALONE , rAF DOES NOT FIRE IN A
      HIDDEN TAB, and a shared link is very often opened in one. Without the timer the page
      would sit at opacity 0 until the tab was looked at, and if it was never looked at while
      loaded, never arrive at all. All three paths are idempotent. */
  function reveal(){ document.body.classList.add('go'); }
  requestAnimationFrame(function(){ requestAnimationFrame(reveal); });
  setTimeout(reveal, 80);
  document.addEventListener('visibilitychange', reveal, {once:true});
})();
/*  AWAIT THE FETCH, THEN DECIDE , iwonder.html's contract. Nobody is thanked before the
    request resolves, only r.ok unlocks the thanks, and on failure the form stays up with the
    typed address still in it. That address is the only copy of what the visitor was giving us. */
(function(){
  var go=document.getElementById('go'), el=document.getElementById('email');
  var err=document.getElementById('err'), thanks=document.getElementById('thanks'), form=document.getElementById('form');
  async function submit(){
    var e=el.value.trim();
    if(!e || e.indexOf('@')<1){ el.focus(); return; }
    err.style.display='none';
    go.disabled=true; go.textContent='Sending...';
    var ok=false;
    try{
      var r=await fetch('https://formspree.io/f/mayzwqzv', {
        method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'},
        body:JSON.stringify({email:e, source:'vvonderxi.com waitlist'})
      });
      ok=r.ok;
    }catch(_){ ok=false; }
    go.disabled=false; go.textContent='Notify me';
    if(ok){ form.style.display='none'; thanks.style.display='block'; }
    else  { err.style.display='block'; }
  }
  go.addEventListener('click', submit);
  el.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); });
})();
</script>
</body>
</html>
