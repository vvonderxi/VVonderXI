<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VVonderXI , Every Season Tells a Different Story</title>
<meta name="description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
<!-- TIER 1 SOCIAL META , STATIC. Absolute URLs on https://vvonderxi.com; correct the moment the
     domain is live. Generic brand image on every page: card.html and compare.html are
     DYNAMIC and cannot name a player without a server layer, so every shared card link
     unfurls identically. That is the accepted Tier 1 limit, and what Tier 2 removes. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="VVonderXI">
<meta property="og:title" content="VVonderXI , Every Season Tells a Different Story">
<meta property="og:description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
<meta property="og:url" content="https://vvonderxi.com/">
<meta property="og:image" content="https://vvonderxi.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VVonderXI , Every Season Tells a Different Story">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@vvonderxi">
<meta name="twitter:title" content="VVonderXI , Every Season Tells a Different Story">
<meta name="twitter:description" content="Every Season Tells a Different Story. 57,234 player seasons across nine leagues, each one scored, ranked and ready to compare.">
<meta name="twitter:image" content="https://vvonderxi.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink-soft:#a49d93;
    --charcoal:#1C1B1A; --cream:#F0EAD9; --pink:#E70443;--pink-ink:#F1688E;
    --gold:#E8B84B; --green:#2E8C5A;
    /* dark (Under the Lights) , default */
    --bg:#16140F; --ink:var(--cream); --muted:rgba(240,234,217,.52);
    --field:rgba(255,255,255,.045); --field-b:rgba(255,255,255,.13);
    --pillbg:rgba(255,255,255,.04); --pill-b:rgba(255,255,255,.15);
    --glow:rgba(255,92,122,.16);
  }
  body.light{--ink-soft:#5f594e;
    --bg:#F4EFE2; --ink:var(--charcoal); --muted:#5f594e;
    --field:#FFFFFF; --field-b:rgba(0,0,0,.10);
    --pillbg:#FFFFFF; --pill-b:rgba(0,0,0,.10);
    --glow:rgba(255,92,122,.10);
    /*  THE HEADER WASH , SOFTENED AND EXTENDED SO IT STOPS READING AS A PATCH.
        At rgba(255,92,122,.10) fading out by 60%, this tinted the top ~340px to #F4EADE
        against a #F4EFE2 page and then stopped, so the logo and tagline sat on a visibly
        distinct area instead of on the page. Measured down the right margin: the old ramp
        ran F4EADE -> F4EFE2 and was done by y=340 at both 390 and 1280.
        Halved and carried much further out: the tint is now shallow enough not to register
        as a colour change and never lands an edge inside the content.
        AND THE FIX IS TO DROP THE HUE, NOT JUST THE ALPHA. The wash was PINK on CREAM, and a
        hue shift reads far more strongly than a lightness one: measured, the top sat at
        #F4EADE against a #F4EFE2 page, R-B of 22 versus 18, so the eye saw a differently
        COLOURED area rather than a slightly brighter one. Halving the alpha alone left it at
        9 units off. A white highlight lightens without tinting, which is what the holding
        page already does, so the two surfaces now share one treatment.
        NOT --glow ITSELF , that token is also the search field's focus ring
        (.search:focus-within), where the stronger pink value is correct. Only the ground moves. */
    background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.55), transparent 78%), var(--bg);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(150% 540px at 50% -130px,rgba(255,244,224,.07),transparent 82%),radial-gradient(circle 22px at 12% -8px,rgba(255,255,255,.80),rgba(255,238,205,.18) 45%,transparent 72%),radial-gradient(circle 24px at 31% -8px,rgba(255,255,255,.88),rgba(255,238,205,.20) 45%,transparent 72%),radial-gradient(circle 26px at 50% -8px,rgba(255,255,255,.92),rgba(255,238,205,.22) 45%,transparent 72%),radial-gradient(circle 24px at 69% -8px,rgba(255,255,255,.88),rgba(255,238,205,.20) 45%,transparent 72%),radial-gradient(circle 22px at 88% -8px,rgba(255,255,255,.80),rgba(255,238,205,.18) 45%,transparent 72%),radial-gradient(6% 640px at 12% -60px,rgba(255,247,230,.16),transparent 84%),radial-gradient(6% 700px at 31% -60px,rgba(255,247,230,.18),transparent 84%),radial-gradient(7% 760px at 50% -60px,rgba(255,247,230,.20),transparent 84%),radial-gradient(6% 700px at 69% -60px,rgba(255,247,230,.18),transparent 84%),radial-gradient(6% 640px at 88% -60px,rgba(255,247,230,.16),transparent 84%),radial-gradient(120% 80% at 50% 8%, var(--glow), transparent 60%),
      var(--bg);
    min-height:100dvh; display:flex; flex-direction:column;
    transition:background .5s ease,color .35s ease; overflow-x:hidden;
  }
  /* top bar */
  .top,.hero,.foot{position:relative;z-index:2}
  .top{display:flex;align-items:center;justify-content:space-between;
       padding:18px 22px; gap:12px}
  .lv{font-family:'Archivo';font-weight:700;font-size:11.5px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted)}
  .lv b{color:var(--ink)}
  .topacts{display:flex;align-items:center;gap:8px}
  .ibtn{appearance:none;border:1px solid var(--pill-b);background:var(--pillbg);
        color:var(--ink);border-radius:999px;cursor:pointer;font-family:'Archivo';
        font-weight:700;font-size:13px;height:38px;display:flex;align-items:center;
        gap:7px;padding:0 15px;transition:.18s}
  .ibtn:hover{border-color:var(--pink-ink);transform:translateY(-1px)}
  .ibtn.icon{width:38px;padding:0;justify-content:center}
  .ibtn svg{width:17px;height:17px;display:block}
  .ibtn.locker{gap:11px;padding:0 14px 0 16px;font-size:13px}
  .hburg{display:inline-flex;flex-direction:column;justify-content:center;gap:3px;width:18px}
  .hburg i{height:2.5px;border-radius:2px;background:var(--ink);transition:background .35s}
  .hburg i:nth-child(2){background:var(--pink)}

  /* hero */
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;text-align:center;padding:24px 22px 70px;gap:0}
  .logo{width:min(380px,64vw);height:auto;display:none;margin-bottom:20px;
        filter:drop-shadow(0 14px 34px rgba(0,0,0,.30))}
  body:not(.light) .logo.d{display:block}
  body.light .logo.l{display:block}
  .tag{font-family:'Bricolage Grotesque';font-weight:600;font-size:clamp(15px,2.4vw,19px);
       letter-spacing:.005em;color:var(--muted);margin-bottom:30px}
  .tag .pk{color:var(--pink-ink)}

  /* search */
  .searchwrap{width:min(620px,92vw);position:relative}
  .search{display:flex;align-items:center;gap:13px;width:100%;
          background:var(--field);border:1.5px solid var(--field-b);
          border-radius:999px;padding:0 22px;height:62px;
          box-shadow:0 10px 40px -18px rgba(0,0,0,.5);transition:.2s}
  .search:focus-within{border-color:var(--pink-ink);
          box-shadow:0 0 0 4px var(--glow),0 14px 44px -18px rgba(0,0,0,.55)}
  .search svg{width:21px;height:21px;flex:none;color:var(--muted)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);
          font-family:'Inter';font-size:16.5px;font-weight:500;min-width:0}
  .search input::placeholder{color:var(--muted);transition:opacity .25s ease}
  .search .go{font-family:'Archivo';font-weight:800;font-size:13px;color:#fff;
          background:var(--pink);border:none;border-radius:999px;height:40px;
          padding:0 18px;cursor:pointer;flex:none;transition:.18s}
  .search .go:hover{filter:brightness(1.06);transform:translateY(-1px)}

  /* ══ LIVE RESULTS , the dropdown under the search bar ══
     ONE MECHANISM: every piece of matching logic comes from vv-core , tokenAndFilter,
     vvParseSearch, vvSeasonLabel, rankBySearch, vvLoader , the same code rankings and
     the compare picker run. Nothing is re-implemented here. */
  .srpanel{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:60;
    background:#211E19;border:1.5px solid var(--field-b);border-radius:20px;
    box-shadow:0 22px 60px -20px rgba(0,0,0,.62);overflow:hidden;text-align:left;display:none}
  /*  OPAQUE, NOT TRANSLUCENT. var(--field) is a 4.5% white in dark mode, so the pills
      behind the panel read straight through it , "Playbook" was legible across the first
      result. A dropdown carrying names and scores is content, not chrome. */
  body.light .srpanel{background:#FFFFFF;border-color:rgba(0,0,0,.12);
    box-shadow:0 22px 60px -22px rgba(0,0,0,.28)}
  .srpanel.open{display:block}
  /*  overscroll-behavior:contain , THE SAME FIX AS THE COMPARE PICKER. Without it a
      flick that runs out of results carries on into the page and drags the panel out
      from under the thumb. The front door is the worst place for that. */
  .srlist{max-height:var(--srmax,300px);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch}
  /*  44px FLOOR. The row is 56px, which clears it. The chips inside are text, not
      targets, so only the row itself has to. */
  .srrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 18px;
    cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink);
    font:inherit;transition:background .12s}
  .srrow+.srrow{border-top:1px solid var(--field-b)}
  .srrow:hover,.srrow.on{background:rgba(231,4,67,.11)}
  body.light .srrow:hover,body.light .srrow.on{background:rgba(231,4,67,.09)}
  .srrow:focus-visible{outline:2px solid var(--pink-ink);outline-offset:-3px}
  .srrail{width:4px;align-self:stretch;min-height:34px;border-radius:3px;flex:none}
  .srmain{flex:1;min-width:0}
  /*  display:block IS LOAD-BEARING , these are spans inside a button, so they are inline
      by default and the club ran straight on from the surname:
      "K. De BruyneManchester City · 19/20". Every measurement passed while it did. */
  .srnm{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srsub{display:block;font-size:12px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srvv{flex:none;font-family:'Archivo';font-weight:800;font-size:19px;line-height:1;
    text-align:right;min-width:38px}
  .srvvl{display:block;font-family:'Inter';font-weight:500;font-size:9px;
    letter-spacing:.1em;color:var(--muted);margin-top:3px}
  .srvv.nr{font-size:13px;color:var(--muted)}   /* NR is never 0 */
  .srhead{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:11px 18px 6px}
  .srwait{display:flex;align-items:center;justify-content:center;gap:12px;padding:26px 18px;
    color:var(--muted);font-size:12.5px}
  .srempty{padding:20px 18px 22px;font-size:13.5px;line-height:1.55}
  .srempty b{display:block;font-family:'Archivo';font-weight:800;font-size:13.5px;margin-bottom:5px}
  .srempty span{color:var(--muted);font-size:12.5px}
  .srfoot{border-top:1px solid var(--field-b)}
  .srall{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    min-height:46px;padding:8px 18px;border:0;background:none;cursor:pointer;color:var(--ink);
    font-family:'Archivo';font-weight:800;font-size:12px;text-align:left}
  .srall:hover,.srall.on{background:rgba(231,4,67,.11)}
  .srall .c{color:var(--muted);font-weight:600;font-family:'Inter';font-size:11.5px}
  @media (max-width:520px){ .srnm{font-size:15px} }

  /*  THE HERO YIELDS ROOM WHILE SEARCHING, AND THIS IS NOT DECORATION.
      This page does not scroll (measured: scrollHeight == innerHeight at 390x844), and
      the search bar's bottom sits at 492px, leaving 342px. The soft keyboard then takes
      roughly half the viewport. Measured at 390x420 without this, the panel overflowed
      the bottom by 64px even after the list had been squeezed to its floor.
      NOTE THE PROPERTY: .logo is sized with `width`, not max-width, and the <=720px rule
      is inside a media query, which adds NO specificity , so this (0,2,1) selector wins
      on specificity alone and no !important is needed. */
  .hero.searching .logo{width:min(112px,32vw)}
  .hero.searching .tag{font-size:15px;margin-bottom:10px}
  .hero.searching .pills{opacity:0;pointer-events:none}
  .hero .logo,.hero .tag,.hero .pills{transition:width .22s ease,font-size .22s ease,margin .22s ease,opacity .18s ease}
  @media (prefers-reduced-motion:reduce){.hero .logo,.hero .tag,.hero .pills{transition:none}}

  /* pills */
  .pills{display:flex;align-items:stretch;justify-content:center;gap:12px;
         margin-top:28px;flex-wrap:wrap}
  .pill{appearance:none;cursor:pointer;border-radius:14px;border:1.5px solid var(--pill-b);
        background:var(--pillbg);color:var(--ink);padding:13px 30px;min-width:150px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.18s;
        text-decoration:none}
  .pill .pt{font-family:'Archivo';font-weight:800;font-size:15.5px;letter-spacing:.005em;
        display:flex;align-items:center;justify-content:center;gap:6px}
  .pill:hover{transform:translateY(-2px);border-color:var(--pink-ink)}
  .pill.soon{opacity:.66;cursor:default}
  .pill.soon:hover{transform:none;border-color:var(--pill-b)}
  .soontag{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.14em;
        text-transform:uppercase;color:#7e5a10}
  .vv{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-.02em}
  .vv .va{color:var(--ink)} .vv .vb{color:var(--pink-ink)}
  .badge{font-family:'Archivo';font-weight:800;font-size:9px;letter-spacing:.1em;
        text-transform:uppercase;background:var(--gold);color:#2a2410;
        padding:3px 7px;border-radius:999px}

  .foot{padding:16px 22px 26px;text-align:center}
  .foot .fl{font-family:'Archivo';font-weight:700;font-size:10.5px;letter-spacing:.14em;
        text-transform:uppercase;color:var(--muted)}

  /* hamburger menu , mirrors the spine nav exactly */
  .menu{position:fixed;inset:0;background:rgba(8,7,6,.55);backdrop-filter:blur(4px);
        display:none;z-index:40}
  body.light .menu{background:rgba(40,36,30,.30)}
  .menu.open{display:block}
  .drawer{position:absolute;top:14px;right:14px;width:min(250px,82vw);
        background:var(--bg);border:1px solid var(--pill-b);border-radius:20px;
        padding:14px 12px;box-shadow:0 30px 80px -24px rgba(0,0,0,.7);
        display:flex;flex-direction:column}
  .mlogo{width:118px;height:auto;display:none;margin:4px auto 14px}
  body:not(.light) .drawer .mlogo.d{display:block}
  body.light .drawer .mlogo.l{display:block}
  /* The drawer holds SIX PRIMARY DESTINATIONS and has NO active state , nothing ever receives
     .on here, since the drawer lives on the home page and home is not one of its entries. With
     nothing to recede behind, muting every item mutes the whole menu. Worse, --muted is
     rgba(240,234,217,.52) in BOTH themes, so on the cream light drawer it measured 1.02 ,
     the menu was invisible in daylight. Primary ink, full strength, both themes:
     light #2a2620 = 13.10, dark #F0EAD9 = 15.32. */
  .navitem{display:flex;align-items:center;gap:14px;padding:12px;border-radius:13px;
        cursor:pointer;color:#F0EAD9;transition:background .2s,color .2s;text-decoration:none}
  body.light .navitem{color:#2a2620}
  .navitem:hover{background:rgba(255,255,255,0.05);color:var(--ink)}
  body.light .navitem:hover{background:rgba(0,0,0,0.04)}
  .navitem.on{background:rgba(255,92,122,0.12);color:var(--pink-ink)}
  .navitem svg{width:22px;height:22px;flex-shrink:0}
  .navitem .lbl{font-family:'Archivo';font-weight:700;font-size:15.5px}
  .navspacer{height:12px}

  @media(max-width:560px){
    .top{padding:14px 16px;justify-content:flex-end}
    .lv{display:none}
    .hero{padding:10px 16px 50px}
    .logo{width:70vw;margin-bottom:16px}
    .tag{margin-bottom:24px}
    .search{height:58px;padding:0 16px}
    .search .go{padding:0 14px}
    .pills{gap:8px;display:flex;width:100%}
    .pill{min-width:0;flex:1 1 0;padding:13px 10px;text-align:center}
    .pill .pt{font-size:13px;white-space:nowrap}
    .pill .ps{display:none}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}  body:not(.light){color-scheme:dark} body.light{color-scheme:light}
  @media (max-width:720px){
    html,body{overflow-x:hidden;max-width:100vw}
  }

  /* CLASS 3 PINK POLICY , bright #E70443 measures 2.0-3.0 on every light surface, so it is
     decorative + dark-mode only. Load-bearing pink TEXT uses --pink-ink on light grounds.
     #E70443: 5.51 page / 6.04 panel / 6.40 white. Bright pink is untouched everywhere else. */
  body.light{--pink-ink:#AD0332}
  body.light .tag .pk{color:var(--pink-ink)}
  /* white on #E70443 is 2.97; these labels are 12px bold so they need 4.5. #E70443 = 5.61. */
  .search .go{background:#E70443}
  body:not(.light) .soontag{color:var(--gold)}   /* darkened for cream; bright gold is correct on charcoal */
</style>
</head>
<body class="light">
<script>(function(){try{var t=localStorage.getItem('vvTheme');if(t==='light')document.body.classList.add('light');else if(t==='dark')document.body.classList.remove('light');}catch(e){}})();</script>
  <header class="top">
    <div class="lv">A product by <b>LiV<span style="color:var(--pink-ink)">V</span>onderful</b></div>
    <div class="topacts">
      <button class="ibtn icon" id="modeBtn" aria-label="Toggle daylight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="modeIcon"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="ibtn locker" id="burger" aria-label="My Club and menu">My Club<span class="hburg"><i></i><i></i><i></i></span></button>
    </div>
  </header>

  <main class="hero">
    <img class="logo d" alt="VVonderXI" src="/assets/spinelogo-dark.png">
    <img class="logo l" alt="VVonderXI" src="/assets/spinelogo-light.png">
    <div class="tag">Every Season Tells a Different <span class="pk">Story</span></div>

    <div class="searchwrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="srPanel" aria-autocomplete="list"
               placeholder='Try "Messi vs Bellingham"'>
        <button class="go">Search</button>
      </div>
      <div class="srpanel" id="srPanel" role="listbox" aria-label="Search results"></div>
    </div>

    <div class="pills">
      <a class="pill" href="rankings.html"><span class="pt"><span class="vv"><span class="va">V</span><span class="vb">V</span></span> Rankings</span></a>
      <a class="pill" href="compare.html"><span class="pt">Compare</span></a>
      <a class="pill" href="playbook.html"><span class="pt">The Playbook</span></a>
    </div>
  </main>

  <footer class="foot">
    <div class="fl">The Football Legacy Platform</div>
  </footer>

<script>
  // rotating placeholder examples
  /*  EVERY SUGGESTION IS A PROMISE THE SEARCH HAS TO HONOUR, AND TWO OF THESE WERE NOT.

      is the same trap wearing a different name.
      The mix is deliberate and already complete: three `vs` examples teach that compares
      are searchable, and "Rodri 23/24" teaches seasons. Verified 2026-08-30, all six
      resolve on both sides through vvParseSearch + tokenAndFilter. */
  var ex=['Try "Messi vs Bellingham"','Search "Mohamed Salah"','Try "Haaland vs Mbapp\u00e9"','Search "Rodri 23/24"','Try "Bellingham vs Lamine Yamal"','Search "Van Dijk"'];
  var qi=document.getElementById('q'),k=0;
  setInterval(function(){
    if(document.activeElement===qi||qi.value)return;
    qi.style.opacity=0;
    setTimeout(function(){k=(k+1)%ex.length;qi.setAttribute('placeholder',ex[k]);qi.style.opacity=1;},240);
  },2600);
  qi.style.transition='opacity .24s ease';

  // mode toggle
  var mb=document.getElementById('modeBtn'),mi=document.getElementById('modeIcon');
  var sunPath='<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';

  function syncIcon(){mi.innerHTML=document.body.classList.contains('light')?moonPath:sunPath;}
  mb.onclick=function(){document.body.classList.toggle('light');try{localStorage.setItem('vvTheme',document.body.classList.contains('light')?'light':'dark');}catch(e){}syncIcon();};

  /* ══════════════════════════════════════════════════════════════════════════
     LIVE SEARCH. Replaces the old vvHomeSearch routing, which sent every query to
     rankings.html?q= and made the visitor load a second page to find out whether the
     player exists at all. The routing itself SURVIVES , the Search button and a
     pre-debounce Enter both still route, and a "vs" query still goes to Compare.
     ══════════════════════════════════════════════════════════════════════════ */
(function(){
  var C = window.VVCore, F = window.VVFilters;
  var P = window.VV_PUBLIC;

  /*  THE DEPENDENCY GATE , AND IT EXISTS BECAUSE THE ABSENCE OF IT WAS A REAL BUG.
      This module used to open with `window.supabase.createClient(...)`. If ANY of its
      three dependencies was missing, that line threw at module load, every listener
      below it was never attached, and the search field silently did nothing , while
      the page rendered perfectly, wordmark and pills and all. There was no way to tell
      the failure apart from "the feature was never built".

      TWO WAYS TO REACH IT, BOTH REPRODUCED IN A REAL BROWSER (2026-08-30):
        , opening index.html off disk with file:// , `/vv-core.js` resolves to
          file:///vv-core.js and 404s, so VVCore and VVFilters are undefined.
        , an ad blocker, corporate proxy or offline machine blocking the
          jsdelivr CDN , VVCore loads, `window.supabase` does not.

      SO: DEGRADE TO THE ROUTING THAT EXISTED BEFORE LIVE SEARCH, rather than dying.
      The Search button and Enter still take the visitor to rankings or compare, which
      is exactly what this page did before , a worse experience, not a broken one. And
      say so once in the console, naming the missing piece, so the next person does not
      have to bisect it. */
  var missing = [];
  if(typeof C === 'undefined' || !C || !C.tokenAndFilter) missing.push('VVCore (vv-core.js)');
  if(typeof F === 'undefined' || !F || !F.emptyStateHTML) missing.push('VVFilters (vv-core.js)');
  if(!window.supabase || !window.supabase.createClient) missing.push('supabase-js (CDN)');
  if(!P || !P.SUPABASE_URL) missing.push('VV_PUBLIC config');

  if(missing.length){
    console.warn('[vv] live search is OFF , missing: ' + missing.join(', ')
      + '. The search box still routes to Rankings/Compare. If this is a file:// URL, '
      + 'serve the folder over http instead; if the CDN is blocked, that is the cause.');
    var qi = document.getElementById('q');
    var vs = function(q){ return /\s+vs?\s+/i.test(q); };
    var route = function(){
      var q = (qi.value || '').trim(); if(!q) return;
      location.href = (vs(q) ? 'compare.html' : 'rankings.html') + '?q=' + encodeURIComponent(q);
    };
    document.querySelector('.search .go').onclick = route;
    qi.addEventListener('keydown', function(e){ if(e.key === 'Enter') route(); });
    return;
  }

  var sb = window.supabase.createClient(P.SUPABASE_URL, P.SUPABASE_ANON_KEY);

  var input = document.getElementById('q');
  var panel = document.getElementById('srPanel');

  /* (1) DEBOUNCE. 180ms , long enough to swallow a fast typist's whole word,
         short enough that a pause feels immediate. Measured: it removes 8 of the
         9 requests that typing "de bruyne" would otherwise issue. */
  var DEBOUNCE_MS = 180;

  /* (2) MINIMUM TOKEN LENGTH , THREE, AND THE THIRD CHARACTER IS THE ONE THAT MATTERS.
         A single character matches 96.2% of the table ("a" -> 54,893 of 57,058) and
         identifies nothing. The floor is 3 rather than 2 because of pg_trgm: the GIN
         indexes on player_name_norm / team_name_norm / player_name are TRIGRAM indexes,
         and a 2-character pattern cannot yield a full trigram, so `ilike '%ab%'` falls
         back to the sequential scan the indexes exist to remove , 225ms of scan to
         return something that identifies nobody. Three characters is where the index
         starts working AND where the answer starts being useful.
         IF THE INDEXES ARE EVER DROPPED THIS CAN GO BACK TO 2 , it is a performance
         floor, not a correctness one. */
  var MIN_CHARS = 3;

  /* (3) NO EXACT COUNT. Prefer:count=exact costs a measured 1.8x on this query
         because Postgres must count every match before returning twelve. A
         dropdown does not need a total. The "see all" line says "more" rather
         than a number, deliberately , rankings, which DOES count, is one tap away. */
  var LIMIT = 8;

  /* (4) ABORT THE PREVIOUS REQUEST. Without this, a slow early query can resolve
         AFTER a fast later one and repaint stale rows over fresh ones , the classic
         out-of-order race, and it is invisible until someone types quickly on a bad
         connection. A monotonic token settles it even where fetch cannot be aborted. */
  var seq = 0, timer = null, rows = [], cursor = -1, lastQ = '';

  /*  NO full_name , IT IS NOT ON THE MATVIEW, and asking for it 400s the whole query.
      Worth knowing beyond this file: VVCore.vvDisplayName needs the legal name to expand
      "E. Haaland", section C calls it "the derivation that resolves it", and the column it
      reads does not exist on player_card_mv. rowToCard already sidesteps this by taking
      row.player_name verbatim, so rankings shows the abbreviated form too. This surface
      matches rankings rather than inventing a third answer. */
  var SELECT = 'card_id,player_name,player_name_norm,team_name,team_name_norm,'
             + 'season_year,rt,league_code,position_pool,primary_colour';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /*  FIT THE PANEL TO THE ROOM THAT ACTUALLY EXISTS.
      visualViewport is the one that shrinks when the soft keyboard opens; innerHeight
      does not, so a vh-based list is sized for a screen the reader cannot see. Measured
      on the real index.html at 390x844: 342px below the search bar with no keyboard.
      The header and footer are measured rather than assumed, because both carry text
      that can wrap. The floor is 76px , one 56px row plus a peek of the next, which is
      what tells the reader the list scrolls. It is DELIBERATELY low: measured at 390x420
      with the hero compacted there are only ~79px of real room, and a 132px floor
      overflowed the screen by 41px rather than admitting it. A floor that exceeds the
      room does not protect the layout, it breaks it silently, and one honest row beats
      eight rendered off the bottom of the screen. */
  function fit(){
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var top = panel.getBoundingClientRect().top;
    var head = panel.querySelector('.srhead'), foot = panel.querySelector('.srfoot');
    var chrome = (head ? head.getBoundingClientRect().height : 0)
               + (foot ? foot.getBoundingClientRect().height : 0) + 16;
    panel.style.setProperty('--srmax', Math.max(76, Math.round(vh - top - chrome - 12)) + 'px');
  }
  if(window.visualViewport) window.visualViewport.addEventListener('resize', function(){
    if(panel.classList.contains('open')) fit();
  });

  var hero = document.querySelector('.hero');
  function close(){ panel.classList.remove('open'); panel.innerHTML=''; input.setAttribute('aria-expanded','false');
    if(hero) hero.classList.remove('searching'); cursor=-1; rows=[]; }
  function open(html){ panel.innerHTML=html; panel.classList.add('open'); input.setAttribute('aria-expanded','true');
    if(hero) hero.classList.add('searching'); }

  /* THE WAITING STATE IS THE TWO-TONE LOADER, NOT A BLANK AND NOT A SPINNER.
     vvLoader clamps below its floor rather than honouring a smaller request, so the
     size asked for here is a real size, not a wish. */
  function waiting(){
    open('<div class="srwait">' + C.vvLoader({size:44}) + '<span>Reading the seasons</span></div>');
  }

  /* THE EMPTY STATE IS THE RANKINGS EMPTY STATE. Not a copy of its words , the
     actual string, pulled from VVFilters.emptyStateHTML with searching:true, so the
     two surfaces cannot drift apart. If that copy is ever rewritten, this follows. */
  /* THE SCOPE LINE COMES FROM VVFilters, AND THE FIRST ATTEMPT AT THAT BROKE THE PAGE.
     emptyStateHTML needs a filter STATE, not an empty object , it reads st.score.bands
     directly. Passing {} threw at module load and took the ENTIRE feature with it: no
     listeners were ever attached, so the field simply did nothing and reported nothing.
     A top-level derivation that can throw is a single point of failure for everything
     below it. Hence: lazy, guarded, and LOUD if the shared copy cannot be reached ,
     never a silent fallback to an empty string, which would ship a blank empty state
     that looks deliberate. */
  var _scope = null;
  function scopeHTML(){
    if(_scope != null) return _scope;
    try {
      var d = document.createElement('div');
      d.innerHTML = F.emptyStateHTML({score:{bands:[]}}, {searching:true});
      var el = d.querySelector('.vvf-es-scope');
      if(el && el.innerHTML.trim()){ _scope = el.innerHTML; return _scope; }
    } catch(e){}
    console.warn('[vv] search empty-state scope line unreachable from VVFilters , the '
      + 'front door and rankings will disagree. Fix the call, do not hardcode the copy.');
    _scope = '';
    return _scope;
  }


  function failed(){
    open('<div class="srempty"><b>Search is not responding.</b>'
       + '<span>Something went wrong reaching the seasons, so this is not an answer about '
       + 'whether the player exists. Try again, or open Rankings.</span></div>');
  }

  function empty(q){
    open('<div class="srempty"><b>No seasons match &ldquo;' + esc(q) + '&rdquo;.</b>'
       + '<span>' + scopeHTML() + '</span></div>');
  }

  function rowHTML(r, i){
    var name = r.player_name || '';
    var season = C.vvSeasonLabel(r.season_year);
    var club = r.team_name || '';
    var vv = (r.rt == null) ? null : Math.round(r.rt);
    /*  ONE space each side, matching the card face's own sub-line (vv-core buildCard) and
        every other field list on the platform. This read '  ·  ' with two, which was dead
        intent rather than a different look: .srsub is white-space:nowrap, and nowrap
        COLLAPSES a run of spaces , only pre / pre-wrap / break-spaces preserve one.
        Measured under the real rule: double 87.70px, single 87.70px, identical; the same
        pair under white-space:pre measures 94.45 against 87.70, so the 6.75px was real and
        was being thrown away. If a future session wants an airier separator HERE, literal
        spaces will not deliver it , it needs margin on a wrapped span.  */
    var sub = [club, season].filter(Boolean).join(' · ');
    return '<button class="srrow" role="option" aria-selected="false" data-i="' + i + '" tabindex="-1">'
      + '<span class="srrail" style="background:' + esc(r.primary_colour || 'var(--pink)') + '"></span>'
      + '<span class="srmain"><span class="srnm">' + esc(name) + '</span>'
      + '<span class="srsub">' + esc(sub) + '</span></span>'
      + (vv == null
          ? '<span class="srvv nr">NR<span class="srvvl">VV</span></span>'
          : '<span class="srvv">' + vv + '<span class="srvvl">VV</span></span>')
      + '</button>';
  }

  function paint(list, q, more){
    rows = list; cursor = 0;
    var h = '<div class="srhead">Seasons</div><div class="srlist">'
          + list.map(rowHTML).join('') + '</div>'
          + '<div class="srfoot"><button class="srall" data-all="1" tabindex="-1">'
          + '<span>See all results in Rankings</span>'
          + '<span class="c">' + (more ? 'more to see' : list.length + ' found') + '</span></button></div>';
    open(h);
    /* fit twice, and the second is not belt-and-braces: the hero compaction is a
       transition, so measuring immediately reads the PRE-compaction position and sizes
       the list for room that is about to grow. The first call stops it overflowing in
       the meantime; the second uses the settled geometry. */
    fit();
    setTimeout(function(){ if(panel.classList.contains('open')) fit(); }, 260);
    mark();
    panel.querySelectorAll('.srrow').forEach(function(el){
      el.addEventListener('mousedown', function(e){ e.preventDefault(); go(+el.dataset.i); });
      el.addEventListener('mouseenter', function(){ cursor = +el.dataset.i; mark(); });
    });
    panel.querySelector('.srall').addEventListener('mousedown', function(e){ e.preventDefault(); goAll(); });
  }

  function mark(){
    var els = panel.querySelectorAll('.srrow');
    els.forEach(function(el){
      var on = (+el.dataset.i === cursor);
      el.classList.toggle('on', on);
      el.setAttribute('aria-selected', on ? 'true' : 'false');
      if(on) el.scrollIntoView({block:'nearest'});
    });
    var all = panel.querySelector('.srall');
    if(all) all.classList.toggle('on', cursor === rows.length);
  }

  function go(i){
    var r = rows[i]; if(!r) return;
    location.href = 'card.html?id=' + r.card_id;
  }
  function goAll(){
    location.href = 'rankings.html?q=' + encodeURIComponent(input.value.trim());
  }

  /* THE COMPARE ROUTE IS UNCHANGED , a "vs" query is not a card lookup and must not
     open a dropdown. Same guarded pattern as today: the token has to be surrounded by
     whitespace, so a name carrying a standalone v does not route to Compare. */
  function isVersus(q){ return /\s+vs?\s+/i.test(q); }

  function search(raw){
    var q = raw.trim();
    lastQ = q;
    if(isVersus(q)) { close(); return; }

    /* vvParseSearch splits the season off the name , "rodri 23/24" is a name token
       plus season_year 2023, and a bare year means the season ENDING in it. Shared
       with rankings and the compare picker, so the three read a query identically. */
    var parsed = C.vvParseSearch(q);
    var nameQ = parsed.nameQ || '';
    var filter = nameQ ? C.tokenAndFilter(nameQ) : null;

    // (2) the character floor , applies to the NAME part, so "pl 23/24" still works
    var longest = nameQ.split(/\s+/).reduce(function(m,t){ return Math.max(m, t.length); }, 0);
    if(!filter && parsed.seasonYear == null) { close(); return; }
    if(filter && longest < MIN_CHARS && parsed.seasonYear == null) { close(); return; }

    var mine = ++seq;                                   // (4) the ordering token
    waiting();

    var query = sb.from('player_card_mv').select(SELECT);   // (3) no count
    if(filter) query = query.or(filter);
    if(parsed.seasonYear != null) query = query.eq('season_year', parsed.seasonYear);
    // nullsFirst:false , ORDER BY rt DESC puts NULL first in Postgres, which would
    // hand the top slot of the front door to an unscored card. See CLAUDE.md section C.
    query = query.order('rt', {ascending:false, nullsFirst:false}).limit(LIMIT + 1);

    query.then(function(res){
      if(mine !== seq) return;                           // a newer keystroke already won
      /*  A FAILED QUERY IS NOT AN EMPTY RESULT, AND RENDERING IT AS ONE IS A LIE.
          "No seasons match" tells the visitor their player is not in the dataset. If the
          request actually failed, that statement is false and it is unfalsifiable from the
          outside , exactly the report-a-state-that-did-not-happen family in section C.
          This bug was live in the first draft of this file and only a rendered check found
          it: a missing column 400'd every query and the panel confidently said no match. */
      if(res.error){ failed(); return; }
      var data = res.data || [];
      var more = data.length > LIMIT;
      data = data.slice(0, LIMIT);
      if(!data.length){ empty(q); return; }
      // the shared relevance re-rank , exact > prefix > word-start > mid-string, then rt
      data = C.rankBySearch(data, nameQ, function(r){
        return (r.player_name || '') + ' ' + (r.player_name_norm || '');
      });
      paint(data, q, more);
    });
  }

  input.addEventListener('input', function(){
    clearTimeout(timer);
    var v = input.value;
    if(!v.trim()){ seq++; close(); return; }             // clearing is instant, not debounced
    timer = setTimeout(function(){ search(v); }, DEBOUNCE_MS);   // (1)
  });

  input.addEventListener('keydown', function(e){
    var open_ = panel.classList.contains('open') && rows.length;
    if(e.key === 'ArrowDown'){
      if(!open_) return;
      e.preventDefault(); cursor = Math.min(cursor + 1, rows.length); mark();
    } else if(e.key === 'ArrowUp'){
      if(!open_) return;
      e.preventDefault(); cursor = Math.max(cursor - 1, 0); mark();
    } else if(e.key === 'Enter'){
      // ENTER OPENS THE TOP RESULT when the list is up , the requirement , and falls
      // back to the existing routing when it is not, so a "vs" query and a query typed
      // faster than the debounce both still work.
      if(open_){ e.preventDefault(); if(cursor === rows.length) goAll(); else go(cursor < 0 ? 0 : cursor); }
      else { var q = input.value.trim(); if(q) location.href = (isVersus(q) ? 'compare.html' : 'rankings.html') + '?q=' + encodeURIComponent(q); }
    } else if(e.key === 'Escape'){
      close(); 
    }
  });

  input.addEventListener('blur', function(){ setTimeout(close, 120); });
  input.addEventListener('focus', function(){ if(input.value.trim()) search(input.value); });
  document.querySelector('.search .go').onclick = function(){
    var q = input.value.trim(); if(!q) return;
    location.href = (isVersus(q) ? 'compare.html' : 'rankings.html') + '?q=' + encodeURIComponent(q);
  };
})();
</script>
</body>
</html>
