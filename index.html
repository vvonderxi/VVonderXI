  <!--  THE META BLOCK ABOVE IS index.html's, VERBATIM AND COMPLETE , 9 og: tags and 5
        twitter:, plus the title and description. It is the whole reason this page can stand
        in for the site: a crawler reads static HTML, so every link already shared keeps the
        title, description and image it has today. Do not tidy it, do not rewrite the copy,
        and do not drop og-image.png from this branch. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  :root{--cream:#F0EAD9;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;
        --cw:300px;--sp:186px}
  /*  --cw and --sp DEFAULTS SO THE PAGE IS NEVER BLANK OR COLLAPSED. JS owns both and sets
      them every resize; these are only ever used if that never ran. Without them a thrown
      exception left a zero-width fan inside a zero-height stage. */
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--cream);
    background:radial-gradient(150% 620px at 50% -140px, rgba(255,244,224,.07), transparent 78%),
               radial-gradient(120% 90% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);
    background-attachment:fixed}
  body.light{color:#241f1a;
    background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.7), transparent 78%),
               radial-gradient(120% 90% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);
    background-attachment:fixed}

  /*  THE CARD BACKS , MARKUP AND TIER CSS COPIED FROM THE PRODUCT, NOT RETYPED.
      Markup is VVCore.vvBackFace()'s output; the .vvmono* rules are compare.html's.
      THIS PAGE DELIBERATELY LOADS NO JAVASCRIPT AT ALL beyond its own inline block, and
      that is a trade made with eyes open , loading the engine to source three divs would
      cost the page that must load fastest almost everything. The price is a second copy of
      the tier rules, recorded here so it is not silent. If this branch ever stops being
      temporary, move .vvmono* into vv-core beside vvBackFace and load it properly.
      PLAIN BLACK, NOT THE GENERATIONAL FACE. compare.html's .vvmono-black carries a gold
      inset rim, which is the Generational tier's signature; beside the gold back it read as
      two golds. Cream and gold are real tiers and plain black is not, so the fan reads as
      three cards rather than three tiers. Deliberate , do not restore the gold rim. */
  .vvmono{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*0.073);
    display:flex;align-items:center;justify-content:center;position:relative}
  .vvmonomark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:calc(var(--cw)*0.34);letter-spacing:-.02em;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.3)}
  .vvmono-cream{background:linear-gradient(158deg,#FBF7EF,#E4DAC6);
    box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.7),
               inset 0 0 0 calc(var(--cw)*0.026) rgba(140,120,90,.35),0 24px 60px -20px rgba(0,0,0,.5)}
  .vvmono-cream .vvmonomark{color:#1C1B1A}
  .vvmono-cream .vvmonomark span{color:#AD0332}
  .vvmono-gold{background:linear-gradient(158deg,#F6DE93,#DC9E2C);
    box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.45),
               inset 0 0 0 calc(var(--cw)*0.026) #9a6a14,0 24px 60px -20px rgba(120,80,10,.55)}
  .vvmono-gold .vvmonomark{color:#2b1d05}
  .vvmono-gold .vvmonomark span{color:#AD0332}
  .vvmono-black{background:linear-gradient(158deg,#2c2926,#121010);
    box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.07),
               inset 0 0 0 calc(var(--cw)*0.026) rgba(255,255,255,.11),
               0 24px 60px -20px rgba(0,0,0,.72)}
  .vvmono-black .vvmonomark{color:#F0EAD9}
  .vvmono-black .vvmonomark span{color:var(--pink-ink)}

  /*  THE ARRIVAL , CARDS BEING LAID DOWN, NOT FADED IN.
      A fade says "content appeared". A card being dealt has weight: it comes from above and
      slightly larger (nearer the viewer) and settles onto the surface. Three things carry
      that, all of them transforms or opacity so it stays on the compositor:
        , translateY from -34px, so it falls rather than materialises
        , scale from 1.05 to 1, so it reads as approaching the surface
        , a shadow layer that starts wide and soft and tightens as it lands
      The easing is the whole difference. cubic-bezier(.17,.84,.38,1) decelerates hard,
      which is what a laid-down object does; a plain ease-out arrives politely and dead.
      Sampled live rather than eyeballed: the travel runs -65, -146, -184, -196, -197 px. */
  .fanc{position:absolute;opacity:0;
    transform:translate3d(0,-34px,0) rotate(0deg) scale(1.05);
    transition:transform .92s cubic-bezier(.17,.84,.38,1), opacity .5s ease}
  .fanc::after{content:'';position:absolute;inset:0;border-radius:calc(var(--cw)*0.073);
    pointer-events:none;box-shadow:0 60px 90px -30px rgba(0,0,0,.75);opacity:0;
    transition:opacity .92s cubic-bezier(.17,.84,.38,1)}
  body.go .fanc{opacity:1}
  body.go .fanc::after{opacity:1}
  /*  --sp IS DERIVED FROM THE CARD WIDTH IN JS, NEVER HARD-CODED. A back covers its
      neighbour's VV mark until the offset clears cw*0.705; the old page hard-coded 124px
      against a 214px card (0.58) and the marks overlapped, and scaling the card kept the
      same ratio and the same overlap. */
  body.go .f1{transform:translate3d(calc(-1 * var(--sp)),0,0) rotate(-8deg);transition-delay:.06s}
  body.go .f2{transform:translate3d(0,0,0)                    rotate(0deg); transition-delay:.19s}
  body.go .f3{transform:translate3d(var(--sp),0,0)            rotate(8deg); transition-delay:.32s}

  .stage{position:relative;display:flex;justify-content:center;align-items:center;
    min-height:calc(var(--cw)*1.397)}
  .mark{display:block;height:44px;width:auto}

  .tag{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;
    line-height:1.12;letter-spacing:-.025em;margin:0;max-width:13em;
    font-size:clamp(30px,3.5vw,50px)}
  .tag .pk{color:var(--pink-ink)}
  body.light .tag .pk{color:#AD0332}
  .brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;letter-spacing:.26em;
    text-transform:uppercase;opacity:.5;margin-top:clamp(16px,2.4vh,26px)}

  /*  THE FORM IS A FOOTNOTE, NOT A PANEL. The boxed version competed with the cards for the
      eye: a filled ground, a pink border and a 17.5px heading is a second focal point on a
      page that should have exactly one. A label, a ruled line and a text button reads as an
      invitation, and it only asserts itself on focus. */
  .notify{width:100%;max-width:400px;margin-top:clamp(34px,6vh,66px)}
  .nlab{font-family:'Archivo',sans-serif;font-weight:800;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.42;margin-bottom:11px}
  .form{display:flex;align-items:center;gap:10px;
    border-bottom:1px solid rgba(255,255,255,.20);padding-bottom:9px;transition:border-color .3s ease}
  body.light .form{border-bottom-color:rgba(0,0,0,.20)}
  .form:focus-within{border-bottom-color:var(--pink-ink)}
  body.light .form:focus-within{border-bottom-color:#AD0332}
  .form input{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;
    font-size:16px;outline:none;padding:2px 0}
  .form input::placeholder{opacity:.34}
  .form button{font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;background:none;border:0;color:inherit;cursor:pointer;
    opacity:.62;padding:2px 0;white-space:nowrap;transition:opacity .25s ease}
  .form button:hover{opacity:1}
  .form button:disabled{opacity:.35;cursor:default}
  .nnote{font-size:11.5px;opacity:.4;margin-top:11px;line-height:1.5}
  .err{display:none;font-size:12.5px;line-height:1.55;margin-top:12px;color:var(--pink-ink)}
  body.light .err{color:#AD0332}

  /*  THE RECEIPT IS THE LOUDEST THING IN THIS BLOCK ONCE IT EXISTS, WHICH IS THE REVERSAL
      THAT MATTERED. It used to be 12.5px at .8 opacity , quieter than the label above it ,
      so the one piece of evidence that the signup worked was the least prominent element in
      its own box. Now it is the only thing in the box, and it leads. */
  .thanks{display:none;margin-top:2px}
  .tline{display:flex;align-items:baseline;gap:9px}
  .ttick{color:var(--pink-ink);font-size:17px;line-height:1;font-weight:700}
  body.light .ttick{color:#AD0332}
  .tlead{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;font-size:22px;
    letter-spacing:-.015em;line-height:1.2}
  /*  The address is echoed at full strength and allowed to break , a long address must wrap
      rather than push the column wider or slide under the fan. */
  .taddr{margin-top:9px;font-size:14px;font-weight:500;opacity:.92;
    overflow-wrap:anywhere;word-break:break-word;
    padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.16)}
  body.light .taddr{border-bottom-color:rgba(0,0,0,.16)}
  .tsub{margin-top:11px;font-size:12.5px;opacity:.55;line-height:1.5}

  /*  ON SUCCESS THE INVITATION HAS TO GO, NOT JUST THE INPUT. Hiding only the form left
      "BE FIRST THROUGH THE DOOR" still calling to someone who had already walked through it,
      and left "One message when it opens" on screen twice, four words apart, because the
      standing note and the confirmation both said it. */
  .notify.sent .nlab,.notify.sent .nnote{display:none}

  /*  Everything that is not a card arrives after the cards have landed. The fan finishes at
      .32 + .92 = 1.24s; the words start at 1.15s so they overlap by a breath rather than
      queueing politely behind it. */
  .mark,.tag,.brand,.notify{opacity:0;transform:translateY(10px);
    transition:opacity .7s ease,transform .7s cubic-bezier(.22,.61,.36,1)}
  body.go .mark  {opacity:1;transform:none;transition-delay:.02s}
  body.go .tag   {opacity:1;transform:none;transition-delay:1.15s}
  body.go .brand {opacity:1;transform:none;transition-delay:1.30s}
  body.go .notify{opacity:1;transform:none;transition-delay:1.44s}

  /*  THE SPLIT. The fan takes a column of its own, so the words and the form never compete
      with it for vertical space. That is the whole reason this layout was chosen: at
      1440x760 it keeps a 330px card AND the form above the fold with zero overflow, where
      the stacked build collapsed the card to 141px to fit the same content. */
  .wrap{min-height:100vh;display:grid;grid-template-columns:1.32fr .68fr;
    align-items:center;gap:clamp(40px,6vw,110px);
    max-width:1440px;margin:0 auto;padding:0 clamp(32px,5vw,84px)}
  .left{display:flex;justify-content:center}
  .right{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
  .mark{margin-bottom:clamp(26px,4.4vh,46px)}

  /*  THE COLLAPSE, AND THE BREAKPOINT IS 1230px , FAR HIGHER THAN IT LOOKS LIKE IT SHOULD BE.
      A split layout breaks where it stacks, so this was swept across the boundary in both
      directions rather than eyeballed, and the first attempt at 900px was badly wrong: at
      901px the grid was still two columns and the card measured 206px, while at 900px it
      stacked and the card jumped to 300px. TWO COLUMNS WAS PRODUCING A SMALLER HERO THAN ONE
      COLUMN, and 206px is below even the 233px this page ships today. The split was losing
      at every width below about 1300.
      The reason is simple once measured: a second column only pays for itself when the fan's
      column is still wider than the whole viewport would have given it stacked. Solving the
      two sizing formulas against each other puts that crossover at 943px, and the breakpoint
      IS the crossover, which is what makes the jump vanish.
      IT MOVED TWICE WHILE BEING FOUND, AND BOTH MOVES ARE THE SAME LESSON. First 900, which
      was simply a guess. Then 1230, solved honestly , but solved against a stacked card of
      300px that was itself produced by a GUESSED vertical constant. Once the stacked side
      was measured properly that card turned out to be 230px, not 300, and the crossover fell
      to 943. A crossover is only as good as the two formulas it is solved between, and one
      of mine was fiction.
      IF YOU CHANGE SPREAD_WIDE OR ANYTHING ABOVE THE FORM, THIS NUMBER MOVES WITH IT. It is
      solved at a 760px viewport height, the case that matters on laptops; at other heights
      the true crossover shifts slightly and a small step at the boundary returns.
      */
  @media (max-width:943px){
    .wrap{grid-template-columns:1fr;gap:clamp(28px,4.5vh,44px);
      padding:clamp(34px,6vh,54px) 22px clamp(40px,7vh,60px);min-height:100vh;
      align-content:center}
    .right{align-items:center;text-align:center}
    .tag{font-size:clamp(28px,5.4vw,40px);max-width:15em}
    .notify{margin-top:clamp(26px,4vh,40px);max-width:340px}
    .form{justify-content:center}
    .mark{margin-bottom:clamp(20px,3.4vh,34px)}
  }
  @media (max-width:420px){ .notify{max-width:none} }

  /*  ONE RULE FOR REDUCED MOTION. The finished state is pinned rather than re-implemented:
      transitions off, everything placed exactly where the animation would have left it,
      fan offsets included. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
    .fanc,.mark,.tag,.brand,.notify{opacity:1 !important}
    .fanc::after{opacity:1 !important}
    .mark,.tag,.brand,.notify{transform:none !important}
    .f1{transform:translate3d(calc(-1 * var(--sp)),0,0) rotate(-8deg) !important}
    .f2{transform:translate3d(0,0,0) rotate(0deg) !important}
    .f3{transform:translate3d(var(--sp),0,0) rotate(8deg) !important}
  }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="stage" id="stage">
        <div class="fanc f1"><div class="vvmono vvmono-cream"><div class="vvmonomark">V<span>V</span></div></div></div>
        <div class="fanc f2"><div class="vvmono vvmono-gold"><div class="vvmonomark">V<span>V</span></div></div></div>
        <div class="fanc f3"><div class="vvmono vvmono-black"><div class="vvmonomark">V<span>V</span></div></div></div>
      </div>
    </div>
    <div class="right">
      <img class="mark" id="mark" src="/assets/spinelogo-dark.png" alt="VVonderXI" width="100" height="44">
      <div class="tag">Every Season Tells a Different <span class="pk">Story</span></div>
      <div class="brand">The Football Legacy Platform</div>
      <div class="notify">
        <div class="nlab">Be first through the door</div>
        <div class="form" id="form">
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email" aria-label="Your email address">
          <button type="button" id="go">Notify me</button>
        </div>
        <div class="nnote">One message when it opens. Nothing else, ever.</div>
        <div class="err" id="err" role="alert">That did not send. Your address is still above , try again in a moment.</div>
        <!--  THE RECEIPT. With no confirmation email, this is the ONLY evidence a visitor
              ever gets that it worked, so it answers the three questions they actually have,
              in the order they have them: did it work, do you have MY address, and what
              happens next. The address is echoed because it is the only chance anyone has to
              notice they mistyped it. role=status so it is announced, not just painted. -->
        <div class="thanks" id="thanks" role="status" aria-live="polite">
          <div class="tline"><span class="ttick">&#10003;</span><span class="tlead">You&rsquo;re on the list.</span></div>
          <div class="taddr" id="sentTo"></div>
          <div class="tsub">We&rsquo;ll write the day the doors open.</div>
        </div>
      </div>
    </div>
  </div>
<script>
(function(){
  var light=false;
  try{ var t=localStorage.getItem('vvTheme');
       light = t ? (t==='light') : window.matchMedia('(prefers-color-scheme: light)').matches; }catch(e){}
  document.body.classList.toggle('light', light);
  var m=document.getElementById('mark');
  if(m) m.src='/assets/spinelogo-'+(light?'light':'dark')+'.png';

  /*  THE REVEAL IS SCHEDULED FIRST, BEFORE ANY CODE THAT COULD THROW. Everything starts at
      opacity 0 and is uncovered by adding one class, so a single exception anywhere below
      would leave a visitor looking at an empty page , the worst possible failure for the
      only page the site has. rAF ALSO DOES NOT FIRE IN A HIDDEN TAB, and a shared link is
      very often opened in one, so the timer is not redundant. All three paths are
      idempotent. */
  function reveal(){ document.body.classList.add('go'); }
  requestAnimationFrame(function(){ requestAnimationFrame(reveal); });
  setTimeout(reveal, 80);
  document.addEventListener('visibilitychange', reveal, {once:true});

  var SPREAD_WIDE=0.55, SPREAD_NARROW=0.52, ROT=1.10, ROT_NARROW=1.06, MIN=112, STACK_AT=943;
  /*  SPREAD IS TIGHTER THAN THE STACKED PAGE'S 0.78 BECAUSE THE COLUMN IS THE CONSTRAINT
      HERE, NOT THE VIEWPORT. At 0.78 the fan needed 2.56 card-widths of column and the card
      fell to 235px; 0.55 buys 352px at 1440. The outer marks are partly covered as a result, which
      on this layout reads as a deck rather than as three named tiers , the deliberate trade.
      On a phone 0.52 rather than 0.44: at 0.44 the card reached 185px but only the black
      back's mark stayed visible, and a fan where two of three cards show no mark has stopped
      saying anything at all. 0.52 gives up 20px of card to keep all three partly readable. */

  function size(){
    var vw=window.innerWidth, vh=window.innerHeight, wide=vw>STACK_AT, cw;
    var sp = wide?SPREAD_WIDE:SPREAD_NARROW;
    if(wide){
      /*  THIS RATIO MUST TRACK grid-template-columns IN THE CSS. It did not, once: the CSS
          went to 1.32fr while this stayed at 1.05, so the fan was sized for a column
          narrower than the one it was in and came out 235px. Two numbers describing one
          layout in two languages is the same class of defect as a hard-coded spread. */
      var GRID_LEFT=1.32, GRID_TOTAL=2.0;
      var pad=Math.min(84,Math.max(32,vw*0.05)), gap=Math.min(110,Math.max(40,vw*0.06));
      var colW=(Math.min(1440,vw)-2*pad)*(GRID_LEFT/GRID_TOTAL)-gap/2;
      cw=Math.min(colW/((1+2*sp)*ROT), (vh*0.88)/1.397, 460);
    } else {
      /*  STACKED, AND THE VERTICAL COST IS MEASURED RATHER THAN A CONSTANT.
          This was "vh - 330" and 330 was a guess: the real furniture is about 426px, so the
          card came out 300 and pushed the form 96px BELOW THE FOLD at 760. A constant like
          that is invisible to every future edit and nothing throws when it goes stale , the
          only symptom is the form quietly drifting off-screen, which is the exact defect
          this page was rebuilt to remove once already.
          So: collapse the fan, measure the wrapper at whatever height the real content is,
          and give the card the remainder. Change the copy or the type scale and it keeps
          working. The headline is sized from vw, never from the fan, so collapsing the stage
          cannot change the height of the thing being measured , no circularity. */
      var st0=document.getElementById('stage'), wrap=document.querySelector('.wrap');
      /*  BOTH height AND min-height. .stage carries min-height:calc(var(--cw)*1.397) so the
          fan reserves its space before JS runs, and that min-height does not care about an
          inline height:0 , the collapse silently did nothing, the measurement came back
          including the whole fan, and the card floored at 112px. Zero both, measure, restore. */
      /*  AND THE WRAPPER'S OWN min-height:100vh HAS TO GO TOO WHILE MEASURING. Left in, the
          box can never measure smaller than the viewport, so vh - fixedV was always about
          zero and the card floored at 112px at every stacked width. Three separate floors
          had to be lifted before this measurement told the truth: the stage's height, the
          stage's min-height, and the wrapper's. A measurement is only as honest as the
          constraints you remember to remove. */
      st0.style.minHeight='0px'; st0.style.height='0px'; wrap.style.minHeight='0px';
      var fixedV=wrap.getBoundingClientRect().height;   // one sync reflow, on resize only
      st0.style.minHeight=''; wrap.style.minHeight='';
      cw=Math.min((vh-fixedV-2)/1.397, (vw-40)/((1+2*sp)*ROT_NARROW), 380);
    }
    cw=Math.round(Math.max(MIN,cw));
    /*  --cw GOES ON THE BODY, NOT ON EACH CARD, AND THAT IS THE WHOLE FIX FOR A LONG BUG.
        Setting it per .vvmono left every OTHER consumer of --cw resolving against the :root
        default instead of the real size , and .stage{min-height:calc(var(--cw)*1.397)} is
        one of those. The stage therefore reserved a 300px card's height forever, which both
        poisoned the measurement above and added 96px of overflow below the fold no matter
        what the card actually measured. On the body it inherits to the cards AND the stage,
        and :root stays as the pre-JS default it was meant to be. */
    document.body.style.setProperty('--cw', cw+'px');
    document.body.style.setProperty('--sp', Math.round(cw*sp)+'px');
    var st=document.getElementById('stage');
    if(st) st.style.height=Math.round(cw*1.397)+'px';
  }
  window.addEventListener('resize', size);
  try{ size(); }catch(e){ /*  a sizing failure must not cost the page its content  */ }
})();
/*  TWO WRITES, ONE OF THEM DECIDES.
    Supabase is the RECORD and Formspree is the NOTIFICATION, and the thanks is gated on the
    record. A Formspree cap or outage then costs a ping, never a signup , which matters here
    because Formspree does not document what it returns once the monthly cap is reached, so
    it cannot be trusted to fail loudly. Nothing about the r.ok contract is relaxed: the page
    still awaits the write that counts and still keeps the typed address on failure.
    THE ORDER MATTERS. Supabase is awaited first and alone decides; the ping is fired after
    and its result is deliberately ignored.
    NO SDK. This is one REST call with the publishable key, so the page stays dependency-free
    , it loads no external JavaScript at all and that is the point of a holding page.
    THE KEY IS THE PUBLIC PUBLISHABLE ONE, copied from index.html, and it is safe in the page:
    waitlist_emails is RLS insert-only for anon. Verified against the live database, not
    assumed , anon inserted a row and read back zero. See migrations/waitlist_emails.sql. */
(function(){
  var SB_URL = "https://krqthvroetbxgnvwwjar.supabase.co";
  var SB_KEY = "sb_publishable_kQLTYxHeUvR_7AqPDPdXlA_nR8dwINp";

  var go=document.getElementById('go'), el=document.getElementById('email');
  var err=document.getElementById('err'), thanks=document.getElementById('thanks'), form=document.getElementById('form');

  /*  The list is the thing. If this write fails the visitor is told so and keeps their
      address in the field, exactly as before. */
  async function record(email){
    var r=await fetch(SB_URL+'/rest/v1/waitlist_emails', {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
               'Content-Type':'application/json',
               /*  return=minimal , there is deliberately no anon SELECT policy, so asking
                   for the row back would fail on the read after a write that succeeded. */
               'Prefer':'return=minimal'},
      body:JSON.stringify({email:email, source:'vvonderxi.com waitlist'})
    });
    return r.ok;
  }

  /*  Fire and forget, on purpose. The endpoint is iwonder.html's and myclub.html's, copied
      from the file, not written from memory , the first version of this page carried an id I
      invented and every submission on it failed. */
  function ping(email){
    try{
      fetch('https://formspree.io/f/maqzaooq', {
        method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'},
        body:JSON.stringify({email:email, source:'vvonderxi.com waitlist'})
      }).catch(function(){});
    }catch(_){}
  }

  async function submit(){
    var e=el.value.trim();
    if(!e || e.indexOf('@')<1){ el.focus(); return; }
    err.style.display='none';
    go.disabled=true; go.textContent='Sending...';
    var ok=false;
    try{ ok=await record(e); }catch(_){ ok=false; }
    go.disabled=false; go.textContent='Notify me';
    if(ok){
      ping(e);                      // after the decision, never part of it
      /*  textContent, never innerHTML , this is user input going back onto the page. */
      var to=document.getElementById('sentTo'); if(to) to.textContent=e;
      document.querySelector('.notify').classList.add('sent');
      form.style.display='none'; thanks.style.display='block';
    } else {
      err.style.display='block';    // address stays in the field
    }
  }
  go.addEventListener('click', submit);
  el.addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); });
})();
</script>
