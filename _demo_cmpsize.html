<!doctype html><html><head><meta charset="utf-8">
<title>Compare , card size and empty state</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink-soft:#a49d93;--gold-ink:#E8B84B;--cream:#F0EAD9;--cream-deep:#E2D8C4;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--pink-glow:#FF8FA3;--green:#2E8C5A;--gold:#E8B84B;--blue:#3B6FB0;--panel-t:#1C6038;--panel-b:#0F3A22;
    /* ── TONAL DEPTH , four surface tiers (dark values; light overridden in body.light).
       Purpose: the page had ONE tone , every .vsect computed to #fff on a near-flat
       cream stage, and .vfinal (the payoff) had no background at all. These give the
       page a floor -> plinth -> panel -> hero ladder so the verdict can sit on top.
       HARD RULE: any tier that carries a CHART (radar, trajectory) must follow the
       BODY theme, because the chart colours are body.light-qualified. Light theme ->
       light panel, dark theme -> dark panel. Never a dark panel under a light body. */
    --surf-stage:#141011;   /* .verdict , the stage everything sits in */
    --surf-plinth:#171412;  /* .matchup , so the cards sit ON something */
    --surf-hero:#2A2422;    /* .vfinal  , the payoff                   */
    --edge-hero:rgba(255,92,122,.30)}
html,body{margin:0}
body.pv{background:#4a4a4a;font-family:'Inter',system-ui,sans-serif;color:#eee}
.wrap{padding:0 18px 22px}
h1{font-family:'Archivo';font-size:17px;margin:0 0 4px}
.lede{font-size:12px;opacity:.78;margin:0 0 16px;max-width:1100px;line-height:1.55}
.ttl{font-family:'Archivo';font-weight:800;font-size:13px;margin:0 0 3px}
.note{font-size:11px;opacity:.72;margin:0 0 8px;width:800px;line-height:1.45;min-height:40px}
.pair{display:flex;gap:14px;margin-bottom:24px}
.pw{position:relative;width:390px}
iframe.ph{width:390px;height:844px;border:1px solid #000;display:block;background:#111}
.fold{position:absolute;left:0;right:0;top:844px;border-top:2px dashed rgba(255,90,90,.95)}
.meas{font-size:10.5px;opacity:.66;margin:8px 0 0;line-height:1.5;width:390px;font-variant-numeric:tabular-nums}
/* ---------- phone doc ---------- */
body.phone{width:390px;height:844px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);color:var(--cream)}
body.phone.light{background:radial-gradient(120% 80% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);color:#241f1a}
.top{height:44px;display:flex;align-items:center;padding:0 14px;font-size:11px;opacity:.7;
  font-family:'Archivo';font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.plinth{margin:14px 7px 0;padding:16px 7px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
body.light .plinth{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.06)}
.row3{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:start;justify-items:center}
.vsm{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo';font-weight:900;font-size:14px;background:radial-gradient(circle at 50% 35%,#2a2422,#161313);
  border:2px solid var(--pink);color:var(--cream);align-self:center;margin-top:60px}
body.light .vsm{background:radial-gradient(circle at 50% 35%,#fff,#F0EAD9);color:var(--charcoal)}
.slot{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*0.073);
  border:2px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-sizing:border-box;gap:6px}
body.light .slot{border-color:rgba(0,0,0,.24)}
.slot b{font-family:'Archivo';font-weight:800;font-size:8.4px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.slot .vvm{font-family:'Archivo';font-weight:900;font-size:26px}
.slot .vvm i{color:var(--pink-ink);font-style:normal}
.slot small{font-family:'Archivo';font-weight:700;font-size:7.6px;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.cta{font-family:'Archivo';font-weight:900;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:linear-gradient(135deg,#E70443,#FF8FA3);color:#fff;border:none;border-radius:14px;padding:14px 0;width:100%;opacity:.45}
.ctaw{padding:16px 14px 0}
/* suggested matchups */
.sugh{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  opacity:.5;padding:20px 16px 8px}
.sug{margin:0 14px 8px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:9px}
body.light .sug{background:rgba(0,0,0,.035);border-color:rgba(0,0,0,.10)}
.sug .nm{font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;line-height:1}
.sug .yr{font-family:'Archivo';font-weight:700;font-size:9.5px;opacity:.55;margin-top:2px}
.sug .v{font-family:'Archivo';font-weight:900;font-size:15px;color:var(--pink-ink)}
body.light .sug .v{color:#AD0332}
.sug .mid{font-family:'Archivo';font-weight:800;font-size:8.5px;letter-spacing:.1em;opacity:.4}
.sug .side{flex:1;min-width:0}
.sugwhy{font-family:'Inter';font-size:10px;opacity:.5;padding:0 16px 0;margin:-2px 0 10px}
  .vvcard{--cw:300px;position:relative;width:var(--cw);max-width:92%;height:calc(var(--cw)*1.397);box-sizing:border-box;display:flex;flex-direction:column;border-radius:calc(var(--cw)*0.073);
    background:radial-gradient(130% 60% at 50% 0%, #F7F2E6 0%, var(--cream) 48%, var(--cream-deep) 100%) !important;
    box-shadow:0 26px 50px -22px rgba(0,0,0,0.6), inset 0 0 0 calc(var(--cw)*0.02) var(--cream), inset 0 0 0 calc(var(--cw)*0.025) rgba(28,27,26,0.55) !important;
    padding:calc(var(--cw)*0.055) calc(var(--cw)*0.07);color:#1C1B1A !important;font-family:'Barlow Condensed',sans-serif}
  .vvcard .chtagcell-cross{background:linear-gradient(90deg,#5A5856,#46443F) !important}
  .vvcard .chtagcell.gold{background:linear-gradient(90deg,#F0D27A,#E0A93A) !important;color:#5a4410}
  

  /* ===== Prestige whole-card treatment ===== */
  /* GENERATIONAL , deep BLACK card, gold ring + gold accents */
  body .vvcard.gen{background:radial-gradient(130% 60% at 50% 0%, #2c2824 0%, #16120e 50%, #090706 100%) !important;color:#F0EAD9 !important;box-shadow:0 22px 50px -22px rgba(0,0,0,0.85), inset 0 0 0 calc(var(--cw)*0.02) #16120e, inset 0 0 0 calc(var(--cw)*0.025) rgba(232,184,75,0.7) !important}

</style></head><body>
<script src="/vv-marks.js"></script><script src="/vv-core.js"></script>
<script>
var P=new URLSearchParams(location.search), D=P.get('d'), T=P.get('t');
var A={year:'03/04',club1:'#EF0107',number:14,pos:'ST',vv:93,flag:'\u{1F1EB}\u{1F1F7}',surname:'Henry',full:'Thierry Henry',clubname:'Arsenal',age:'26',goals:30,assists:7,prestige:'Iconic'};
var B={year:'22/23',club1:'#6CABDD',club2:'#004D98',number:9,pos:'ST',vv:90,flag:'\u{1F1F3}\u{1F1F4}',surname:'Haaland',full:'Erling Haaland',clubname:'Man City',age:'22',goals:36,assists:8};
function card(d,cw){return '<div style="--cw:'+cw+'px;display:flex;justify-content:center">'+VVCore.buildCard(d,cw)+'</div>';}
function slot(cw,l){return '<div class="slot" style="--cw:'+cw+'px"><b>'+l+'</b><div class="vvm">V<i>V</i></div><small>Tap to choose</small></div>';}
function sug(a,b,why){return '<div class="sug"><div class="side"><div class="nm">'+a[0]+'</div><div class="yr">'+a[1]+'</div></div>'
 +'<div class="v">'+a[2]+'</div><div class="mid">VS</div><div class="v">'+b[2]+'</div>'
 +'<div class="side" style="text-align:right"><div class="nm">'+b[0]+'</div><div class="yr">'+b[1]+'</div></div></div>'
 +(why?'<div class="sugwhy">'+why+'</div>':'');}
var DIRS={
 size145:function(){return '<div class="top">Compare</div><div class="plinth"><div class="row3">'
   +'<div>'+card(A,145)+'</div><div class="vsm">VS</div><div>'+card(B,145)+'</div></div></div>'
   +'<div class="ctaw"><button class="cta" style="opacity:1">Settle it</button></div>';},
 size175:function(){return '<div class="top">Compare</div><div class="plinth" style="padding:16px 4px"><div class="row3" style="gap:4px">'
   +'<div>'+card(A,175)+'</div><div class="vsm" style="margin-top:80px">VS</div><div>'+card(B,175)+'</div></div></div>'
   +'<div class="ctaw"><button class="cta" style="opacity:1">Settle it</button></div>';},
 emptyNow:function(){return '<div class="top">Compare</div><div class="plinth"><div class="row3">'
   +'<div>'+slot(145,'Season A')+'</div><div class="vsm">VS</div><div>'+slot(145,'Season B')+'</div></div></div>'
   +'<div class="ctaw"><button class="cta">Compare</button></div>';},
 emptySug:function(){return '<div class="top">Compare</div><div class="plinth"><div class="row3">'
   +'<div>'+slot(140,'Season A')+'</div><div class="vsm">VS</div><div>'+slot(140,'Season B')+'</div></div></div>'
   +'<div class="ctaw"><button class="cta">Compare</button></div>'
   +'<div class="sugh">Or start with one of these</div>'
   +sug(['Messi','11/12',97],['Ronaldo','13/14',96],'The argument that will not end')
   +sug(['Henry','03/04',93],['Haaland','22/23',90],'Two ways to lead a line')
   +sug(['Xavi','10/11',92],['Modric','17/18',91],'Control against tempo');}
};
if(D){ document.body.className='phone'+(T==='light'?' light':'');
  try{VVCore.useCardMarks(true);}catch(e){}
  document.body.innerHTML=(DIRS[D]||DIRS.emptyNow)(); }
else{ document.body.className='pv';
 var PAN=[['size145','Cards at 145px , as shipped','The sub-line renders at 7.25px, against A8 empirical floor of 11.5.'],
  ['size175','Cards at 175px , proposed','--cw 175 puts the sub-line at 8.75px. Still under the floor, and this is the point to read before building.'],
  ['emptyNow','Empty state , as shipped','337px blank below the CTA, 40% of the viewport.'],
  ['emptySug','Empty state , suggested matchups','Three tappable pairs fill the space and teach what compare is for.']];
 var h='<div class="wrap"><h1>Compare , card size and empty state</h1><p class="lede">Red line is the 844 fold. Each phone is its own document so body.light is real. '
  +'<b>Read the 175px panel carefully:</b> the sub-line scales with --cw, so 145 to 175 takes it from 7.25px to 8.75px , better, but still short of A8 11.5px floor. '
  +'Reaching 11.5px needs --cw 230, which does not fit two-up at 390.</p>';
 PAN.forEach(function(p){ h+='<div class="ttl">'+p[1]+'</div><p class="note">'+p[2]+'</p><div class="pair">';
  ['dark','light'].forEach(function(t){ h+='<div><div class="pw"><iframe class="ph" data-k="'+p[0]+'-'+t+'" src="?d='+p[0]+'&t='+t+'"></iframe><div class="fold"></div></div><p class="meas" data-m="'+p[0]+'-'+t+'"></p></div>';});
  h+='</div>';});
 document.body.innerHTML=h+'</div>';
 window.addEventListener('load',function(){setTimeout(meas,1400);});
}
function meas(){ document.querySelectorAll('iframe.ph').forEach(function(fr){
  var o=document.querySelector('[data-m="'+fr.dataset.k+'"]'); if(!o) return;
  var d; try{d=fr.contentDocument;}catch(e){return;} if(!d) return;
  var sub=d.querySelector('.vvcard .sub'), rows=[];
  if(sub){ var cs=fr.contentWindow.getComputedStyle(sub);
    rows.push('sub-line: '+parseFloat(cs.fontSize).toFixed(2)+'px (A8 floor 11.5)'); }
  var last=0; d.body.querySelectorAll('*').forEach(function(e){var b=e.getBoundingClientRect(); if(b.height&&b.bottom>last)last=b.bottom;});
  rows.push('content runs to '+Math.round(last)+'px'+(last>844?' (below fold)':' (fits)'));
  rows.push('blank below content: '+Math.max(0,Math.round(844-last))+'px');
  o.innerHTML=rows.join('<br>'); });}
</script></body></html>
