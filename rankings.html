<style>
  :root{--ink-soft:#a49d93;--cream:#F0EAD9;--cream-deep:#E2D8C4;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--pink-glow:#FF8FA3;--green:#2E8C5A;--gold:#E8B84B;--blue:#3B6FB0;--row-muted:rgba(243,237,224,0.6);--row-muted-2:rgba(243,237,224,0.55);--row-dim:rgba(243,237,224,0.52)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100vh}
  body{font-family:'Inter',sans-serif;color:var(--cream);
    background:radial-gradient(150% 540px at 50% -130px,rgba(255,244,224,.07),transparent 82%),radial-gradient(circle 22px at 12% -8px,rgba(255,255,255,.80),rgba(255,238,205,.18) 45%,transparent 72%),radial-gradient(circle 24px at 31% -8px,rgba(255,255,255,.88),rgba(255,238,205,.20) 45%,transparent 72%),radial-gradient(circle 26px at 50% -8px,rgba(255,255,255,.92),rgba(255,238,205,.22) 45%,transparent 72%),radial-gradient(circle 24px at 69% -8px,rgba(255,255,255,.88),rgba(255,238,205,.20) 45%,transparent 72%),radial-gradient(circle 22px at 88% -8px,rgba(255,255,255,.80),rgba(255,238,205,.18) 45%,transparent 72%),radial-gradient(6% 640px at 12% -60px,rgba(255,247,230,.16),transparent 84%),radial-gradient(6% 700px at 31% -60px,rgba(255,247,230,.18),transparent 84%),radial-gradient(7% 760px at 50% -60px,rgba(255,247,230,.20),transparent 84%),radial-gradient(6% 700px at 69% -60px,rgba(255,247,230,.18),transparent 84%),radial-gradient(6% 640px at 88% -60px,rgba(255,247,230,.16),transparent 84%),radial-gradient(900px 500px at 16% -80px, rgba(218,41,28,0.16), transparent 60%),linear-gradient(180deg,#1b1617 0%,#141011 50%,#0e0b0c 100%);
    -webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

  /* ===================== THE SPINE (sidebar) ===================== */
  .spine{width:84px;flex-shrink:0;background:rgba(255,255,255,0.02);border-right:1px solid rgba(255,255,255,0.06);
    display:flex;flex-direction:column;align-items:center;padding:26px 0;position:sticky;top:0;height:100vh;align-self:flex-start;gap:6px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .spine:hover{width:208px;align-items:flex-start;padding-left:18px}
  .coin{width:40px;height:40px;flex-shrink:0;margin-bottom:30px;margin-left:2px}
  .navitem{display:flex;align-items:center;gap:15px;width:calc(100% - 4px);padding:12px;border-radius:13px;cursor:pointer;color:rgba(243,237,224,0.58);transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-decoration:none}
  .navitem:hover{background:rgba(255,255,255,0.05);color:var(--cream)}
  .navitem.on{background:rgba(255,92,122,0.12);color:var(--pink-ink)}
  .navitem svg{width:22px;height:22px;flex-shrink:0}
  .navitem .lbl{font-family:'Archivo';font-weight:700;font-size:15.5px;opacity:0;transition:opacity .25s}
  .spine:hover .navitem .lbl{opacity:1}
  .navspacer{flex:1}

  /* ===================== CONTENT CANVAS ===================== */
  .canvas{flex:1;min-width:0;display:flex;flex-direction:column}
  .topline{display:flex;align-items:center;justify-content:space-between;padding:30px 48px 0}
  .crumb{font-family:'Archivo';font-weight:800;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(243,237,224,0.55)}
  .topactions{display:flex;align-items:center;gap:14px}
  .modetoggle{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--cream);border-radius:50%;cursor:pointer;flex:0 0 auto;box-sizing:border-box}
  .mt-wrap{position:relative;display:inline-flex}
  .mt-fixed{position:fixed;top:13px;right:13px;z-index:200}
  .modetoggle .mt-ic{width:18px;height:18px;transition:opacity .2s}
  .modetoggle:hover{border-color:rgba(255,255,255,.28)} body.light .modetoggle:hover{border-color:rgba(0,0,0,.22)}
  .modetoggle.spin .mt-ic{animation:mtspin .55s cubic-bezier(.4,0,.2,1)}@keyframes mtspin{to{transform:rotate(360deg)}}
  .mt-label{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;font-family:'Archivo';font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);background:rgba(20,16,17,.92);border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:999px;opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .28s ease,transform .28s ease;z-index:60;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
  body.light .mt-label{color:var(--charcoal);background:rgba(255,255,255,.96);border-color:rgba(0,0,0,.1)}
  .mt-label.show{opacity:1;transform:translateY(0)}
.searchbtn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--cream);border-radius:20px;padding:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.searchbtn svg{width:18px;height:18px}
.searchbtn:hover{border-color:var(--pink-ink);color:var(--pink-ink)}
  /* VV shield badge , THEME-AWARE. Dark ground needs a CREAM shield (a dark shield on
     Under-the-Lights was invisible); daylight keeps the black shield on cream. The inset
     border and the first V must flip WITH it, or they vanish into the shield. Presentation
     attributes (fill=/stroke=) lose to CSS, so the inline values stay as a fallback.
     Do NOT touch the scale(0.84) inset transform , stroking the outer edge is invisible in light mode. */
  .avatar .vvsh-b{fill:var(--cream)}
  .avatar .vvsh-e{stroke:#1C1B1A}
  .avatar .vvsh-v{fill:#1C1B1A}
  body.light .avatar .vvsh-b{fill:#1C1B1A}
  body.light .avatar .vvsh-e{stroke:var(--cream)}
  body.light .avatar .vvsh-v{fill:var(--cream)}
  .soontag{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7e5a10;margin-left:7px}

  .avatar{height:42px;width:auto;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border-radius:0;padding:0;-webkit-tap-highlight-color:transparent}
  .avatar svg{height:42px;width:auto;display:block}
  .avatar:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:4px}

  /* hero , editorial, lots of air */
  .hero{padding:30px 48px 6px;max-width:1680px}
  .hero h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-0.02em}
  .hero h1 .b{color:var(--pink-ink)}
  .hero .lede{font-family:'Bricolage Grotesque';font-weight:600;font-size:22px;line-height:1.2;color:rgba(243,237,224,0.9);max-width:620px;margin-top:2px;letter-spacing:-0.01em}
  .hero .lede .b{color:var(--pink-ink)}

  /* the rankings grid , generous, never crammed (premium = space) */
  .gridwrap{padding:30px 48px 60px;max-width:1680px}
  .ranksearch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 14px;margin-bottom:14px}
  .ranksearch svg{width:17px;height:17px;color:rgba(243,237,224,0.58);flex-shrink:0}
  .ranksearch input{flex:1;background:none;border:0;outline:none;color:var(--cream);font-family:'Inter';font-size:16px}
  .ranksearch input::placeholder{color:rgba(243,237,224,0.58)}
  .rs-clear{display:none;background:none;border:0;color:rgba(243,237,224,0.58);font-size:21px;line-height:1;cursor:pointer;padding:0 2px}
  .vvload{grid-column:1/-1;padding:52px 12px}
  .rankempty{grid-column:1/-1;text-align:center;padding:46px 12px;font-family:'Inter';font-size:15px;color:rgba(243,237,224,0.58)}
  body.light .ranksearch{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1)}
  body.light .ranksearch svg,body.light .ranksearch input::placeholder,body.light .rs-clear{color:var(--ink-soft)}
  body.light .ranksearch input{color:var(--charcoal)}
  body.light .rankempty{color:var(--ink-soft)}
  /* ===== Unified rank row (.urow) , shared by List (pillmode) + Compact (compactmode).
     ONE fixed-column grid in both modes -> every column aligns row-to-row (no max-content).
     Only padding / font-size / column-gap differ (Compact = denser). Score = .rmini VV badge. ===== */

  /* RESTORED 2026-08-23. 0260a90 deleted this @media OPENER along with the row rules
     inside it and left its closing brace behind, so CSS depth went negative here and
     the parser DISCARDED the next rule , the .cardgrid display:grid, which is why the
     card grid rendered as one column. The opener is restored rather than the stray
     brace deleted: these rules are mobile-only, and dropping the brace instead would
     promote them to every viewport. */
  @media (max-width:720px),(max-height:600px){
    .compacthead{display:none}
    .gridwrap.compactmode .compacthead{display:grid;grid-template-columns:22px minmax(0,1fr) 34px 30px 30px 40px;column-gap:9px;padding:6px 12px 7px;margin:0 0 2px;font-size:11px;letter-spacing:.03em;color:var(--ink-soft);align-items:center}
    .gridwrap.compactmode .compacthead span:nth-child(1){grid-column:2}
    .gridwrap.compactmode .compacthead span:nth-child(2),.gridwrap.compactmode .compacthead span:nth-child(3),.gridwrap.compactmode .compacthead span:nth-child(4),.gridwrap.compactmode .compacthead span:nth-child(5){text-align:center}
  }
  .cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  @media (min-width:1560px){.cardgrid{grid-template-columns:repeat(4,1fr)}}
  #cardgrid{max-height:calc(100vh - 270px);overflow-y:auto;overflow-x:hidden;padding-right:8px;padding-bottom:42px;scrollbar-width:thin;scrollbar-color:rgba(255,92,122,0.3) transparent;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 36px),transparent 100%)}
  #cardgrid::-webkit-scrollbar{width:6px}
  #cardgrid::-webkit-scrollbar-track{background:rgba(255,255,255,0.04);border-radius:8px}
  #cardgrid::-webkit-scrollbar-thumb{background:rgba(255,92,122,0.3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  #cardgrid::-webkit-scrollbar-thumb:hover{background:rgba(255,92,122,0.8)}
  body.light #cardgrid::-webkit-scrollbar-track{background:rgba(0,0,0,0.04)}
  @media (max-width:560px){#cardgrid{max-height:calc(100dvh - 340px)}}
  .cardgrid:not(.pillmode):not(.compactmode) > div{display:flex;justify-content:center;transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .cardgrid:not(.pillmode):not(.compactmode) > div:hover{transform:translateY(-8px)}
  .cardgrid .vvcard{cursor:pointer}

  /* wide breakpoints , cap and re-column so it never sprawls or crams */
  @media (max-width:1400px){.cardgrid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:1040px){.cardgrid{grid-template-columns:repeat(2,1fr);gap:22px}.hero{padding:28px 32px 6px}.gridwrap{padding:24px 32px 50px}.topline{padding:24px 32px 0}}
  @media (max-width:720px),(max-height:600px){.spine{display:none}.cardgrid{grid-template-columns:repeat(2,1fr);gap:16px}.hero h1{font-size:28px}.hero .lede{font-size:19px}.hero{padding:14px 18px 2px}.gridwrap{padding:18px 18px 40px}.topline{padding:18px 18px 0}}
  @media (max-width:720px),(max-height:600px){#cardgrid:not(.pillmode):not(.compactmode) .vvcard{--cw:165px;max-width:100%}}
  @media (orientation:landscape) and (max-height:600px){
    .hero{display:none}
    .ranksearch{padding:7px 12px;margin-bottom:8px}
    .gridwrap{padding:8px 16px 24px}
    .topline{padding:8px 16px 0}
    .rankfbar{margin-bottom:10px}
    .ranklayout,.ranklayout.filters-open{grid-template-columns:1fr;gap:16px}
    #cardgrid{max-height:none;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-bottom:8px}
    .filterrail{position:static;max-height:none;width:auto;min-width:0}
    .cardgrid:not(.pillmode):not(.compactmode){grid-template-columns:repeat(3,1fr);gap:12px}
    #cardgrid:not(.pillmode):not(.compactmode) .vvcard{--cw:190px;max-width:100%}
  }

  /* ============================================================
     ★ THE BEDROCK CARD , canonical, reusable everywhere ★
     Scale a whole card by changing --cw (card width).
     Everything inside scales proportionally off --cw.
     ============================================================ */
  .filterrail{position:sticky;top:30px;align-self:start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:22px 20px;max-height:calc(100vh - 60px);overflow-y:auto}
  body.light .filterrail{background:rgba(255,255,255,0.55);border-color:rgba(0,0,0,0.06)}
  .fr-title{font-family:'Archivo';font-weight:800;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(243,237,224,0.58);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
  body.light .fr-title{color:var(--ink-soft)}
  /* Clear all is a PILL now, and the treatment lives in vv-core (.vvf-clear) so
     rankings, card and compare cannot drift apart again. .fr-clear survives as the
     JS hook only , it carries no appearance. */
  .fr-clear{margin-left:auto}
  .fr-count{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.03em;color:rgba(243,237,224,0.58);margin-bottom:10px;min-height:13px}
  body.light .fr-count{color:var(--ink-soft)}
  .rankmore-wrap{display:none;justify-content:center;padding:18px 0 4px;grid-column:1/-1;width:100%}
  .rankmore-wrap.show{display:flex}
  .rankmore{font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.04em;color:rgba(243,237,224,0.7);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:10px 22px;cursor:pointer;transition:all .15s}
  .rankmore:hover{color:#fff;border-color:var(--pink-ink);background:rgba(255,92,122,0.12)}
  body.light .rankmore{color:#6a6256;background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1)}
  body.light .rankmore:hover{color:#111;border-color:var(--pink-ink)}
  /* ★ VV Score range filter (ported from mobile VV Rankings) */
  body.light .scorevals .sv{color:var(--charcoal)}
  body.light .scorevals .svdash{color:var(--ink-soft)}

  /* Rankings filter layout (same filter as Search) */
  .ranklayout{display:grid;grid-template-columns:1fr;gap:38px;align-items:start;}
  .ranklayout.filters-open{grid-template-columns:262px 1fr}
  /* ONE child for the results column , see the note on #rankActive in the body.
     Without this the active-chips bar consumes a grid cell and displaces the grid. */
  .rankresults{display:flex;flex-direction:column;gap:12px;min-width:0}
  .ranklayout .filterrail{display:none}
  .ranklayout.filters-open .filterrail{display:block}
  .rankfbar{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .viewseg{display:inline-flex;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:3px;gap:2px;flex-shrink:0}
  body.light .viewseg{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1)}
  /*  44x44 IS THE TOUCH-TARGET FLOOR. These were 36x30 and sit at y=220 on a 390x844
    screen , the stretch zone , so they were both small and awkward to reach. The ICON
    inside is unchanged; only the hit area grows. */
  .vseg{width:44px;height:44px;border:none;background:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(243,237,224,0.58);transition:background .15s,color .15s}
  .vseg.on{background:var(--pink);color:#fff}
  body.light .vseg{color:var(--ink-soft)}
  body.light .vseg.on{color:#fff}
  .rankfbtn{font-family:'Archivo';font-weight:800;font-size:13px;color:var(--ink);background:var(--pillbg);border:1px solid var(--pill-b);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .rankfbtn.on{background:var(--pink);color:#fff;border-color:transparent}
  .rankfbtn .chev{transition:transform .2s}
  .rankfbtn.on .chev{transform:rotate(180deg)}
  @media (max-width:1100px){.ranklayout{grid-template-columns:1fr;gap:22px}.filterrail{position:static;max-height:none}}

  .vvcard{--cw:300px;position:relative;width:var(--cw);max-width:92%;height:calc(var(--cw)*1.397);box-sizing:border-box;display:flex;flex-direction:column;border-radius:calc(var(--cw)*0.073);
    background:radial-gradient(130% 60% at 50% 0%, #F7F2E6 0%, var(--cream) 48%, var(--cream-deep) 100%) !important;
    box-shadow:0 26px 50px -22px rgba(0,0,0,0.6), inset 0 0 0 calc(var(--cw)*0.02) var(--cream), inset 0 0 0 calc(var(--cw)*0.025) rgba(28,27,26,0.55) !important;
    padding:calc(var(--cw)*0.055) calc(var(--cw)*0.07);color:#1C1B1A !important;font-family:'Barlow Condensed',sans-serif}
  .vvcard .chtagcell-cross{background:linear-gradient(90deg,#5A5856,#46443F) !important}
  /* HONOURS ARE GOLD. This is a design rule, not a surface preference , the base
     .chtagcell carries the attacking red, so without this override an honour pill reads
     as an ability tag. card.html and compare.html both had it; rankings did not, so
     Ballon d'Or rendered red here and gold on the other two. The mark inherits the ink
     through currentColor, which is why it needs no rule of its own. */
  .vvcard .chtagcell.gold{background:linear-gradient(90deg,#F0D27A,#E0A93A) !important;color:#5a4410}
  

  /* ===== Prestige whole-card treatment (SUB-STEP A: rankings only) ===== */
  /* GENERATIONAL , deep BLACK card, gold ring + gold accents */

<script>
  /* Opening a card RECORDS THE LIST IT CAME FROM, so the card page can walk it.
     The query is stored, never the ids , see the VVSeq note in vv-core. idx is the
     row's position in CARDS, which is the sequence the visitor is actually looking at
     (server order, with the client tag predicate already applied).
     idx == null means we cannot say where this card sits, so the context is CLEARED
     rather than left stale: a wrong sequence is worse than none. */
  function goCard(id, idx){
    if(window.VVSeq){
      if(id!=null && idx!=null){
        var st=fState();
        VVSeq.save({ q:(document.getElementById('rankSearch')||{value:''}).value.trim(),
                     st:st, index:idx, id:id,
                     total: clientActive(st) ? null : rankTotal,   // server count is a different question once tags are on
                     clientActive: clientActive(st) });
      } else { VVSeq.clear(); }
    }
    location.href = id!=null ? "card.html?id="+encodeURIComponent(id) : "card.html";
  }
  let CARDS = [];
  /* RANK_STATE , "no results" and "not loaded yet" are DIFFERENT STATES and the page could
     not tell them apart. setRankView() runs at boot and calls renderRank() while CARDS is
     still [], so for the whole first round-trip the grid said "No seasons match your
     search." , an empty-state verdict delivered before the query it describes had returned.
     Measured in flight: it showed for ~1s on a local server, and longer on anything real.
     Same family as the §C rule that a UI must not report success before its request
     resolves; this is the same lie with the sign flipped. */
  var RANK_STATE = 'idle';        // idle -> loading -> ready | error

  const g=document.getElementById('cardgrid');
  // ── setViewClass , toggle the view mode on BOTH #cardgrid (row styling) and its
  //    .gridwrap (so List/Compact widen to 2200; Cards stays at the default 1680). ──
  function setViewClass(mode){
    var g=document.getElementById('cardgrid'), gw=g&&g.closest('.gridwrap');
    ['pillmode','compactmode'].forEach(function(c){ if(g)g.classList.remove(c); if(gw)gw.classList.remove(c); });
    if(mode){ if(g)g.classList.add(mode); if(gw)gw.classList.add(mode); }
  }
  function renderRankCompact(list){
    const g=document.getElementById('cardgrid');
    setViewClass('compactmode');
    if(!list.length){ g.innerHTML=rankEmptyHTML(); return; }
    g.innerHTML=list.map(function(d,i){ return rankRowHTML(d,i,{cap:2, onClick:seqClick}); }).join('');   // #20: compact caps at 2 tags
  }
  // ── rankRowHTML , the ONE shared row builder for List (pillmode) + Compact
  //    (compactmode). 9 fixed-grid columns; density differs only via container class.
  //    Tags: prestige pill leads + profile tags, total capped at 3, overflow clipped.
  //    Score: List's card-style VV badge (.rmini) , gen=black box, elite/Iconic=gold box. ──
  // Small colour-matched jersey shield for List/Compact rows , mirrors buildCard's
  // .cbadge (same pentagon path, club-split fill, inkFor contrast). Scaled via CSS.
  // No number yet (d.number null) -> render nothing (cleaner than an empty jersey).
  // rowShieldHTML + rankRowHTML now live in vv-core.js (shared with the card /
  // Compare season pickers). rankings calls them as globals; the (d,i,2)/(d,i,3)
  // call sites still pass a bare number = cap (back-compat preserved).
  function cwNow(){
    var w=window.innerWidth;
    if(w>560) return 260;
    var g=document.getElementById('cardgrid');
    if(!g||!g.clientWidth) return Math.round((((w-36-8))-14)/2*0.92);
    var cs=getComputedStyle(g);
    var padL=parseFloat(cs.paddingLeft)||0, padR=parseFloat(cs.paddingRight)||0;
    var gap=parseFloat(cs.columnGap||cs.gap)||14;
    var usable=g.clientWidth-padL-padR;
    var col=(usable-gap)/2;
    return Math.round(Math.min(260,col*0.92));
  }
  // CARD-FACE MARKS , this page. compare.html still does not opt in, so its cards are
  // unchanged. Fail-soft: if vv-marks.js is missing or stale the pills render as before,
  // minus the icon. Runs once at parse time, after vv-core.js has loaded.
  try { VVCore.useCardMarks(true); } catch(e){}

  function renderRankCards(list){
    const g=document.getElementById('cardgrid');
    setViewClass(null);
    if(!list.length){ g.innerHTML=rankEmptyHTML(); return; }
    g.innerHTML = list.map((d,i)=>`<div onclick="goCard(${d.card_id==null?'':d.card_id},${i})" style="cursor:pointer">${buildCard(d,cwNow())}</div>`).join('');
  }
  // vvNorm / tokenAndFilter / vvParseSearch / vvSeasonLabel now live in vv-core.js (shared with the
  // Compare picker , the two were byte-identical copies). They arrive as globals via VVCore.
  function rankTagColor(label){var T={Iconic:'pink',Talisman:'pink',Generational:'gen','Golden Boot':'gold',Prestige:'gold',Maestro:'blue',Clinical:'green',Poacher:'green',Pace:'coral',Wonderkid:'purple',Rock:'slate',Engine:'slate','Target Man':'slate','Top Assist':'blue'};for(var k in T){if(label.indexOf(k)>=0)return T[k];}return 'slate';}
  function renderRankPills(list){
    const g=document.getElementById('cardgrid');
    setViewClass('pillmode');
    if(!list.length){ g.innerHTML=rankEmptyHTML(); return; }
    g.innerHTML=list.map(function(d,i){ return rankRowHTML(d,i,{cap:3, onClick:seqClick}); }).join('');   // #20: list caps at 3 tags
  }
  var rankView='cards';
  try{var _rv=localStorage.getItem('vvRankView');if(_rv==='pills'||_rv==='cards'||_rv==='compact')rankView=_rv;}catch(e){}
  /* Every row carries its INDEX into the click, so the card page inherits the position
     as well as the query. i is the index within CARDS, which is what renderRank maps. */
  function seqClick(d,i){ return 'goCard('+(d.card_id==null?'':d.card_id)+','+i+')'; }
  function currentRankList(){ return CARDS; }   // server already filtered + sorted
  /* The ONLY place the empty grid speaks. Before the first query resolves it must say
     nothing about results, because it does not know anything about results yet. */
  function rankEmptyHTML(){
    if(RANK_STATE==='error') return '<div class="rankempty">Those rankings could not be loaded. Check your connection and try again.</div>';
    if(RANK_STATE!=='ready')  return (window.VVCore && VVCore.vvLoader) ? VVCore.vvLoader({size:44, label:'Loading rankings'}) : '';
    return '<div class="rankempty">No seasons match your search.</div>';
  }
  /* Show more is gone , infinite scroll replaces the 300 cap (see loadRankings). */
  function renderRank(){ var list=currentRankList(); if(rankView==='pills') renderRankPills(list); else if(rankView==='compact') renderRankCompact(list); else renderRankCards(list); }
  var vvRankRZ;
  window.addEventListener('resize',function(){ clearTimeout(vvRankRZ); vvRankRZ=setTimeout(function(){ if(rankView==='cards' && typeof CARDS!=='undefined' && CARDS && CARDS.length) renderRank(); },150); });
  function setRankView(v){
    rankView=v;
    try{localStorage.setItem('vvRankView',v);}catch(e){}
    var c=document.getElementById('vsCards'),p=document.getElementById('vsPills'),k=document.getElementById('vsCompact');
    if(c)c.classList.toggle('on',v==='cards'); if(p)p.classList.toggle('on',v==='pills'); if(k)k.classList.toggle('on',v==='compact');
    renderRank();
  }
  function applyRankSearch(){
    const q=document.getElementById('rankSearch').value.trim();
    document.getElementById('rsClear').style.display=q?'block':'none';
    clearTimeout(window._rankT); window._rankT=setTimeout(loadRankings,250);
  }
  function clearRankSearch(){document.getElementById('rankSearch').value='';applyRankSearch();document.getElementById('rankSearch').focus();}
  setRankView(rankView);

  // read active chips + score range + sort into canonical query values (verified column values)
  /* ===================== FILTERS , VVFilters (vv-core) =====================
     The inline filter UI, readFilters() and ALL label-text parsing are gone.
     State now comes from data-vvf-value only, so a label edit, an added emoji or
     the EN/NL/FR toggle can no longer change the query.

     Removed with adoption: Era, "Exactly 85", every hardcoded threshold (band
     edges and prestige floors are derived from bandFor/prestigeFor inside the
     component), and the slider's floor of 15 , the ends now mean NO bound, so
     the 1,030 cards below rt 15 are reachable.

     DELIBERATE BEHAVIOUR CHANGE, confirmed: profile tags now OR within the group
     instead of AND. Selecting Goal Machine + Playmaker returns either, not both.

     THE SERVER/CLIENT SPLIT IS THE THING TO REMEMBER HERE. applyServer() handles
     league/position/prestige/score/sort; profile, Career-Stage and Trajectory are
     getVVTags output with no column to filter on, so they run as a predicate
     AFTER the fetch. That is also why the total count goes soft when they are
     active , see rankCountText(). */
  var RANK_PAGE = 100;                 // infinite-scroll page (replaces the 300 cap)
  var FHOST=null, FINST=null;
  var rankOffset=0, rankTotal=null, rankDone=false, rankBusy=false, rankSeq=0;

  function fState(){
    return (FHOST && window.VVFilters) ? VVFilters.readState(FHOST)
         : (window.VVFilters ? VVFilters.emptyState() : null);
  }
  function clientActive(st){ return !!(st && (st.profile.length || st.stage.length || st.trajectory.length)); }

  /* One builder for the rows, the head-count and every facet probe , and now also for
     the card page's prev/next sequence, which is why the body moved into vv-core as
     VVSeq.query. Two copies would drift, and the sequence would then walk a different
     list from the one the visitor is looking at. */
  function rankQuery(sb, st, o){
    o=o||{};
    return VVSeq.query(sb, { st:st, nameQ:o.nameQ, seasonYear:o.seasonYear, head:o.head,
                             from: o.head ? null : (o.from||0),
                             to:   o.head ? null : ((o.from||0)+RANK_PAGE-1) });
  }

  /* THE COUNT IS HONEST OR IT IS ABSENT. The server cannot see client-side tag
     filtering, so with tags active "of N" would be a number for a different
     question. We say what the N actually counts instead of quietly printing it. */
  function rankCountText(shown, total, st, hint){
    var h=hint||'';
    if(total==null) return h+'Showing '+shown.toLocaleString();
    if(clientActive(st)) return h+'Showing '+shown.toLocaleString()+' of '+total.toLocaleString()+' before tag filters';
    return h+'Showing '+shown.toLocaleString()+' of '+total.toLocaleString();
  }

  async function loadRankings(o){
    o=o||{};
    var sb=vvClient(); if(!sb || !window.VVFilters) return;
    if(o.append && (rankBusy || rankDone)) return;   // appends queue; fresh loads SUPERSEDE
    if(!o.append){ rankOffset=0; rankDone=false; rankTotal=null; CARDS=[]; RANK_STATE='loading'; }
    rankBusy=true;
    var seq=++rankSeq;
    var done=function(){ if(seq===rankSeq) rankBusy=false; };   // only the winner clears the flag
    var st=fState();
    var tq=(document.getElementById('rankSearch')||{value:''}).value.trim();
    var ps=vvParseSearch(tq), nameQ=ps.nameQ, seasonYear=ps.seasonYear;
    var qo={nameQ:nameQ, seasonYear:seasonYear, from:rankOffset};

    var rcEl=document.getElementById('rankCount');
    if(rcEl && !o.append) rcEl.textContent='Counting…';

    var need=[ rankQuery(sb,st,qo) ];
    if(rankTotal==null) need.push(rankQuery(sb,st,{nameQ:nameQ,seasonYear:seasonYear,head:true}));
    var res=await Promise.all(need);
    if(seq!==rankSeq){ done(); return; }        // a newer request already won
    var qRes=res[0], cRes=res[1];

    // graceful degrade , an in-range season with no row for this name: drop the season
    var degraded=false;
    if(seasonYear!=null && nameQ && !qRes.error && (qRes.data||[]).length===0 && rankOffset===0){
      qo.seasonYear=null;
      var r2=await Promise.all([ rankQuery(sb,st,qo), rankQuery(sb,st,{nameQ:nameQ,head:true}) ]);
      if(seq!==rankSeq){ done(); return; }
      qRes=r2[0]; cRes=r2[1]; degraded=true;
    }
    if(qRes.error){ console.error('rankings load failed:', qRes.error.message); RANK_STATE='error'; renderRank(); done(); return; }
    if(cRes && !cRes.error && cRes.count!=null) rankTotal=cRes.count;

    var raw=qRes.data||[];
    if(raw.length<RANK_PAGE) rankDone=true;
    rankOffset+=raw.length;

    var sorted=(nameQ && Array.isArray(raw))
      ? VVCore.rankBySearch(raw, nameQ, function(r){ return (r.player_name||'')+' '+(r.player_name_norm||''); })
      : raw;
    var page=sorted.map(rowToCard).filter(Boolean).filter(VVFilters.clientPredicate(st));
    CARDS = o.append ? CARDS.concat(page) : page;
    RANK_STATE='ready';        // only now does the page know anything about results

    await attachHonoursBatch(page);
    if(seq!==rankSeq){ done(); return; }
    renderRank();
    scrollSentinel();                 // renderRank rewrote innerHTML
    if(rcEl){
      var hint=degraded ? ('No '+vvSeasonLabel(seasonYear)+' season for that name , showing all. ') : '';
      rcEl.textContent=rankCountText(CARDS.length, rankTotal, st, hint);
    }
    renderActiveChips(st);
    done();
    // a page that filtered down to nothing client-side should keep pulling
    if(o.append && page.length===0 && !rankDone) loadRankings({append:true});
    else scrollSentinelCheck();
  }

  /* ---- infinite scroll (replaces the 300 cap + Show more) ---- */
  /* THE SENTINEL MUST LIVE INSIDE #cardgrid AND THE OBSERVER MUST BE ROOTED THERE.
     #cardgrid is itself a scroll container (max-height + overflow-y:auto), so a
     sentinel placed after it is permanently in the viewport and every page fires
     immediately , the first load pulled 1,900 rows in one go. Rooted to the
     scroller it only trips when the user actually reaches the end.
     renderRank() rewrites innerHTML, so it is re-appended after every render. */
  function scrollSentinel(){
    var gw=document.getElementById('cardgrid'); if(!gw) return null;
    var s=document.getElementById('rankSentinel');
    if(!s){ s=document.createElement('div'); s.id='rankSentinel'; s.style.cssText='height:1px;grid-column:1/-1'; }
    if(s.parentNode!==gw) gw.appendChild(s);
    else if(gw.lastElementChild!==s) gw.appendChild(s);   // keep it last after a re-render
    return s;
  }
  function gridIsScroller(){
    var gw=document.getElementById('cardgrid'); if(!gw) return false;
    var cs=getComputedStyle(gw);
    return /(auto|scroll)/.test(cs.overflowY) && gw.scrollHeight > gw.clientHeight + 1;
  }
  function scrollSentinelCheck(){
    var s=scrollSentinel(), gw=document.getElementById('cardgrid');
    if(!s||!gw||rankDone||rankBusy) return;
    var r=s.getBoundingClientRect();
    // reference frame: the grid when it scrolls itself, otherwise the viewport
    var bottom = gridIsScroller() ? gw.getBoundingClientRect().bottom : (window.innerHeight||0);
    if(r.top < bottom+600) loadRankings({append:true});
  }
  (function initInfiniteScroll(){
    var s=scrollSentinel(), gw=document.getElementById('cardgrid');
    if(!s||!gw) return;
    if(window.IntersectionObserver){
      // root:null , the observer only NUDGES; scrollSentinelCheck decides, and it
      // knows which frame applies at the current breakpoint.
      new IntersectionObserver(function(es){
        if(es.some(function(e){ return e.isIntersecting; })) scrollSentinelCheck();
      },{rootMargin:'600px 0px'}).observe(s);
    }
    gw.addEventListener('scroll', function(){ scrollSentinelCheck(); }, {passive:true});
    window.addEventListener('scroll', function(){ scrollSentinelCheck(); }, {passive:true});
  })();

  /* ---- active filter chips , one per selection, each removable ---- */
  function renderActiveChips(st){
    var bar=document.getElementById('rankActive'); if(!bar||!window.VVFilters) return;
    st=st||fState();
    bar.innerHTML=VVFilters.renderActive(st);
    /* Clear all is ALWAYS visible now, matching card.html and compare.html. It
       used to hide until a filter was active, which made rankings the odd one out
       of the three surfaces. */
  }
  (function wireActiveChips(){
    var bar=document.getElementById('rankActive'); if(!bar) return;
    bar.addEventListener('click', function(e){
      var b=e.target.closest ? e.target.closest('[data-vvf-remove]') : null;
      if(!b) return;
      VVFilters.removeFrom(FHOST, b.getAttribute('data-vvf-remove'), b.getAttribute('data-vvf-value'));
      onFiltersChanged();
    });
  })();

  /* ---- facets , grey out any option that would return zero -----------------
     Server-side groups only. Client-side tag groups are left alone on purpose:
     their values are computed by getVVTags, so counting them would mean pulling
     every matching row, and a guess shown as a fact is worse than no hint.
     Only runs while the rail is open, and only after the query settles. */
  var _facetT=null;
  function refreshFacets(){
    clearTimeout(_facetT);
    _facetT=setTimeout(async function(){
      if(!window.VVFilters) return;
      var rail=document.querySelector('.filterrail');
      if(rail && rail.offsetParent===null) return;         // rail not visible , skip the work
      var sb=vvClient(); if(!sb) return;
      var st=fState();
      var tq=(document.getElementById('rankSearch')||{value:''}).value.trim();
      var ps=vvParseSearch(tq);
      var plan=VVFilters.facetPlan(st);
      var seq=rankSeq;
      var counts=await Promise.all(plan.map(function(p){
        return rankQuery(sb,p.state,{nameQ:ps.nameQ,seasonYear:ps.seasonYear,head:true})
          .then(function(r){ return r.error?null:r.count; }).catch(function(){ return null; });
      }));
      if(seq!==rankSeq) return;
      var avail={};
      plan.forEach(function(p,i){ if(counts[i]!=null) avail[p.group+'||'+p.value]=counts[i]; });
      VVFilters.setAvailability(FHOST, avail);
    }, 350);
  }

  function onFiltersChanged(){ loadRankings(); refreshFacets(); }
  function clearAllFilters(){ if(FINST) FINST.clear(); onFiltersChanged(); }
  function rankRangeChanged(){ onFiltersChanged(); }

  /* ---- mount ---- */
  (function mountFilters(){
    FHOST=document.getElementById('rkFilters');
    if(!FHOST || !window.VVFilters){
      console.error('vv-core VVFilters missing , filter rail not mounted. Check the ?v= cache token on the vv-core script tag.');
      return;
    }
    FINST=VVFilters.mount(FHOST,{ onChange:function(){ onFiltersChanged(); } });
    renderActiveChips();
    refreshFacets();
  })();

  (function(){
    try{
      var _qp=new URLSearchParams(window.location.search).get('q');
      if(_qp){ var _sb=document.getElementById('rankSearch'); if(_sb){ _sb.value=_qp; var _rc=document.getElementById('rs-clear'); if(_rc)_rc.style.display='block'; } }
    }catch(e){}
  })();
  loadRankings();
  /* The legacy .fopt click handler and the Honours-disable pass are GONE. Both
     identified the group by reading .gl textContent, which is the exact pattern
     this adoption exists to remove. VVFilters selects by data-vvf-group and
     declares Honours inert in its own group definition. */
</script>
