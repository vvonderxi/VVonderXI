- name: Run import
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          async function run() {
            const r = await fetch('https://sports.bzzoiro.com/api/v2/leagues/?limit=100', {
              headers: { 'Authorization': 'Token ' + process.env.BSD_API_KEY }
            });
            const d = await r.json();
            const results = d.results || d;
            results.forEach(l => console.log(l.id, l.name, l.country));
          }
          run().catch(console.error);
          "
