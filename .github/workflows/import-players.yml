name: VVonderXI — Bulk Player Import

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League code (PL, LL, SA, BL, L1, PRT, ERE, BPL)'
        required: false
        default: 'PL'
      dry_run:
        description: 'Dry run?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  import:
    name: Import Players to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install dotenv @supabase/supabase-js ws

      - name: Run import
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          CMD="node scripts/import/import-players.js --league ${{ github.event.inputs.league }}"
          CMD="node scripts/import/import-positions-v2.js"
          echo "Running: $CMD"
          $CMD
