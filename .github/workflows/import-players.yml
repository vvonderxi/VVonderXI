name: VVonderXI — Bulk Player Import

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League to import (PL, LL, BL, SA, L1, PRT, ERE, BPL) — leave blank for ALL'
        required: false
        default: ''
      season:
        description: 'Season to import (2425, 2324, 2223, 2122, 2021, 1920) — leave blank for ALL'
        required: false
        default: ''
      dry_run:
        description: 'Dry run only — no writes to database'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  import:
    name: Import Players to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour max — import is resumable if it stops

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run import — dry run check
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🔍 DRY RUN MODE — no data will be written"
          ARGS="--dry-run"
          if [ -n "${{ github.event.inputs.league }}" ]; then
            ARGS="$ARGS --league ${{ github.event.inputs.league }}"
          fi
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          echo "Running: node api/import-players.js $ARGS"
          node api/import-players.js $ARGS

      - name: Run import — live
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🚀 LIVE IMPORT — writing to Supabase"
          ARGS=""
          if [ -n "${{ github.event.inputs.league }}" ]; then
            ARGS="$ARGS --league ${{ github.event.inputs.league }}"
          fi
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          echo "Running: node api/import-players.js $ARGS"
          node api/import-players.js $ARGS
