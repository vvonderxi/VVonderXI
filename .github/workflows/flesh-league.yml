name: VVonderXI — League Flesh-Out

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League: PL, LL, BL, SA, L1, PRT, ERE, BPL'
        required: false
        default: 'PL'
      dry_run:
        description: 'Dry run? (true = counts only, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  flesh:
    name: Flesh out league
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install @supabase/supabase-js
      - name: Run flesh-out
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          LEAGUE="${{ github.event.inputs.league }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/flesh-league.js --league "$LEAGUE" --dry-run
          else
            node scripts/flesh-league.js --league "$LEAGUE" --league "$LEAGUE"
          fi
