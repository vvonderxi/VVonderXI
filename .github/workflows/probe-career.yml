name: VVonderXI — Career Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose careers
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: node api/probe-career.js
