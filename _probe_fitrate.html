(async()=>{
 await document.fonts.load('700 8.5px Archivo'); await document.fonts.ready;
 const s=document.getElementById('s'), W={};
 POP.names.forEach(function(n,i){ const t=document.createElementNS('http://www.w3.org/2000/svg','text');
   t.setAttribute('class','tjclub'); t.setAttribute('x','10'); t.setAttribute('y', 12+i*12);
   t.textContent=n; s.appendChild(t); });
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 [...s.querySelectorAll('text')].forEach(function(t){ W[t.textContent]=t.getBBox().width; });
 /*  THE GEOMETRY IS renderTrajectory's OWN: W=360, ml=32, mr=38 so pw=290,
     slot = min(pw/n, 72). A label needs slot minus a 4px gutter.  */
 function slotFor(n){ return Math.min(290/n, 72); }
 let fitAll=0, fitNone=0, fitSome=0; const byBand={};
 POP.players.forEach(function(p){
   const avail=slotFor(p.n)-4;
   let tot=0, ok=0;
   p.dups.forEach(function(dd){ dd.clubs.forEach(function(c){ tot++; if((W[c]||999)<=avail) ok++; }); });
   if(ok===tot) fitAll++; else if(ok===0) fitNone++; else fitSome++;
   const b = p.n<=4?'<=4':p.n<=6?'5-6':p.n<=8?'7-8':p.n<=12?'9-12':'13+';
   byBand[b]=byBand[b]||{tot:0,all:0}; byBand[b].tot++; if(ok===tot) byBand[b].all++;
 });
 document.getElementById('out').textContent =
  'players with a repeated year: '+POP.players.length+'\n'
  +'ALL labels fit: '+fitAll+'   SOME fit: '+fitSome+'   NONE fit: '+fitNone+'\n'
  +'by career length (all-fit / total): '+Object.entries(byBand).map(function(e){return e[0]+' '+e[1].all+'/'+e[1].tot;}).join('   ')+'\n'
  +'slot at n=4/6/8/10/13/18: '+[4,6,8,10,13,18].map(function(n){return n+':'+slotFor(n).toFixed(1);}).join(' ')+'\n'
  +'widest name: Borussia Monchengladbach '+(W['Borussia Mönchengladbach']||0).toFixed(1)+'px';
