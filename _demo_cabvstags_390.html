<title>Cabinet vs Wonder Tags , 390</title>
<style>
 body{margin:0;padding:14px;background:#17161a;color:#F0EAD9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
 h1{font-size:15px;margin:0 0 10px}
 .rail{display:flex;gap:16px;align-items:flex-start}
 .cell{width:390px;flex:0 0 390px}
 .oh{font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:#E0A93A;margin:0 0 6px}
 iframe{width:390px;border:1px solid #33302c;border-radius:8px;background:#F0EAD9;display:block}
</style>
<h1>Same three options, rendered at 390px , real iframes, not a scaled desktop</h1>
<div class="rail" id="rail"></div>
<script>
var L=['1 , current build (gold both)','2 , cabinet neutral','3 , no honour pills in Wonder Tags'];
var rail=document.getElementById('rail');
L.forEach(function(t,i){
  var c=document.createElement('div'); c.className='cell';
  c.innerHTML='<div class="oh">'+t+'</div><iframe id="f'+i+'" src="/_demo_cabvstags.html?only='+(i+1)+'" height="1200"></iframe>';
  rail.appendChild(c);
});
</script>
