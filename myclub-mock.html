<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Club , coming-soon overlay MOCK</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
 :root{--cream:#F0EAD9;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--gold:#E8B84B;--ink-soft:#8a8276;
       --page-1:#1b1617;--page-2:#141011;--page-3:#0e0b0c;--page-1-l:#EEF4F6;--page-2-l:#ECEFE6;--page-3-l:#E9E0D0;
       --cw:168px}
 *{box-sizing:border-box}
 body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--cream);min-height:100vh;
      background:linear-gradient(180deg,var(--page-1) 0%,var(--page-2) 50%,var(--page-3) 100%);}
 body.light{--pink-ink:#AD0332;color:var(--charcoal);--ink-soft:#5f594e;
      background:linear-gradient(180deg,var(--page-1-l) 0%,var(--page-2-l) 48%,var(--page-3-l) 100%)}

 .stage{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:40px 18px}

 /* ── the card-back wall ─────────────────────────────────────────────── */
 .wall{position:absolute;inset:-4%;display:grid;gap:20px;padding:26px;
       grid-template-columns:repeat(4,var(--cw));justify-content:center;align-content:center;
       filter:blur(3.5px) saturate(.92);transform:scale(1.30);opacity:.55;pointer-events:none}
 body.light .wall{opacity:.62}
 .slot{width:var(--cw);height:calc(var(--cw)*1.397)}

 /* vvBackFace markup, CSS copied VERBATIM from card.html:443-451 so the mock cannot drift */
 .vvmono{width:100%;height:100%;border-radius:calc(var(--cw)*0.073);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
 .vvmonomark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:calc(var(--cw)*0.34);letter-spacing:-.02em;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.35)}
 .vvmonomark span{color:var(--pink)}
 .vvmono-cream{background:linear-gradient(158deg,#F7F2E6,#EAE2D0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),0 24px 60px -20px rgba(0,0,0,.5)}
 .vvmono-cream .vvmonomark{color:#1C1B1A}
 .vvmono-gold{background:linear-gradient(158deg,#F6DE93,#DC9E2C);box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.45),inset 0 0 0 calc(var(--cw)*0.026) #9a6a12,0 24px 60px -20px rgba(0,0,0,.5)}
 .vvmono-gold .vvmonomark{color:#3a2708}
 .vvmono-black{background:linear-gradient(158deg,#2c2926,#121010);box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(232,184,75,.55),inset 0 0 0 calc(var(--cw)*0.028) rgba(0,0,0,.6),0 24px 60px -20px rgba(0,0,0,.5)}
 .vvmono-black .vvmonomark{color:#F0EAD9}

 /* THE COLLISION FIX , a cream back on a cream daylight page loses its edge.
    Deepen the inset ring + add a real drop shadow, LIGHT MODE ONLY.
    Dark mode already separates by luminance and is left untouched. */
 body.light .vvmono-cream{
   background:linear-gradient(158deg,#EFE7D6,#DDD2BA);
   box-shadow:inset 0 0 0 1px rgba(28,27,26,.28), 0 10px 26px -10px rgba(28,27,26,.42);}

 /* ── the panel ──────────────────────────────────────────────────────── */
 .panel{position:relative;z-index:2;width:min(430px,100%);text-align:center;border-radius:22px;
        padding:34px 30px 30px;background:#FBF8F2;border:1px solid rgba(28,27,26,.10);
        box-shadow:0 40px 90px -30px rgba(28,27,26,.45)}
 body:not(.light) .panel{background:#241F1C;border-color:rgba(240,234,217,.20);box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}  /* lifted: #171412 measured 1.03 vs the page */

 .coin{width:88px;height:calc(88px*1.397);margin:0 auto 20px;--cw:88px}
 .eyebrow{font-family:Archivo,sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:#8a6a12;margin-bottom:7px}
 body:not(.light) .eyebrow{color:var(--gold)}   /* bright gold reads on charcoal; on cream it measured 1.74 */
 .ttl{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;line-height:1.1;letter-spacing:-.015em;margin-bottom:11px;color:var(--charcoal)}
 body:not(.light) .ttl{color:var(--cream)}
 .val{font-size:14.5px;line-height:1.6;color:#5f594e;margin:0 auto 22px;max-width:330px}
 body:not(.light) .val{color:rgba(240,234,217,.68)}

 .cap{display:flex;gap:8px}
 .cap input{flex:1;min-width:0;padding:12px 14px;font-size:14px;font-family:Inter,sans-serif;border-radius:11px;
            border:1px solid rgba(28,27,26,.18);background:#fff;color:var(--charcoal)}
 body:not(.light) .cap input{background:rgba(255,255,255,.06);border-color:rgba(240,234,217,.18);color:var(--cream)}
 .cap input::placeholder{color:#8a8276}
 .cap button{font-family:Archivo,sans-serif;font-weight:800;font-size:12px;letter-spacing:.05em;padding:12px 18px;border:0;border-radius:11px;
             background:var(--pink);color:#fff;cursor:pointer;white-space:nowrap}
 .cap button:hover{transform:translateY(-1px)}
 .fine{margin-top:12px;font-size:11.5px;color:#8a8276}
 body:not(.light) .fine{color:rgba(240,234,217,.45)}

 @media (max-width:720px){
   :root{--cw:104px}
   .wall{grid-template-columns:repeat(3,var(--cw));gap:13px;filter:blur(3px) saturate(.92);transform:scale(1.16)}
   .panel{padding:28px 20px 24px;border-radius:20px}
   .coin{width:74px;height:calc(74px*1.397);--cw:74px;margin-bottom:16px}
   .ttl{font-size:26px}
   .val{font-size:13.5px}
   .cap{flex-direction:column}
   .cap button{width:100%;padding:13px}
 }

 /* mock-only chrome */
 .tog{position:fixed;top:12px;right:12px;z-index:9;display:flex;gap:6px}
 .tog b{font-family:Archivo;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:999px;
        background:rgba(128,128,128,.22);cursor:pointer;font-weight:800}
</style></head>
<body class="light">

<div class="tog"><b onclick="document.body.classList.toggle('light')">theme</b></div>

<div class="stage">
  <div class="wall" id="wall"></div>

  <div class="panel">
    <div class="coin" id="coin"></div>
    <div class="eyebrow">Coming soon</div>
    <div class="ttl">My Club</div>
    <div class="val">Every card you keep and every verdict you settle, gathered in one place. We will tell you the moment it opens.</div>
    <div class="cap">
      <input type="email" placeholder="you@email.com" aria-label="Email address">
      <button type="button">Notify me</button>
    </div>
    <div class="fine">No account needed yet. One email, nothing else.</div>
  </div>
</div>

<script>
// vvBackFace , copied verbatim from vv-core.js so the mock uses the real asset
function vvBackFace(tier){
  tier = (tier==='black'||tier==='gold') ? tier : 'cream';
  return '<div class="vvmono vvmono-'+tier+'"><div class="vvmonomark">V<span>V</span></div></div>';
}
// TIER MIX , mirrors real rarity and teaches the ladder.
// vvFlipTier: Generational -> black, Iconic -> gold, everything else -> cream.
// 2 black + 3 gold + 7 cream = 12. Scattered, not clustered, so the eye reads a real shelf.
var MIX = ['cream','gold' ,'cream','black',      // row 1
           'cream','cream','gold' ,'cream',      // row 2
           'black','cream','gold' ,'cream'];     // row 3
document.getElementById('wall').innerHTML =
  MIX.map(function(t){ return '<div class="slot">'+vvBackFace(t)+'</div>'; }).join('');
document.getElementById('coin').innerHTML = vvBackFace('gold');
</script>
</body></html>
