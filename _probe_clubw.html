 await document.fonts.load('700 8.5px Archivo'); await document.fonts.ready;
 const s=document.getElementById('s'), res=[];
 NAMES.forEach(function(n,i){ const t=document.createElementNS('http://www.w3.org/2000/svg','text');
   t.setAttribute('class','tjclub'); t.setAttribute('x','10'); t.setAttribute('y', 12+i*12);

 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 [...s.querySelectorAll('text')].forEach(function(t){ const b=t.getBBox();
   res.push({n:t.textContent, w:+b.width.toFixed(2), c:t.textContent.length, k:+(b.width/t.textContent.length).toFixed(3)}); });

 const ks=res.map(r=>r.k).sort((a,b)=>a-b);

   'FONT LOADED: '+document.fonts.check('700 8.5px Archivo')+'\n'
   +'n names: '+res.length+'\n'
   +'widest 8: '+res.slice(0,8).map(r=>r.n+'='+r.w).join(', ')+'\n'
   +'narrowest 5: '+res.slice(-5).map(r=>r.n+'='+r.w).join(', ')+'\n'
   +'per-char advance k: min '+ks[0]+'  median '+ks[Math.floor(ks.length/2)]+'  max '+ks[ks.length-1]+'\n'
