<!doctype html><meta charset="utf-8"><title>correlation panel , rebuilt</title>
<style>html,body{margin:0;background:#2b2b2b;color:#eee;font:11px system-ui}
 .r{display:flex;gap:14px;padding:14px;align-items:flex-start}
 .c{display:flex;flex-direction:column;gap:5px}
 .lab{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
 iframe{border:1px solid #666;display:block}</style>
<div class="r">
 <div class="c"><div class="lab">desktop 1000 , light</div><iframe id="a" style="width:1000px;height:560px"></iframe></div>
 <div class="c"><div class="lab">390 light</div><iframe id="b" style="width:390px;height:560px"></iframe></div>
 <div class="c"><div class="lab">390 dark</div><iframe id="c" style="width:390px;height:560px"></iframe></div>
</div>
<script>
var t=Date.now();
[['a',true],['b',true],['c',false]].forEach(function(x,i){
  var f=document.getElementById(x[0]);
  f.src='/playbook.html?_='+(t+i)+'#s-gk';
  f.addEventListener('load',function(){
    try{
      var d=f.contentDocument;
      d.body.classList.toggle('light', x[1]);
      setTimeout(function(){
        var el=d.querySelector('.gkwhat');
        if(el) el.scrollIntoView({block:'center'});
      },500);
    }catch(e){}
  });
});
</script>
