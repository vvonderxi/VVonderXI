<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VVonderXI , coming soon, premium directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*  DEMO HARNESS ONLY , ?d=a|b|c picks the direction, ?t=light|dark forces the theme.
    The shipped page has no such parameters. Everything below the DIRECTION blocks is
    shared, so the three differ only in how they spend the vertical budget. */
:root{--cream:#F0EAD9;--pink-ink:#FF5C7A;--cw:300px;--sp:234px}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--cream);
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,244,224,.07), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);
  background-attachment:fixed}
body.light{color:#241f1a;
  background:radial-gradient(150% 620px at 50% -140px, rgba(255,255,255,.7), transparent 78%),
             radial-gradient(120% 90% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);
  background-attachment:fixed}

/* ── the backs, copied from compare.html, plain black not Generational ───────── */
.vvmono{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*0.073);
  display:flex;align-items:center;justify-content:center;position:relative}
.vvmonomark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:calc(var(--cw)*0.34);letter-spacing:-.02em;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.3)}
.vvmono-cream{background:linear-gradient(158deg,#FBF7EF,#E4DAC6);
  box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.7),
             inset 0 0 0 calc(var(--cw)*0.026) rgba(140,120,90,.35),0 24px 60px -20px rgba(0,0,0,.5)}
.vvmono-cream .vvmonomark{color:#1C1B1A}
.vvmono-cream .vvmonomark span{color:#AD0332}
.vvmono-gold{background:linear-gradient(158deg,#F6DE93,#DC9E2C);
  box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.45),
             inset 0 0 0 calc(var(--cw)*0.026) #9a6a14,0 24px 60px -20px rgba(120,80,10,.55)}
.vvmono-gold .vvmonomark{color:#2b1d05}
.vvmono-gold .vvmonomark span{color:#AD0332}
.vvmono-black{background:linear-gradient(158deg,#2c2926,#121010);
  box-shadow:inset 0 0 0 calc(var(--cw)*0.016) rgba(255,255,255,.07),
             inset 0 0 0 calc(var(--cw)*0.026) rgba(255,255,255,.11),
             0 24px 60px -20px rgba(0,0,0,.72)}
.vvmono-black .vvmonomark{color:#F0EAD9}
.vvmono-black .vvmonomark span{color:var(--pink-ink)}

/* ── THE ARRIVAL , CARDS BEING LAID DOWN, NOT FADED IN ────────────────────────
    A fade says "content appeared". A card being dealt has weight: it comes from
    above and slightly larger (nearer the viewer), settles onto the surface, and
    its shadow tightens as it lands. Three things carry that and all three are
    transforms or opacity, so it stays on the compositor:
      , translateY from -34px, so it falls rather than materialises
      , scale from 1.05 to 1, so it reads as approaching the surface
      , a shadow layer that starts wide and soft and tightens as it settles
    The easing is the whole difference. cubic-bezier(.17,.84,.38,1) decelerates
    hard and overshoots by a hair, which is what a laid-down object does; a plain
    ease-out arrives politely and dead. Stagger is 130ms , slow enough to read as
    three separate actions rather than one blur.  */
.fanc{position:absolute;opacity:0;
  transform:translate3d(0,-34px,0) rotate(0deg) scale(1.05);
  transition:transform .92s cubic-bezier(.17,.84,.38,1), opacity .5s ease}
.fanc::after{content:'';position:absolute;inset:0;border-radius:calc(var(--cw)*0.073);
  pointer-events:none;box-shadow:0 60px 90px -30px rgba(0,0,0,.75);opacity:0;
  transition:opacity .92s cubic-bezier(.17,.84,.38,1)}
body.go .fanc{opacity:1}
body.go .fanc::after{opacity:1}
body.go .f1{transform:translate3d(calc(-1 * var(--sp)),0,0) rotate(-8deg);transition-delay:.06s}
body.go .f2{transform:translate3d(0,0,0)                    rotate(0deg); transition-delay:.19s}
body.go .f3{transform:translate3d(var(--sp),0,0)            rotate(8deg); transition-delay:.32s}

.stage{position:relative;display:flex;justify-content:center;align-items:center;
  min-height:calc(var(--cw)*1.397)}
.mark{display:block;height:44px;width:auto}

/* ── the words ───────────────────────────────────────────────────────────────── */
.tag{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;
  line-height:1.12;letter-spacing:-.025em;margin:0;max-width:13em}
.tag .pk{color:var(--pink-ink)}
body.light .tag .pk{color:#AD0332}
.brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;opacity:.5}

/*  THE FORM IS A FOOTNOTE, NOT A PANEL. The boxed version competed with the cards
    for the eye: a filled ground, a pink border and a 17.5px heading is a second
    focal point on a page that should have one. This is a label, a ruled line and
    a text button , it reads as an invitation rather than a call to action, and it
    only asserts itself on focus. */
.notify{width:100%;max-width:400px}
.nlab{font-family:'Archivo',sans-serif;font-weight:800;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;opacity:.42;margin-bottom:11px}
.form{display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.20);padding-bottom:9px;
  transition:border-color .3s ease}
body.light .form{border-bottom-color:rgba(0,0,0,.20)}
.form:focus-within{border-bottom-color:var(--pink-ink)}
.form input{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;
  font-size:15px;outline:none;padding:2px 0}
.form input::placeholder{opacity:.34}
.form button{font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;background:none;border:0;color:inherit;cursor:pointer;
  opacity:.62;padding:2px 0;white-space:nowrap;transition:opacity .25s ease}
.form button:hover{opacity:1}
.nnote{font-size:11.5px;opacity:.4;margin-top:11px;line-height:1.5}

/*  Everything that is not a card arrives after the cards have landed, and only
    then. The fan finishes at .32 + .92 = 1.24s; the words start at 1.15s so they
    overlap by a breath rather than queueing politely behind. */
.mark,.tag,.brand,.notify{opacity:0;transform:translateY(10px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.22,.61,.36,1)}
body.go .mark  {opacity:1;transform:none;transition-delay:.02s}
body.go .tag   {opacity:1;transform:none;transition-delay:1.15s}
body.go .brand {opacity:1;transform:none;transition-delay:1.30s}
body.go .notify{opacity:1;transform:none;transition-delay:1.44s}

/* ══ DIRECTION A , THE STATEMENT, THEN THE SENTENCE. Screen one holds the logo
      and the fan and NOTHING ELSE; the headline, the brand line and the form all
      live on screen two.
      THE FIRST VERSION OF THIS TRIED TO KEEP THE HEADLINE ON SCREEN ONE TOO AND IT
      DOES NOT FIT: at 1440x760 the card came out 365px and pushed the headline 32px
      below the fold , the words were cut in half, which is worse than putting them
      deliberately over the fold. Once the headline moves down, the reserve drops to
      the logo and the cue and the card can be large at exactly the height where the
      stacked build collapsed to 141px. ═══════════════════════════════════════ */
body.a .wrap{max-width:1180px;margin:0 auto;padding:clamp(30px,5vh,64px) 32px clamp(24px,4vh,48px);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:0}
body.a .mark{margin-bottom:clamp(28px,5vh,58px)}
body.a .tag{font-size:clamp(32px,4.6vw,58px);max-width:14em}
body.a .brand{margin-top:clamp(18px,2.6vh,30px)}
body.a .foot{min-height:82vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:0 32px 10vh;gap:0}
body.a .foot .notify{margin-top:clamp(40px,7vh,86px)}
body.a .cue{margin-top:clamp(26px,4.4vh,52px);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;font-family:'Archivo',sans-serif;font-weight:800;opacity:.3}

/* ══ DIRECTION B , SPLIT. The fan takes a column of its own, so the words and the
      form never compete with it for vertical space at all. This is the only one
      of the three where a 760px laptop keeps BOTH a very large card AND the form
      above the fold, because they are side by side rather than stacked. ═══════ */
body.b .wrap{min-height:100vh;display:grid;grid-template-columns:1.32fr .68fr;
  align-items:center;gap:clamp(40px,6vw,110px);
  max-width:1440px;margin:0 auto;padding:0 clamp(32px,5vw,84px)}
body.b .left{display:flex;justify-content:center}
body.b .right{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
body.b .mark{margin-bottom:clamp(26px,4.4vh,46px)}
body.b .tag{font-size:clamp(30px,3.5vw,50px)}
body.b .brand{margin-top:clamp(16px,2.4vh,26px)}
body.b .notify{margin-top:clamp(34px,6vh,66px)}

/* ══ DIRECTION C , BLEED. The fan is wider than the viewport and the outer backs
      run off both edges. Cropping is the point: a card that continues past the
      frame reads as bigger than the screen, which no contained card can. The
      words sit over the lower third. The cost is that the outer two marks are
      partly cut, so the fan states "cards" rather than "three tiers" , that is
      the trade, and it is why this is a direction and not the default. ═══════ */
/*  C IS FULL-BLEED AND CROPPED AT THE TOP. The fan is taller and wider than the space
    it is given: the outer backs run off the sides and the tops of all three are cut by
    the upper edge. Cropping is the whole point , a card that continues past the frame
    reads as bigger than the screen, and nothing contained ever can.
    IT GOT HERE BY FAILING THE OTHER WAY FIRST. The first version put the words ON the
    cards over a scrim, which needed to reach .93 opacity to make white type legible over
    the GOLD back , and a scrim that strong dissolved the bottom half of the cards it
    existed to show off. In light theme they washed out to nothing. Cropping from the top
    instead buys the same "bigger than the frame" effect and leaves the words a clear
    ground, so nothing has to be faded at all.
    THE COST, STATED: the marks sit high on the backs, so cropping the tops crowds them,
    and the outer two are cut by the sides. The fan says "cards" rather than "three
    tiers". That is the trade, and it is why this is a direction rather than the default. */
body.c .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;text-align:center;padding:0 24px clamp(34px,6vh,70px)}
/*  THE LOGO SITS BELOW THE FAN IN C, NOT ABOVE IT. Pinned to the top it landed ON the
    gold back , the one surface on this page with no contrast to spare , and in dark
    theme it disappeared completely. Cropping from the top means there is no clear space
    up there to pin anything to, so the mark joins the words in the band that is clear
    by construction. */
body.c .mark{margin-top:clamp(22px,3.6vh,44px)}
/*  The crop itself: the stage is shorter than the cards inside it and clips the overflow
    at the top, so the fan is cut by the frame rather than shrunk to fit it. */
body.c .cropper{width:100%;height:var(--croph);overflow:hidden;display:flex;
  align-items:flex-end;justify-content:center;position:relative}
body.c .stage{min-height:0;height:calc(var(--cw)*1.397)}
body.c .tag{font-size:clamp(28px,4.2vw,54px);margin-top:clamp(20px,3.2vh,38px)}
body.c .brand{margin-top:clamp(12px,2vh,22px)}
body.c .notify{margin-top:clamp(26px,4.2vh,50px);text-align:center}

@media (max-width:820px){
  body.b .wrap{grid-template-columns:1fr;gap:clamp(30px,5vh,48px);
    padding:clamp(34px,6vh,54px) 22px clamp(40px,7vh,60px);min-height:auto}
  body.b .right{align-items:center;text-align:center}
  body.b .notify{margin-top:clamp(26px,4vh,40px)}
  body.a .wrap{padding:0 20px}
  body.a .foot{min-height:34vh;padding:0 22px 7vh}
  .notify{max-width:340px}
  body.a .notify,body.c .notify{text-align:center}
  .form{justify-content:center}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
  .fanc,.mark,.tag,.brand,.notify{opacity:1 !important}
  .fanc::after{opacity:1 !important}
  .mark,.tag,.brand,.notify{transform:none !important}
  .f1{transform:translate3d(calc(-1 * var(--sp)),0,0) rotate(-8deg) !important}
  .f2{transform:translate3d(0,0,0) rotate(0deg) !important}
  .f3{transform:translate3d(var(--sp),0,0) rotate(8deg) !important}
}
</style>
</head>
<body>
<script>
(function(){
  var Q=new URLSearchParams(location.search);
  var D=(Q.get('d')||'a').toLowerCase(), T=Q.get('t');
  var light = T ? (T==='light') : false;

  document.body.className=D+(light?' light':'');

  var fan='<div class="stage" id="stage">'
    +'<div class="fanc f1"><div class="vvmono vvmono-cream"><div class="vvmonomark">V<span>V</span></div></div></div>'
    +'<div class="fanc f2"><div class="vvmono vvmono-gold"><div class="vvmonomark">V<span>V</span></div></div></div>'
    +'<div class="fanc f3"><div class="vvmono vvmono-black"><div class="vvmonomark">V<span>V</span></div></div></div>'
    +'</div>';
  var mark='<img class="mark" id="mark" src="/assets/spinelogo-'+(light?'light':'dark')+'.png" alt="VVonderXI" width="100" height="44">';
  var words='<div class="tag">Every Season Tells a Different <span class="pk">Story</span></div>'
    +'<div class="brand">The Football Legacy Platform</div>';
  var form='<div class="notify">'
    +'<div class="nlab">Be first through the door</div>'
    +'<div class="form"><input type="email" placeholder="you@email.com" aria-label="Your email address">'
    +'<button type="button">Notify me</button></div>'
    +'<div class="nnote">One message when it opens. Nothing else, ever.</div></div>';

  var w=document.createElement('div'); w.className='wrap';
  if(D==='b'){
    w.innerHTML='<div class="left">'+fan+'</div><div class="right">'+mark+words+form+'</div>';
    document.body.appendChild(w);
  } else if(D==='a'){
    w.innerHTML=mark+fan+'<div class="cue">Scroll</div>';
    document.body.appendChild(w);
    var f=document.createElement('div'); f.className='foot'; f.innerHTML=words+form;
    document.body.appendChild(f);
  } else {
    w.innerHTML='<div class="cropper">'+fan+'</div>'+mark+words+form;
    document.body.appendChild(w);
    document.documentElement.classList.add('cbleed');
  }

  /*  THE REVEAL IS SCHEDULED BEFORE ANYTHING THAT CAN THROW , everything starts at
      opacity 0, so one exception means a blank page. */
  function reveal(){ document.body.classList.add('go'); }
  requestAnimationFrame(function(){ requestAnimationFrame(reveal); });
  setTimeout(reveal,80);
  document.addEventListener('visibilitychange',reveal,{once:true});

  /*  SIZING. Each direction spends the vertical budget differently, so each gets its
      own rule rather than one formula with exceptions.
        A , the fan owns the first screen minus the mark and the headline block.
        B , two columns, so the fan is bounded by the COLUMN, not by the stack. This
            is why B keeps a very large card at 760px where the stacked build fell
            to 141px: nothing else is competing for that height.
        C , sized off WIDTH and allowed to exceed it; the crop is the effect.
      All three still floor at 112 and all three set --sp from the card, so the fan
      cannot silently re-overlap its own marks. */
  /*  THE PHONE SPREAD IS TIGHTER THAN THE DESKTOP ONE ON PURPOSE, AND TIGHTER THAN THE
      SHIPPED PAGE'S. Three cards side by side in 390px cannot each be large unless they
      overlap: at 0.64 the card came out 130px, SMALLER than the 143 that ships today,
      which fails the whole point of this pass. 0.44 buys 175px , a quarter bigger than
      shipped and a third bigger than the first attempt here , at the price of the outer
      marks being substantially covered. On a phone the fan reads as a DECK rather than
      as three named tiers, and that is the deliberate trade.
      SETTLED AT 0.52 RATHER THAN 0.44. At 0.44 the card reached 185px but only the black
      back's mark was still visible , the other two were covered almost entirely, and a
      fan where two of three cards show no mark has stopped saying anything about tiers
      at all. 0.52 gives up 20px of card to keep all three marks at least partly readable. */
  var SPREAD_WIDE=0.78, SPREAD_NARROW=0.52, ROT=1.10, ROT_NARROW=1.06, MIN=112;

  function size(){
    var vw=innerWidth, vh=innerHeight, wide=vw>820;
    var sp = wide?SPREAD_WIDE:SPREAD_NARROW, cw;

    if(D==='b' && wide){
      /*  bounded by the column, and by height only loosely , the words beside it are
          shorter than the fan by design. */
      /*  THIS RATIO MUST TRACK grid-template-columns ABOVE. It did not: the CSS went
          to 1.32fr and this stayed at 1.05, so the fan was sized for a column narrower
          than the one it was in and came out 235px , barely above the 215 it was meant
          to beat. Two numbers describing one layout, in two languages, is the same
          class of defect as the hard-coded spread. */
      var GRID_LEFT=1.32, GRID_TOTAL=2.0;
      var gap=Math.min(110,Math.max(40,vw*0.06));
      var colW=(Math.min(1440,vw)-2*Math.min(84,Math.max(32,vw*0.05)))*(GRID_LEFT/GRID_TOTAL)-gap/2;
      sp=0.62;                       // tighter than A/C , the column is the constraint
      cw=Math.min(colW/((1+2*sp)*ROT), (vh*0.88)/1.397, 460);
    } else if(D==='c'){
      /*  DELIBERATELY EXCEEDS THE VIEWPORT , that is the direction. Bounded by HEIGHT
          only, never by width: the fan is meant to run off both edges, so constraining
          it horizontally would defeat the whole idea. 0.78 of the height leaves the
          scrim something to sit on. */
      /*  Sized off the FULL height and then only part of it shown , that is what produces
          the crop. But it still needs a WIDTH bound, and the first version had none: at
          390px the card came out 435 and the fan was 1071px wide inside a 390px viewport,
          so the cream back was entirely off-screen and the page read as one gold rectangle
          rather than a fan. Bleeding past the frame is the effect; bleeding until only one
          card is left is just a crop bug. The cap below keeps roughly a quarter of the fan
          past each edge on a phone, which still reads as three. */
      sp = wide?0.74:0.62;
      var widthBound = wide ? vw*0.42 : vw*0.62;
      cw=Math.min((vh*(wide?1.02:0.72))/1.397, widthBound, 540);
    } else {
      /*  A, and B on a phone: the fan shares the column with the words. */
      /*  A reserves only what is actually on screen one now: the logo, its margin, the
          scroll cue and the wrapper padding. The headline block moved to .foot. */
      var reserve = wide ? 268 : 232;
      var rot = wide?ROT:ROT_NARROW, pad = wide?64:40;
      cw=Math.min((vh-reserve)/1.397, (vw-pad)/((1+2*sp)*rot), 460);
    }
    cw=Math.round(Math.max(MIN,cw));
    document.querySelectorAll('.vvmono').forEach(function(el){ el.style.setProperty('--cw',cw+'px'); });
    document.body.style.setProperty('--sp', Math.round(cw*sp)+'px');
    var st=document.getElementById('stage');
    if(st) st.style.height=Math.round(cw*1.397)+'px';
    /*  how much of that card is actually visible , the rest is cut by the top edge */
    /*  How much of the card shows through. Moving the logo out of the top and into the
        clear band cost vertical space and pushed the form 55px below the fold, so the
        crop window pays for it rather than the form. */
    if(D==='c') document.body.style.setProperty('--croph',
      Math.round(vh*(wide?0.50:0.42))+'px');
  }
  addEventListener('resize',size);
  try{ size(); }catch(e){}
})();
</script>
</body></html>
