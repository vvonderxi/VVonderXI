<!doctype html>
<html><head><meta charset="utf-8">
<title>Compare on a phone , 390px directions</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink-soft:#a49d93;--gold-ink:#E8B84B;--cream:#F0EAD9;--cream-deep:#E2D8C4;--charcoal:#1C1B1A;--pink:#E70443;--pink-ink:#F1688E;--pink-glow:#FF8FA3;--green:#2E8C5A;--gold:#E8B84B;--blue:#3B6FB0;--panel-t:#1C6038;--panel-b:#0F3A22;
    /* ── TONAL DEPTH , four surface tiers (dark values; light overridden in body.light).
       Purpose: the page had ONE tone , every .vsect computed to #fff on a near-flat
       cream stage, and .vfinal (the payoff) had no background at all. These give the
       page a floor -> plinth -> panel -> hero ladder so the verdict can sit on top.
       HARD RULE: any tier that carries a CHART (radar, trajectory) must follow the
       BODY theme, because the chart colours are body.light-qualified. Light theme ->
       light panel, dark theme -> dark panel. Never a dark panel under a light body. */
    --surf-stage:#141011;   /* .verdict , the stage everything sits in */
    --surf-plinth:#171412;  /* .matchup , so the cards sit ON something */
    --surf-hero:#2A2422;    /* .vfinal  , the payoff                   */
    --edge-hero:rgba(255,92,122,.30)}
/* ONE REAL DOCUMENT PER PHONE. The first build of this demo drew all eight phones in one
   document and scoped the theme with a .light class on the phone box. That does NOT work:
   VV_CARD_CSS keys the card face off `body.light`, so every light phone rendered a card with
   DARK-mode ink on a light ground , §C's own trap, the one that put six .gen inks at 1.09
   contrast. Each phone is now its own iframe with its own body class, which is also the only
   way to get an honest content height (a clipped container reports the clip, not the content). */
html,body{margin:0}
body.pv{background:#4a4a4a;font-family:'Inter',system-ui,sans-serif;color:#eee}
.wrap{padding:0 18px 22px;display:flex;gap:16px;align-items:flex-start;overflow-x:auto}
.col2{flex:none}
h1{font-family:'Archivo';font-size:17px;margin:0 0 4px}
.lede{font-size:12px;opacity:.78;margin:0 0 14px;max-width:1240px;line-height:1.55}
.lede b{color:#ffd9a0}
.ttl{font-family:'Archivo';font-weight:800;font-size:13px;margin:0 0 3px}
.note{font-size:11px;opacity:.72;margin:0 0 8px;width:796px;line-height:1.45;min-height:44px}
.pair{display:flex;gap:16px}
.phonewrap{position:relative;width:390px}
iframe.ph{width:390px;height:844px;border:1px solid #000;display:block;background:#111}
.fold{position:absolute;left:0;right:0;top:844px;border-top:2px dashed rgba(255,90,90,.95);pointer-events:none}
.foldlbl{position:absolute;right:3px;top:826px;font-size:9px;color:#ff8a8a;pointer-events:none}
.meas{font-size:10.5px;opacity:.66;margin:8px 0 0;line-height:1.55;font-variant-numeric:tabular-nums;width:390px}
.meas b{color:#9fe0a8}.meas .bad{color:#ff9a9a}
/* ================= PHONE DOCUMENT ================= */
body.phone{width:390px;height:844px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#221E1A 0%,#141210 55%,#0e0c0b 100%);color:var(--cream)}
body.phone.light{background:radial-gradient(120% 80% at 50% 0%,#FBF7EF 0%,#F2EBDD 55%,#E9E1D0 100%);color:#241f1a}
.top{height:44px;display:flex;align-items:center;padding:0 14px;font-size:11px;opacity:.7;
  font-family:'Archivo';font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.vsmedal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo';font-weight:900;font-size:13px;background:linear-gradient(135deg,#F0D27A,#E0A93A);
  color:#5a4410;flex:none;box-shadow:0 6px 16px -6px rgba(232,184,75,.6)}
.vsmedal.sm{width:32px;height:32px;font-size:10.5px}
.slotlbl{font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  opacity:.5;margin-bottom:5px;text-align:center}
.ctlrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:0 14px}
.ctl{font-family:'Archivo';font-weight:700;font-size:11px;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:inherit;white-space:nowrap}
body.light .ctl{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.16)}
.settle{font-family:'Archivo';font-weight:900;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:linear-gradient(135deg,#E70443,#FF8FA3);color:#fff;border:none;border-radius:14px;padding:14px 30px;width:100%}
.emptyslot{width:var(--cw);height:calc(var(--cw)*1.397);border-radius:calc(var(--cw)*0.073);
  border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  font-family:'Archivo';font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;text-align:center;padding:10px}
body.light .emptyslot{border-color:rgba(0,0,0,.24)}
.pkfake{margin:0 14px;height:602px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);padding-top:14px;text-align:center;font-size:11px;opacity:.8;
  font-family:'Archivo';font-weight:700;box-sizing:border-box}
body.light .pkfake{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12)}
.scoreline{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Archivo';font-weight:900;font-size:26px}
.scoreline .sep{font-size:12px;font-weight:700;opacity:.55}
.win{color:var(--pink-ink)}
body.light .win{color:#AD0332}
.tagpill{display:inline-flex;font-family:'Archivo';font-weight:800;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;background:linear-gradient(90deg,#F0D27A,#E0A93A);color:#5a4410;padding:5px 11px;border-radius:999px}
.rule{flex:1;height:1px;background:currentColor;opacity:.16}
.peekcue{display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Archivo';font-weight:700;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
  .vvcard{--cw:300px;position:relative;width:var(--cw);max-width:92%;height:calc(var(--cw)*1.397);box-sizing:border-box;display:flex;flex-direction:column;border-radius:calc(var(--cw)*0.073);
    background:radial-gradient(130% 60% at 50% 0%, #F7F2E6 0%, var(--cream) 48%, var(--cream-deep) 100%) !important;
    box-shadow:0 26px 50px -22px rgba(0,0,0,0.6), inset 0 0 0 calc(var(--cw)*0.02) var(--cream), inset 0 0 0 calc(var(--cw)*0.025) rgba(28,27,26,0.55) !important;
    padding:calc(var(--cw)*0.055) calc(var(--cw)*0.07);color:#1C1B1A !important;font-family:'Barlow Condensed',sans-serif}
  .vvcard .chtagcell-cross{background:linear-gradient(90deg,#5A5856,#46443F) !important}
  .vvcard .chtagcell.gold{background:linear-gradient(90deg,#F0D27A,#E0A93A) !important;color:#5a4410}
  

  /* ===== Prestige whole-card treatment ===== */
  /* GENERATIONAL , deep BLACK card, gold ring + gold accents */
  body .vvcard.gen{background:radial-gradient(130% 60% at 50% 0%, #2c2824 0%, #16120e 50%, #090706 100%) !important;color:#F0EAD9 !important;box-shadow:0 22px 50px -22px rgba(0,0,0,0.85), inset 0 0 0 calc(var(--cw)*0.02) #16120e, inset 0 0 0 calc(var(--cw)*0.025) rgba(232,184,75,0.7) !important}

</style></head><body>
<script src="/vv-marks.js"></script>
<script src="/vv-core.js"></script>
<script>
var P=new URLSearchParams(location.search), D=P.get('d'), T=P.get('t');
var A={year:'03/04',club1:'#EF0107',number:14,pos:'ST',vv:93,flag:'\u{1F1EB}\u{1F1F7}',surname:'Henry',full:'Thierry Henry',clubname:'Arsenal',age:'26',goals:30,assists:7,prestige:'Iconic',tag:'\u{1F451} Iconic'};
var B={year:'22/23',club1:'#6CABDD',club2:'#004D98',number:9,pos:'ST',vv:90,flag:'\u{1F1F3}\u{1F1F4}',surname:'Haaland',full:'Erling Haaland',clubname:'Man City',age:'22',goals:36,assists:8,tag:'\u{1F45F} Golden Boot'};
function card(d,cw){ return '<div style="--cw:'+cw+'px;display:flex;justify-content:center">'+VVCore.buildCard(d,cw)+'</div>'; }
function slot(cw,t){ return '<div style="display:flex;justify-content:center"><div class="emptyslot" style="--cw:'+cw+'px">'+t+'</div></div>'; }
function gap(h){ return '<div style="height:'+h+'px"></div>'; }

var DIRS={
 current:function(){ return '<div class="top">Compare</div>'+gap(89)+slot(145,'Tap to pick<br>player A')+gap(26)
   +'<div class="pkfake">picker panel , auto-opened , 602px</div>'+gap(16)
   +'<div class="ctlrow"><span class="ctl">&#9733; Add to my club</span></div>'+gap(20)
   +'<div style="display:flex;justify-content:center"><div class="vsmedal">VS</div></div>'+gap(26)+slot(145,'Tap to pick<br>player B'); },

 d1:function(){ var cw=150; return '<div class="top">Compare</div>'
   +'<div style="padding:10px 12px 0;display:flex;align-items:flex-start;gap:8px">'
     +'<div style="flex:1;min-width:0"><div class="slotlbl">A</div>'+card(A,cw)+'</div>'
     +'<div style="align-self:center"><div class="vsmedal sm">VS</div></div>'
     +'<div style="flex:1;min-width:0"><div class="slotlbl">B</div>'+card(B,cw)+'</div>'
   +'</div>'+gap(18)
   +'<div class="scoreline"><span class="win">93</span><span class="sep">to</span><span>90</span></div>'+gap(14)
   +'<div class="ctlrow"><span class="ctl">Change A</span><span class="ctl">Swap</span><span class="ctl">Change B</span></div>'+gap(16)
   +'<div style="padding:0 14px"><button class="settle">Settle it</button></div>'+gap(14)
   +'<div class="ctlrow"><span class="ctl">See card A</span><span class="ctl">See card B</span></div>'; },

 d2:function(){ var cw=170; return '<div class="top">Compare</div>'
   +'<div style="padding:6px 14px 0;display:flex;align-items:flex-start;gap:12px">'
     +'<div style="flex:none">'+card(A,cw)+'</div>'
     +'<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:8px">'
       +'<div class="slotlbl" style="text-align:left;margin:0">Slot A</div>'
       +'<span class="ctl">Change player</span><span class="ctl">See full card</span><span class="ctl">&#9733; Add to club</span>'
     +'</div></div>'+gap(12)
   +'<div style="display:flex;align-items:center;gap:10px;padding:0 14px"><div class="rule"></div><div class="vsmedal sm">VS</div><div class="rule"></div></div>'
   +gap(12)
   +'<div style="padding:0 14px;display:flex;align-items:flex-start;gap:12px">'
     +'<div style="flex:none">'+card(B,cw)+'</div>'
     +'<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:8px">'
       +'<div class="slotlbl" style="text-align:left;margin:0">Slot B</div>'
       +'<span class="ctl">Change player</span><span class="ctl">See full card</span><span class="ctl">&#9733; Add to club</span>'
     +'</div></div>'; },

 d3:function(){ var cw=142; return '<div class="top">Compare</div>'
   +'<div style="padding:4px 14px 0;text-align:center"><div class="slotlbl" style="margin-bottom:8px">The verdict</div>'
     +'<span class="tagpill">&#128081; A masterclass</span>'+gap(10)
     +'<div class="scoreline"><span class="win">93</span><span class="sep">to</span><span>90</span></div></div>'+gap(14)
   +'<div style="padding:0 12px;display:flex;align-items:center;gap:8px">'
     +'<div style="flex:1;min-width:0">'+card(A,cw)+'</div><div class="vsmedal sm">VS</div>'
     +'<div style="flex:1;min-width:0">'+card(B,cw)+'</div></div>'+gap(16)
   +'<div class="ctlrow"><span class="ctl">Change A</span><span class="ctl">Swap</span><span class="ctl">Change B</span></div>'+gap(14)
   +'<div style="padding:0 14px"><button class="settle">Settle it</button></div>'+gap(12)
   +'<div class="peekcue">&#8595; the full read-out</div>'; }
};

var PANELS=[
 ['current','Current (bare load)','Both pickers auto-open at 602px each. Card A is the only thing on screen; measured on the real page the VS lands at y=1027 and card B at y=1124, both far below the 844 fold, and nothing on screen says a second slot exists. Note the weighting: the picker is 602px, the controls under A are 41px.'],
 ['d1','D1 , Two-up','Both slots side by side at 150px with the VS between them. The product reads as two things immediately, on first paint, with no scroll. Score, controls and Settle all clear the fold. Cost: the card is small, and the season sub-line is at the edge of legibility.'],
 ['d2','D2 , Stacked, controls beside the card','Cards stay large (170px) and the three controls move BESIDE card A instead of under it, which is what was pushing B down. The VS rule and the whole of card B clear the fold. Closest to the current design, smallest change.'],
 ['d3','D3 , Two-up, verdict-led','The answer leads and the two cards evidence it. Smallest cards (142px) but the entire proposition , two players, two scores, a verdict, a way to change either , is on one screen with room to spare.']
];

if(D){                                   /* ---- render ONE phone ---- */
  document.body.className='phone'+(T==='light'?' light':'');
  try{ VVCore.useCardMarks(true); }catch(e){}
  document.body.innerHTML=(DIRS[D]||DIRS.current)();
}else{                                   /* ---- render the contact sheet ---- */
  document.body.className='pv';
  var h='<div style="padding:18px 18px 0"><h1>Compare on a 390px phone , measured baseline and three directions</h1>'
   +'<p class="lede">Red dashed line is the 844px fold; each phone is its own document at 390x844 so <b>body.light is real per phone</b>. '
   +'<b>Measured on the live page first:</b> with both pickers CLOSED the current layout already fits , card A 133-336, VS 400-444, card B 497-699, Settle 797-850. '
   +'So the reported fault is real but its dominant cause is not the three controls: <b>each picker panel is 602px and compare auto-opens BOTH on a bare load</b>, '
   +'which is what puts card B at y=1124 with zero pixels visible. The controls under A measure 41px, plus a See-full-card link that is 0px until a card resolves. '
   +'<b>Fixing only the controls moves B by about 60px and it stays below the fold.</b></p></div><div class="wrap">';
  PANELS.forEach(function(p){
    h+='<div class="col2"><div class="ttl">'+p[1]+'</div><p class="note">'+p[2]+'</p><div class="pair">';
    ['dark','light'].forEach(function(t){
      h+='<div><div class="phonewrap"><iframe class="ph" data-k="'+p[0]+'-'+t+'" src="?d='+p[0]+'&t='+t+'"></iframe>'
        +'<div class="fold"></div><span class="foldlbl">fold 844</span></div><p class="meas" data-m="'+p[0]+'-'+t+'"></p></div>';
    });
    h+='</div></div>';
  });
  document.body.innerHTML=h+'</div>';
  window.addEventListener('load',function(){ setTimeout(measureAll,1200); });
}
function measureAll(){
  document.querySelectorAll('iframe.ph').forEach(function(f){
    var out=document.querySelector('[data-m="'+f.dataset.k+'"]'); if(!out) return;
    var d,w; try{ d=f.contentDocument; w=f.contentWindow; }catch(e){ out.textContent='cross-origin'; return; }
    if(!d){ out.textContent='no doc'; return; }
    var VH=844;
    var slots=d.querySelectorAll('.vvcard, .emptyslot');
    var rows=[];
    rows.push('slots on screen: '+slots.length);
    var bVis=0,bH=0;
    if(slots.length>=2){ var r=slots[1].getBoundingClientRect(); bH=r.height;
      bVis=Math.max(0,Math.min(r.bottom,VH)-Math.max(r.top,0)); }
    var pct=bH?Math.round(bVis/bH*100):0;
    rows.push('<b class="'+(pct>0?'':'bad')+'">slot B visible: '+Math.round(bVis)+' / '+Math.round(bH)+'px ('+pct+'%)</b>');
    // honest content height: the body is clipped, so measure the LAST element's bottom
    var all=d.body.querySelectorAll('*'); var maxB=0;
    all.forEach(function(el){ var b=el.getBoundingClientRect(); if(b.height&&b.bottom>maxB) maxB=b.bottom; });
    rows.push('content runs to: '+Math.round(maxB)+'px'+(maxB>VH?' <span class="bad">('+Math.round(maxB-VH)+' below fold)</span>':' <b>(fits)</b>'));
    out.innerHTML=rows.join('<br>');
  });
}
</script>
</body></html>
